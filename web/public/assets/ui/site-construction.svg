      <path d="M936 170c18-26 46-37 79-33-18 14-28 25-34 43 24-17 53-18 81-8-22 10-34 22-45 40-19-19-43-30-74-30-20 0-38 3-57 11 8-13 22-22 50-23z"/>
      <path d="M1026 197c9-24 28-38 52-40-10 14-13 24-12 39 12-18 29-24 50-22-12 10-18 19-21 32 13-9 27-9 41-3-13 6-20 12-25 24-13-12-29-19-49-19-15 0-26 2-36 6z"/>
    </g>

