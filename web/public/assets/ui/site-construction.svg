<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Site en construction</title>
  <desc id="desc">Illustration fantasy d'un panneau en bois devant un paysage vert avec le texte site en construction.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#59b8ff"/>
      <stop offset="55%" stop-color="#8fe0ff"/>
      <stop offset="100%" stop-color="#d8f7ff"/>
    </linearGradient>
    <linearGradient id="mountains" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8fe1ff"/>
      <stop offset="100%" stop-color="#3ca1d5"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#95df57"/>
      <stop offset="100%" stop-color="#3d942c"/>
    </linearGradient>
    <linearGradient id="path" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#c9a468"/>
      <stop offset="50%" stop-color="#dfc081"/>
      <stop offset="100%" stop-color="#b88754"/>
    </linearGradient>
    <linearGradient id="woodDark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8d4f1d"/>
      <stop offset="100%" stop-color="#5f2e10"/>
    </linearGradient>
    <linearGradient id="woodLight" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8d38f"/>
      <stop offset="100%" stop-color="#d39a50"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#77858f"/>
      <stop offset="100%" stop-color="#2d3840"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1d2b1f" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#122233" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
