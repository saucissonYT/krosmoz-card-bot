    <path d="M28 124q38 18 63 0" fill="none" stroke="#202a30" stroke-width="7" stroke-linecap="round"/>
    <path d="M9 116q34 34 92 34l-7 41q-52 9-90-20z" fill="#d9951a"/>
    <rect x="120" y="62" width="30" height="106" rx="12" fill="#6b3d18" stroke="#4b260f" stroke-width="7" transform="rotate(-25 135 115)"/>
    <rect x="112" y="28" width="62" height="52" rx="10" fill="#986128" stroke="#5a3012" stroke-width="7" transform="rotate(-25 143 54)"/>
