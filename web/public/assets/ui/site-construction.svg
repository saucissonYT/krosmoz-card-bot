  <g fill="#fff5da" opacity="0.8">
    <circle cx="292" cy="725" r="9"/>
    <circle cx="314" cy="748" r="11"/>
    <circle cx="1128" cy="744" r="11"/>
    <circle cx="1164" cy="726" r="9"/>
    <circle cx="1064" cy="780" r="10"/>
