  <path d="M0 760c145-34 241-26 377 9 123 31 214 30 352 0 172-38 300-42 463 0 163 42 273 51 408-12v143H0z" fill="#5aa52d"/>
  <path d="M120 900c102-71 213-111 340-120 180-13 276 27 425 20 130-6 253-53 401-45 109 6 217 30 314 69v76H120z" fill="url(#path)" opacity="0.88"/>

