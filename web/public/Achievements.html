<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Achievements - Krosmoz Card</title>
 <meta name="theme-color" content="#2e5d99">
 <link rel="stylesheet" href="/css/style.css">
</head>
<body class="achievements-page">
 <div class="page">
  <div class="container">
   <section class="achievements-hub">
    <header class="achievements-topbar fade-in">
     <div class="achievements-top-left">
      <a href="/play/quests" class="achievements-top-btn" aria-label="Retour">&#x2039;</a>
      <span class="achievements-top-title">achievements</span>
     </div>
     <div class="achievements-top-right">
      <div class="achievements-resource" aria-label="Kamas">
       <img src="/assets/ui/gain%20kamas%20level%20up.png" alt="Kamas">
       <strong id="achievementsKamasValue">--</strong>
      </div>
     </div>
    </header>

    <div id="achHubGrid" class="achievements-hub-grid fade-in stagger-1"></div>
   </section>
  </div>
 </div>

 <aside id="achModal" class="ach-modal" hidden>
  <div class="ach-modal-backdrop" data-ach-close-modal></div>
  <section class="ach-modal-shell" role="dialog" aria-modal="true" aria-labelledby="achModalTitle">
   <header class="ach-modal-head">
    <div class="ach-modal-head-left">
     <button id="achModalBackBtn" class="ach-modal-back-btn" type="button" aria-label="Retour">&lt;</button>
     <h2 id="achModalTitle">achievements</h2>
    </div>
   </header>
   <div class="ach-modal-body">
    <aside id="achModalSidebar" class="ach-modal-sidebar">
     <div id="achModalIconRail" class="ach-modal-icon-rail"></div>
    </aside>
    <section class="ach-modal-main">
     <header class="ach-modal-main-head">
      <h3 id="achModalCategoryTitle">Categorie</h3>
      <strong id="achModalCategoryCount">0/0</strong>
     </header>
     <div id="achModalList" class="ach-modal-list"></div>
     <div class="ach-modal-actions">
      <button id="achClaimAllBtn" class="ach-claim-all-btn" type="button">Tout récupérer</button>
     </div>
    </section>
   </div>
 </section>
 </aside>

 <aside id="achClaimPopup" class="ach-claim-popup" hidden>
  <div class="ach-claim-popup-backdrop"></div>
  <section class="ach-claim-popup-card">
   <h3>Récompenses récupérées</h3>
   <div id="achClaimPopupList" class="ach-claim-popup-list"></div>
  </section>
 </aside>

 <script>
 const CATEGORY_TILES = [
  { id: "collection", label: "COLLECTION", icon: "achievement collection icone.png" },
  { id: "daily", label: "DAILY", icon: "achievement daily icone.png" },
  { id: "gift", label: "DON", icon: "achievement don icone.png" },
  { id: "economy", label: "ECONOMIE", icon: "achievement économie icone.png" },
  { id: "event", label: "EVENTS", icon: "achievement events icone.png" },
  { id: "fragment", label: "FRAGMENT", icon: "achievement fragment icone.png" },
  { id: "fusion", label: "FUSION", icon: "achievement fusion icone.png" },
  { id: "guild", label: "GUILDE", icon: "achievement guilde icone.png" },
  { id: "krosmoshop", label: "KROSMOSHOP", icon: "achievement krosmoshop icone.png" },
  { id: "pack", label: "PACK", icon: "achievement pack icone.png" },
  { id: "rng", label: "RNG", icon: "achievement rng icone.png" },
  { id: "roulette", label: "ROULETTE", icon: "achievement roulette icone.png" },
  { id: "social", label: "SOCIAL", icon: "achievement social icone.png" },
  { id: "secret", label: "SECRETS", icon: "achievement secrets icone.png" }
 ]
 const CATEGORY_BY_ID = Object.fromEntries(CATEGORY_TILES.map((tile) => [tile.id, tile]))
const REWARD_ICON = {
  kamas: "/assets/ui/gain%20kamas%20level%20up.png",
  packs: "/assets/ui/gain%20packs%20level%20up.png",
  title: "/assets/ui/gain%20titre%20level%20up.png",
  badge: "/assets/ui/gain%20badge%20level%20up.png",
  card: "/assets/ui/gain%20carte%20level%20up.png",
  flame: "/assets/ui/flamme%20notif.png",
  xp: "/assets/ui/gain%20badge%20level%20up.png",
  fallback: "/assets/ui/gain%20carte%20level%20up.png"
 }

 const state = {
  connected: false,
  categories: {},
  modalCache: {}
 }

const modalState = {
  open: false,
  activeCategory: null,
  requestToken: 0
 }
 const modalRailDragState = {
  active: false,
  moved: false,
  startY: 0,
  startScrollTop: 0,
  ignoreClickUntil: 0
 }

 const ui = {
  grid: document.getElementById("achHubGrid"),
 modal: document.getElementById("achModal"),
  modalSidebar: document.getElementById("achModalSidebar"),
  modalRail: document.getElementById("achModalIconRail"),
  modalList: document.getElementById("achModalList"),
  modalCategoryTitle: document.getElementById("achModalCategoryTitle"),
  modalCategoryCount: document.getElementById("achModalCategoryCount"),
  modalBackBtn: document.getElementById("achModalBackBtn"),
  claimAllBtn: document.getElementById("achClaimAllBtn"),
  claimPopup: document.getElementById("achClaimPopup"),
  claimPopupList: document.getElementById("achClaimPopupList")
 }

 function esc(value) {
  return String(value ?? "")
   .replaceAll("&", "&amp;")
   .replaceAll("<", "&lt;")
   .replaceAll(">", "&gt;")
   .replaceAll('"', "&quot;")
   .replaceAll("'", "&#39;")
 }

 function toNumber(value) {
  const n = Number(value)
  return Number.isFinite(n) ? n : 0
 }

function formatInt(value) {
 return Math.max(0, Number(value || 0)).toLocaleString("fr-FR")
}

function toProgressInt(value, fallback = 0) {
 const n = Number(value)
 if (!Number.isFinite(n)) return Math.max(0, Number(fallback || 0))
 return Math.max(0, Math.floor(n))
}

 function setTopKamas(value) {
  const el = document.getElementById("achievementsKamasValue")
  if (!el) return
  const kamas = Number(value)
  el.textContent = Number.isFinite(kamas) && kamas >= 0 ? formatInt(kamas) : "--"
 }

 function toIconUrl(filename) {
  return `/assets/ui/${encodeURIComponent(String(filename || ""))}`
 }

 function getCategoryLabel(categoryId) {
  return CATEGORY_BY_ID?.[categoryId]?.label || String(categoryId || "").toUpperCase()
 }

function getStat(categoryId) {
  const raw = state.categories?.[categoryId] || {}
  const unlocked = Math.max(0, toNumber(raw.unlocked))
  const total = Math.max(unlocked, toNumber(raw.total))
  const percent = total > 0 ? Math.max(0, Math.min(100, Math.round((unlocked / total) * 100))) : 0
  const pending = Math.max(0, toNumber(raw.pending))
  return { unlocked, total, percent, pending }
 }

 function rewardParts(item) {
  const reward = item?.reward || {}
  const parts = []

  if (toNumber(reward.kamas) > 0) {
   parts.push({
    icon: REWARD_ICON.kamas,
    label: `${formatInt(reward.kamas)} kamas`
   })
  }
  if (toNumber(reward.xp) > 0) {
   parts.push({
    icon: REWARD_ICON.xp,
    label: `${formatInt(reward.xp)} XP`
   })
  }
  if (toNumber(reward.packs) > 0) {
   parts.push({
    icon: REWARD_ICON.packs,
    label: `${formatInt(reward.packs)} pack${toNumber(reward.packs) > 1 ? "s" : ""}`
   })
  }

  const text = String(item?.rewardText || "").trim()
  if (text) {
   const chunks = text.split(/[·,]/).map((v) => v.trim()).filter(Boolean)
   for (const chunk of chunks) {
    const low = chunk.toLowerCase()
    let icon = REWARD_ICON.fallback
    if (low.includes("kama")) icon = REWARD_ICON.kamas
    else if (low.includes("pack")) icon = REWARD_ICON.packs
    else if (low.includes("titre")) icon = REWARD_ICON.title
    else if (low.includes("badge") || low.includes("xp")) icon = REWARD_ICON.badge
    else if (low.includes("carte")) icon = REWARD_ICON.card
    parts.push({ icon, label: chunk })
   }
  }
  if (parts.length > 0) return parts
  return [{ icon: REWARD_ICON.fallback, label: "Récompense cachée" }]
 }

 function renderRewardBadges(item) {
  return rewardParts(item).map((part) => `
   <div class="ach-modal-reward-chip">
    <img src="${esc(part.icon)}" alt="">
    <span>${esc(part.label)}</span>
   </div>
  `).join("")
 }

 function renderGrid() {
  ui.grid.innerHTML = CATEGORY_TILES.map((tile, index) => {
   const stat = getStat(tile.id)
   const flame = stat.pending > 0
    ? `<img src="${esc(REWARD_ICON.flame)}" alt="Récompenses disponibles" class="ach-notif-flame">`
    : ""
   return `
    <article class="achievements-hub-card" data-ach-open-category="${tile.id}" role="button" tabindex="0" style="animation-delay:${(index * 0.03).toFixed(2)}s">
     <img src="${toIconUrl(tile.icon)}" alt="${tile.label}" class="achievements-hub-icon" loading="lazy" draggable="false">
     ${flame}
     <h3>${esc(tile.label)}</h3>
     <p class="achievements-hub-count">${stat.unlocked}/${stat.total || 0}</p>
     <div class="achievements-hub-bar" aria-hidden="true">
      <span style="width:${stat.percent}%"></span>
     </div>
    </article>
   `
  }).join("")

 }

 function renderModalRail() {
  const activeId = String(modalState.activeCategory || "")
  ui.modalRail.innerHTML = CATEGORY_TILES.map((tile) => {
   const stat = getStat(tile.id)
   const flame = stat.pending > 0
    ? `<img src="${esc(REWARD_ICON.flame)}" alt="Récompenses disponibles" class="ach-notif-flame">`
    : ""
   return `
   <button type="button" class="ach-modal-icon-btn ${activeId === tile.id ? "active" : ""}" data-ach-modal-category="${tile.id}" aria-label="${esc(tile.label)}" title="${esc(tile.label)}">
    <img src="${toIconUrl(tile.icon)}" alt="${esc(tile.label)}" draggable="false">
    ${flame}
   </button>
  `
  }).join("")
 }

function renderModalList(items = []) {
  if (!Array.isArray(items) || items.length <= 0) {
   ui.modalList.innerHTML = `<p class="ach-modal-empty">Aucun succès dans cette catégorie.</p>`
   return
  }

 ui.modalList.innerHTML = items.map((item) => {
   const done = Boolean(item?.unlocked)
   const goal = Math.max(1, toProgressInt(item?.progressGoal, 1))
   let current = toProgressInt(item?.progressCurrent, 0)
   if (done) current = goal
   const progress = goal > 0 ? Math.max(0, Math.min(100, Math.round((current / goal) * 100))) : (done ? 100 : 0)
   const ratio = `${current}/${goal}`
   const description = String(item?.description || item?.title || "")
   const claimable = Boolean(item?.pendingClaim)
   const stateText = claimable ? "À récupérer" : (done ? "Terminé" : `En cours ${ratio}`)
   return `
   <article class="ach-modal-task ${done ? "done" : "pending"}">
     <div class="ach-modal-task-body">
      <div class="ach-modal-task-head">
       <h4><span class="ach-modal-task-badge">${esc(item?.badge || "🏅")}</span>${esc(item?.name || "Succès")}</h4>
       <span class="ach-modal-task-ratio">${ratio}</span>
      </div>
      <p class="ach-modal-task-desc">${esc(description)}</p>
      <div class="ach-modal-task-progress"><span style="width:${progress}%"></span></div>
      <span class="ach-modal-task-state">${esc(stateText)}</span>
     </div>
     <div class="ach-modal-task-rewards">${renderRewardBadges(item)}</div>
    </article>
   `
  }).join("")
}

 function popupEntriesFromTotals(totals = {}) {
  const rows = []
  const packs = toProgressInt(totals?.packs, 0)
  const kamas = toProgressInt(totals?.kamas, 0)
  const cards = toProgressInt(totals?.cards, 0)
  const xp = toProgressInt(totals?.xp, 0)

  if (packs > 0) rows.push({ icon: REWARD_ICON.packs, label: `${formatInt(packs)} pack${packs > 1 ? "s" : ""}` })
  if (kamas > 0) rows.push({ icon: REWARD_ICON.kamas, label: `${formatInt(kamas)} kamas` })
  if (cards > 0) rows.push({ icon: REWARD_ICON.card, label: `${formatInt(cards)} carte${cards > 1 ? "s" : ""}` })
  if (xp > 0) rows.push({ icon: REWARD_ICON.xp, label: `${formatInt(xp)} XP` })

  return rows
 }

 function showClaimPopup(totals = {}) {
  if (!ui.claimPopup || !ui.claimPopupList) return
  const rows = popupEntriesFromTotals(totals)
  if (rows.length <= 0) {
   ui.claimPopupList.innerHTML = `<p class="ach-claim-empty">Aucune récompense en attente.</p>`
  } else {
   ui.claimPopupList.innerHTML = rows.map((row, index) => `
    <article class="ach-claim-row" style="animation-delay:${(index * 0.08).toFixed(2)}s">
     <img src="${esc(row.icon)}" alt="">
     <strong>${esc(row.label)}</strong>
    </article>
   `).join("")
  }

  ui.claimPopup.hidden = false
  requestAnimationFrame(() => ui.claimPopup.classList.add("show"))
  window.setTimeout(() => {
   ui.claimPopup.classList.remove("show")
   window.setTimeout(() => {
    if (!ui.claimPopup.classList.contains("show")) ui.claimPopup.hidden = true
   }, 220)
  }, 2200)
 }

 async function refreshAchievementsView(keepModalCategory = null) {
  await loadAchievementsHub()
  if (modalState.open && keepModalCategory) {
   state.modalCache = {}
   await setModalCategory(keepModalCategory)
  }
 }

 async function claimAllAchievements() {
  if (!ui.claimAllBtn) return
  ui.claimAllBtn.disabled = true
  const original = ui.claimAllBtn.textContent
  ui.claimAllBtn.textContent = "Récupération..."
  try {
   const res = await fetch("/api/achievements/claim", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify({})
   })
   if (!res.ok) throw new Error("claim")
   const data = await res.json()
   showClaimPopup(data?.totals || {})
   if (Number.isFinite(Number(data?.kamas))) {
    setTopKamas(Number(data.kamas))
   }
   await refreshAchievementsView(modalState.activeCategory || null)
  } catch (_) {
   showClaimPopup({})
  } finally {
   ui.claimAllBtn.disabled = false
   ui.claimAllBtn.textContent = original
  }
 }

 async function setModalCategory(categoryId) {
  const safeId = CATEGORY_BY_ID?.[categoryId] ? categoryId : CATEGORY_TILES[0].id
  modalState.activeCategory = safeId
  renderModalRail()

  const stat = getStat(safeId)
  ui.modalCategoryTitle.textContent = getCategoryLabel(safeId)
  ui.modalCategoryCount.textContent = `${stat.unlocked}/${stat.total || 0}`

  const cached = state.modalCache?.[safeId]
  if (Array.isArray(cached)) {
   renderModalList(cached)
   return
  }

  ui.modalList.innerHTML = `<p class="ach-modal-empty">Chargement des succès...</p>`
  const token = ++modalState.requestToken
  try {
   const res = await fetch(`/api/achievements?category=${encodeURIComponent(safeId)}`, { credentials: "same-origin" })
   if (!res.ok) throw new Error("api")
   const data = await res.json()
   if (token !== modalState.requestToken) return
   state.modalCache[safeId] = Array.isArray(data?.items) ? data.items : []
   if (data?.categories) {
    state.categories = data.categories
    renderGrid()
    renderModalRail()
    const nextStat = getStat(safeId)
    ui.modalCategoryCount.textContent = `${nextStat.unlocked}/${nextStat.total || 0}`
   }
   renderModalList(state.modalCache[safeId])
  } catch (_) {
   if (token !== modalState.requestToken) return
   ui.modalList.innerHTML = `<p class="ach-modal-empty">Impossible de charger les succès.</p>`
  }
 }

 function closeModal() {
  if (!modalState.open) return
  modalState.open = false
  ui.modal.classList.remove("show")
  document.body.classList.remove("ach-modal-open")
  window.setTimeout(() => {
   if (!modalState.open) ui.modal.hidden = true
  }, 140)
 }

 function openModal(categoryId) {
  const safeId = CATEGORY_BY_ID?.[categoryId] ? categoryId : CATEGORY_TILES[0].id
  modalState.open = true
  ui.modal.hidden = false
  requestAnimationFrame(() => ui.modal.classList.add("show"))
  document.body.classList.add("ach-modal-open")
  setModalCategory(safeId)
 }

 function bindDragScroll(scrollElement, wheelTarget, dragTarget) {
  if (!scrollElement || scrollElement.dataset.dragBound === "1") return
  scrollElement.dataset.dragBound = "1"

  const target = dragTarget || scrollElement

  const finishDrag = () => {
   if (!modalRailDragState.active) return
   modalRailDragState.active = false
   if (modalRailDragState.moved) {
    modalRailDragState.ignoreClickUntil = Date.now() + 220
   }
   modalRailDragState.moved = false
   scrollElement.classList.remove("is-dragging")
  }

  target.addEventListener("mousedown", (event) => {
   if (event.button !== 0) return
   modalRailDragState.active = true
   modalRailDragState.moved = false
   modalRailDragState.startY = event.clientY
   modalRailDragState.startScrollTop = scrollElement.scrollTop
   scrollElement.classList.add("is-dragging")
   event.preventDefault()
  })

  window.addEventListener("mousemove", (event) => {
   if (!modalRailDragState.active) return
   const deltaY = event.clientY - modalRailDragState.startY
   if (Math.abs(deltaY) > 4) modalRailDragState.moved = true
   scrollElement.scrollTop = modalRailDragState.startScrollTop + deltaY
   event.preventDefault()
  }, { passive: false })

  window.addEventListener("mouseup", finishDrag)
  window.addEventListener("mouseleave", finishDrag)
  window.addEventListener("blur", finishDrag)

  const onWheel = (event) => {
   event.preventDefault()
   scrollElement.scrollTop += event.deltaY
  }
  scrollElement.addEventListener("wheel", onWheel, { passive: false })
  if (wheelTarget && wheelTarget !== scrollElement) {
   wheelTarget.addEventListener("wheel", onWheel, { passive: false })
  }

  target.addEventListener("touchstart", (event) => {
   const touch = event.touches?.[0]
   if (!touch) return
   modalRailDragState.active = true
   modalRailDragState.moved = false
   modalRailDragState.startY = touch.clientY
   modalRailDragState.startScrollTop = scrollElement.scrollTop
   scrollElement.classList.add("is-dragging")
  }, { passive: true })

  window.addEventListener("touchmove", (event) => {
   if (!modalRailDragState.active) return
   const touch = event.touches?.[0]
   if (!touch) return
   const deltaY = touch.clientY - modalRailDragState.startY
   if (Math.abs(deltaY) > 4) modalRailDragState.moved = true
   scrollElement.scrollTop = modalRailDragState.startScrollTop + deltaY
  }, { passive: true })
  window.addEventListener("touchend", finishDrag, { passive: true })
  window.addEventListener("touchcancel", finishDrag, { passive: true })
 }

 function bindEvents() {
  ui.grid.addEventListener("click", (event) => {
   const trigger = event.target?.closest?.("[data-ach-open-category]")
   if (!trigger) return
   const categoryId = String(trigger.getAttribute("data-ach-open-category") || "")
   openModal(categoryId)
  })

  ui.grid.addEventListener("keydown", (event) => {
   if (event.key !== "Enter" && event.key !== " ") return
   const trigger = event.target?.closest?.("[data-ach-open-category]")
   if (!trigger) return
   event.preventDefault()
   const categoryId = String(trigger.getAttribute("data-ach-open-category") || "")
   openModal(categoryId)
  })

  ui.modal.addEventListener("click", (event) => {
   const closeTrigger = event.target?.closest?.("[data-ach-close-modal]")
   if (closeTrigger) {
    closeModal()
    return
   }
   const categoryTrigger = event.target?.closest?.("[data-ach-modal-category]")
   if (!categoryTrigger) return
   if (Date.now() < Number(modalRailDragState.ignoreClickUntil || 0)) return
   const categoryId = String(categoryTrigger.getAttribute("data-ach-modal-category") || "")
   setModalCategory(categoryId)
  })

  ui.modalBackBtn.addEventListener("click", closeModal)
  ui.claimAllBtn.addEventListener("click", claimAllAchievements)

  window.addEventListener("keydown", (event) => {
   if (event.key === "Escape") closeModal()
  })

  bindDragScroll(ui.modalRail, ui.modalSidebar, ui.modalSidebar)
 }

 async function loadAchievementsHub() {
  setTopKamas(null)
  try {
   const res = await fetch("/api/achievements?category=all", { credentials: "same-origin" })
   if (!res.ok) throw new Error("api")

   const data = await res.json()
   state.connected = Boolean(data?.connected)
   state.categories = data?.categories || {}

   renderGrid()
  } catch (_) {
   state.connected = false
   state.categories = {}
   renderGrid()
  }

  try {
   const meRes = await fetch("/api/me", { credentials: "same-origin" })
   if (!meRes.ok) throw new Error("me")
   const me = await meRes.json()
   setTopKamas(me?.kamas)
  } catch (_) {
   setTopKamas(null)
  }
 }

 bindEvents()
 loadAchievementsHub()
 </script>
</body>
</html>
