 </nav>

 <div class="page">
  <div class="container">
   <section style="padding-top:40px">
    <h1 class="section-title fade-in">🏆 Achievements</h1>
    <p class="section-subtitle fade-in stagger-1">Tri global ou par catégorie, avec suivi de complétion si connecté.</p>

    <div class="toolbar fade-in stagger-2">
     <select id="categorySelect" class="input input-select"></select>
     <button id="completionToggle" class="btn btn-outline" disabled>Complétion: OFF</button>
     <button id="refreshBtn" class="btn btn-outline">Actualiser</button>
    </div>

    <div id="achMeta" class="result-meta"></div>
    <div id="achGrid" class="catalog-grid achievements-grid"></div>
   </section>

   <footer class="footer">
    <p>🦅 <a href="/">Krosmoz Card</a> - krosmozcard.fr</p>
    <p style="margin-top:8px"><a href="/about">À propos · Contact · Mentions légales</a></p>
   </footer>
  </div>
 </div>

 <script src="/js/web-auth.js"></script>
 <script>
 document.getElementById("navToggle").addEventListener("click", () => {
  document.getElementById("navLinks").classList.toggle("open")
 })

 const CATEGORIES = [
  { id: "all", label: "Global (tous)" },
  { id: "pack", label: "Packs" },
  { id: "rng", label: "RNG" },
  { id: "collection", label: "Collection" },
  { id: "economy", label: "Économie" },
  { id: "fusion", label: "Fusion" },
  { id: "daily", label: "Daily" },
  { id: "social", label: "Social" },
  { id: "inventory", label: "Inventaire" },
  { id: "krosmoshop", label: "KrosmoShop" },
  { id: "event", label: "Events" },
  { id: "guild", label: "Guildes" },
  { id: "gift", label: "Dons" },
  { id: "progression", label: "Progression" },
  { id: "secret", label: "Secrets" }
 ]

 const state = {
  category: "all",
  connected: false,
  completionOnly: false,
  items: [],
  categoryStats: {}
 }

 function getLoginUrl() {
  const returnTo = `${window.location.pathname || "/"}${window.location.search || ""}`
  return `/auth/discord?returnTo=${encodeURIComponent(returnTo)}`
 }

 function esc(str) {
  const d = document.createElement("div")
  d.textContent = String(str || "")
  return d.innerHTML
 }

 function categoryLabel(category) {
  const stat = state.categoryStats?.[category.id]
  if (!stat) return category.label
  return `${category.label} (${stat.unlocked}/${stat.total})`
 }

 function renderCategorySelect() {
  const sel = document.getElementById("categorySelect")
  sel.innerHTML = CATEGORIES.map((c) => `<option value="${c.id}">${categoryLabel(c)}</option>`).join("")
  sel.value = state.category
 }

 function initCategorySelect() {
  const sel = document.getElementById("categorySelect")
  renderCategorySelect()
  sel.addEventListener("change", () => {
   state.category = sel.value
   loadAchievements()
  })
 }

 function initCompletionToggle() {
  const btn = document.getElementById("completionToggle")
  btn.textContent = "Complétion: OFF"
  btn.disabled = false
  if (!state.connected) {
   btn.textContent = "Complétion (connexion Discord requise)"
   btn.onclick = () => { window.location.href = getLoginUrl() }
   return
  }
  btn.onclick = null
  btn.onclick = () => {
   state.completionOnly = !state.completionOnly
   btn.textContent = `Complétion: ${state.completionOnly ? "ON" : "OFF"}`
   renderAchievements()
  }
 }

 function achievementCard(item) {
  return `
   <article class="catalog-card achievement-card ${item.unlocked ? "achievement-done" : "achievement-pending"} ${item.secret && !item.unlocked ? "achievement-hidden" : ""}">
    <div class="catalog-card-head">
     <span class="chip">${esc(item.trigger)}</span>
     <span class="chip chip-rarity">${item.unlocked ? "Validé" : "À faire"}</span>
    </div>
    <h3>${esc(item.badge)} ${esc(item.name)}</h3>
    <p>${esc(item.description || "")}</p>
   </article>
  `
 }

 function renderAchievements() {
  const grid = document.getElementById("achGrid")
  const meta = document.getElementById("achMeta")

  const visible = state.completionOnly
   ? state.items.filter((x) => x.unlocked)
   : state.items

  const unlocked = state.items.filter((x) => x.unlocked).length
  meta.textContent = `${unlocked}/${state.items.length} succès validés${state.completionOnly ? " (filtre complétion ON)" : ""}`

  if (!visible.length) {
   grid.innerHTML = `<div class="loading"><p>Aucun succès à afficher.</p></div>`
   return
  }

  grid.innerHTML = visible.map(achievementCard).join("")
 }

 async function loadAchievements() {
  const grid = document.getElementById("achGrid")
  grid.innerHTML = `<div class="loading"><div class="spinner"></div><p>Chargement des achievements...</p></div>`

  try {
   const statusRes = await fetch("/api/oauth/status", { credentials: "same-origin" })
   const status = await statusRes.json()
   state.connected = Boolean(status?.connected)
  } catch (_) {
   state.connected = false
  }
  initCompletionToggle()

  try {
   const res = await fetch(`/api/achievements?category=${encodeURIComponent(state.category)}`, { credentials: "same-origin" })
   const data = await res.json()
   state.items = data.items || []
   state.categoryStats = data.categories || {}
   renderCategorySelect()
   renderAchievements()
  } catch (_) {
   grid.innerHTML = `<div class="loading"><p style="color:var(--rarity-HR)">Erreur de chargement.</p></div>`
  }
 }

 document.getElementById("refreshBtn").addEventListener("click", loadAchievements)

 initCategorySelect()
 loadAchievements()
 </script>
</body>
</html>
