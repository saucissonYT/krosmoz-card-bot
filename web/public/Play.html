<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Mon Jeu - Krosmoz Card</title>
 <meta name="theme-color" content="#0b0b18">
 <link rel="stylesheet" href="/css/style.css">
 <link rel="stylesheet" href="/Play.css">
</head>
<body class="play-page">
 <nav class="navbar scrolled">
  <div class="navbar-inner">
   <a href="/" class="navbar-brand">KROSMOZ CARD</a>
   <ul class="navbar-links" id="navLinks">
    <li><a href="/">Accueil</a></li>
    <li><a href="/achievements">Achievements</a></li>
    <li><a href="/tutorial">Tutoriel</a></li>
    <li><a href="/leaderboard">Classement</a></li>
    <li><a href="/cards">Cartes</a></li>
    <li><a href="/market">Marché</a></li>
    <li><a href="/guild">Guildes</a></li>
   </ul>
   <div class="navbar-right">
    <a id="globalAuthBtn" class="btn btn-outline btn-auth-top" href="/auth/discord">Connexion</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">&#9776;</button>
   </div>
  </div>
 </nav>

 <div class="page">
  <div class="container">
   <section class="play-shell">
    <main class="play-main">
     <header class="play-head">
      <h1 id="playTitle">INVENTAIRE</h1>
     </header>

     <div class="play-controls" id="playControls">
      <input id="searchInput" class="input" placeholder="Rechercher...">
      <select id="setFilter" class="input input-select">
       <option value="">Tous les sets</option>
      </select>
      <select id="rarityFilter" class="input input-select">
       <option value="">Toutes les raretés</option>
       <option value="C">C</option>
       <option value="U">U</option>
       <option value="R">R</option>
       <option value="SR">SR</option>
       <option value="HR">HR</option>
       <option value="UR">UR</option>
       <option value="S">S</option>
       <option value="SSR">SSR</option>
      </select>
      <button id="sortBtn" class="btn btn-outline">Tri Qté v</button>
     </div>

     <div class="play-subtabs" id="inventorySubtabs">
      <button class="play-subtab active" data-view="cards">Cartes</button>
      <button class="play-subtab" data-view="fragments">Fragments</button>
     </div>

     <div class="play-content">
      <div id="playGrid" class="play-grid"></div>
      <div id="playPacks" class="play-panel-alt" style="display:none"></div>
      <div id="playFusion" class="play-panel-alt" style="display:none"></div>
      <div id="playCraft" class="play-panel-alt" style="display:none"></div>
     </div>
    </main>
   </section>
  </div>
 </div>

 <script src="/js/web-auth.js"></script>
 <script>
 const MODE_PATH = {
  inventory: "/play/inventory",
  packs: "/play/packs",
  fusion: "/play/fusion",
  craft: "/play/craft"
 }

 const RARITY_ORDER = ["C", "U", "R", "SR", "HR", "UR", "S", "SSR"]
 const state = {
  mode: "inventory",
  inventoryView: "cards",
  sortDesc: true,
  me: null,
  profile: null,
  inventory: null,
  groupedFragments: [],
  gameMeta: null,
  selected: null
 }

 function escapeHtml(value) {
  const div = document.createElement("div")
  div.textContent = String(value || "")
  return div.innerHTML
 }

 function fmt(n) { return Number(n || 0).toLocaleString("fr-FR") }
 function rarityRank(rarity) {
  const idx = RARITY_ORDER.indexOf(String(rarity || "").toUpperCase())
  return idx >= 0 ? idx : 99
 }

 function parseModeFromPath() {
  const tab = String(window.location.pathname || "").split("/")[2] || "inventory"
  return ["inventory", "packs", "fusion", "craft"].includes(tab) ? tab : "inventory"
 }

 async function fetchJson(url, options = {}) {
  const res = await fetch(url, { credentials: "same-origin", ...options })
  let data = null
  try { data = await res.json() } catch (_) {}
  return { ok: res.ok, status: res.status, data }
 }

 async function postJson(url, body) {
  return fetchJson(url, {
   method: "POST",
   headers: { "Content-Type": "application/json" },
   body: JSON.stringify(body || {})
  })
 }

 async function requireLogin() {
  const meRes = await fetchJson("/api/me")
  if (!meRes.ok || !meRes.data || !meRes.data.id) throw new Error("not_connected")
  state.me = meRes.data
 }

 function setMode(mode, updateUrl = true) {
  state.mode = mode
  state.selected = null
  document.querySelectorAll("[data-play-mode]").forEach((tab) => {
   tab.classList.toggle("active", tab.dataset.playMode === mode)
  })
  if (updateUrl && MODE_PATH[mode]) window.history.replaceState({}, "", MODE_PATH[mode])
  renderCurrentMode()
 }

 function setInventoryView(view) {
  state.inventoryView = view
  state.selected = null
  if (view === "fragments") {
   const rarityFilter = document.getElementById("rarityFilter")
   if (rarityFilter) rarityFilter.value = ""
  }
  document.querySelectorAll(".play-subtab").forEach((btn) => {
   btn.classList.toggle("active", btn.dataset.view === view)
  })
  renderCurrentMode()
 }

 function groupFragments(fragments = []) {
  const grouped = new Map()
  for (const fragment of fragments) {
   const key = `${fragment.cardId}:${fragment.fragmentNumber}`
   if (!grouped.has(key)) {
    grouped.set(key, {
     key,
     itemType: "fragment",
     cardId: String(fragment.cardId),
     fragmentNumber: Number(fragment.fragmentNumber || 0),
     cardName: fragment.cardName || `Carte ${fragment.cardId}`,
     rarity: fragment.rarity || "SSR",
     set: fragment.set || "unknown",
     setName: fragment.setName || fragment.set || "unknown",
     imageUrl: fragment.imageUrl || null,
     qty: 0
    })
   }
   grouped.get(key).qty += 1
  }
  return [...grouped.values()].sort((a, b) =>
   String(a.cardName).localeCompare(String(b.cardName), "fr") || a.fragmentNumber - b.fragmentNumber
  )
 }

 async function loadData() {
  await requireLogin()

  const [profileRes, inventoryRes, gameMetaRes] = await Promise.all([
   fetchJson(`/api/profile/${encodeURIComponent(state.me.id)}`),
   fetchJson("/api/me/inventory"),
   fetchJson("/api/game/meta")
  ])
  if (profileRes.ok) state.profile = profileRes.data
  if (inventoryRes.ok) state.inventory = inventoryRes.data
  if (gameMetaRes.ok) state.gameMeta = gameMetaRes.data
  state.groupedFragments = groupFragments((state.inventory && state.inventory.fragments) || [])

  const setSelect = document.getElementById("setFilter")
  setSelect.innerHTML = '<option value="">Tous les sets</option>'
  const sets = new Map()
  for (const item of ((state.inventory && state.inventory.cards) || [])) sets.set(item.set, item.setName || item.set)
  for (const item of state.groupedFragments) sets.set(item.set, item.setName || item.set)
  const options = [...sets.entries()].sort((a, b) => String(a[1]).localeCompare(String(b[1]), "fr"))
  for (const [id, name] of options) {
   const opt = document.createElement("option")
   opt.value = id
   opt.textContent = name
   setSelect.appendChild(opt)
  }

 }

 function getActiveSource() {
  if (state.mode === "inventory" && state.inventoryView === "fragments") return state.groupedFragments
  return (state.inventory && state.inventory.cards) || []
 }

 function getFilteredItems() {
  const query = String(document.getElementById("searchInput").value || "").trim().toLowerCase()
  const set = document.getElementById("setFilter").value
  const rarity = document.getElementById("rarityFilter").value

  const items = getActiveSource().filter((item) => {
   if (query && !String(item.cardName || "").toLowerCase().includes(query)) return false
   if (set && String(item.set) !== String(set)) return false
   if (rarity && String(item.rarity) !== String(rarity)) return false
   if (state.mode === "inventory" && state.inventoryView === "cards" && Number(item.qty || 0) <= 0) return false
   return true
  })

  items.sort((a, b) => {
   const qtyCmp = state.sortDesc ? Number(b.qty || 0) - Number(a.qty || 0) : Number(a.qty || 0) - Number(b.qty || 0)
   if (qtyCmp !== 0) return qtyCmp
   const rarityCmp = rarityRank(a.rarity) - rarityRank(b.rarity)
   if (rarityCmp !== 0) return rarityCmp
   return String(a.cardName || "").localeCompare(String(b.cardName || ""), "fr")
  })
  return items
 }

 function renderInventoryGrid() {
  const grid = document.getElementById("playGrid")
  const items = getFilteredItems()
  if (!items.length) {
   grid.innerHTML = '<div class="play-empty"><h3>Vide</h3><p>Aucun résultat avec ces filtres.</p></div>'
   return
  }
  grid.innerHTML = items.map((item) => {
   let label = `x${fmt(item.qty)}`
   if (item.itemType === "fragment") label = `Fragment ${item.fragmentNumber}/5 - x${fmt(item.qty)}`
   return `
    <article class="play-card">
     <div class="play-card-img-wrap">
      ${item.imageUrl ? `<img src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.cardName)}">` : "<span>?</span>"}
     </div>
     <div class="play-card-meta">
      <strong>${escapeHtml(item.rarity || "C")} ${escapeHtml(item.cardName)}</strong>
      <small>${escapeHtml(item.setName || item.set)} - ${escapeHtml(label)}</small>
     </div>
    </article>
   `
  }).join("")
 }

 function getCraftCandidates() {
  const grouped = new Map()
  for (const frag of state.groupedFragments || []) {
   const id = String(frag.cardId)
   if (!grouped.has(id)) {
    grouped.set(id, {
     cardId: id,
     cardName: frag.cardName,
     numbers: new Set()
    })
   }
   grouped.get(id).numbers.add(Number(frag.fragmentNumber || 0))
  }
  return [...grouped.values()].map((x) => ({
   ...x,
   uniqueCount: x.numbers.size
  })).sort((a, b) => b.uniqueCount - a.uniqueCount || String(a.cardName).localeCompare(String(b.cardName), "fr"))
 }

 function parseSafeQty(value, min, max, fallback = 1) {
  const n = Number(value)
  if (!Number.isFinite(n)) return fallback
  return Math.max(min, Math.min(max, Math.floor(n)))
 }

 function getFusionRowByRarity(rarity) {
  const rows = (state.gameMeta && state.gameMeta.fusion) || []
  return rows.find((row) => String(row.rarity || "").toUpperCase() === String(rarity || "").toUpperCase()) || null
 }

 function getNextRarityFromMeta(rarity) {
  const order = ["C", "U", "R", "SR", "HR", "UR", "S", "SSR"]
  const idx = order.indexOf(String(rarity || "").toUpperCase())
  if (idx < 0 || idx >= order.length - 1) return null
  return order[idx + 1]
 }

 function getFragmentProgressForCard(cardId) {
  const numbers = new Set()
  let total = 0
  for (const frag of state.groupedFragments || []) {
   if (String(frag.cardId) !== String(cardId)) continue
   numbers.add(Number(frag.fragmentNumber || 0))
   total += Number(frag.qty || 0)
  }
  const found = [...numbers].sort((a, b) => a - b).filter((x) => x >= 1 && x <= 5)
  const missing = [1, 2, 3, 4, 5].filter((x) => !numbers.has(x))
  return { found, missing, unique: found.length, total }
 }

 function setupPacksPanel(meta) {
  const qtyInput = document.getElementById("actionPackQty")
  const totalBox = document.getElementById("packTotalCost")
  const stockBox = document.getElementById("packStockNow")
  const setInput = document.getElementById("actionSetInput")
  const openHint = document.getElementById("openHint")
  const price = Number(meta.packPrice || 0)
  const stock = Number(meta.packStock || 0)

  function refresh() {
   const qty = parseSafeQty(qtyInput?.value, 1, 25, 1)
   if (qtyInput) qtyInput.value = String(qty)
   if (totalBox) totalBox.textContent = `${fmt(price * qty)} kamas`
   if (stockBox) {
    const left = Math.max(0, stock - qty)
    stockBox.textContent = `${fmt(left)} packs après ouverture`
   }
   if (openHint) {
    const selected = String(setInput?.selectedOptions?.[0]?.textContent || "Set")
    openHint.textContent = `Ouverture ciblée sur ${selected}`
   }
  }

  if (qtyInput) qtyInput.addEventListener("input", refresh)
  if (setInput) setInput.addEventListener("change", refresh)
  refresh()
 }

 function setupFusionPanel() {
  const rarityInput = document.getElementById("fusionRarityInput")
  const fromBox = document.getElementById("fusionFromRarity")
  const toBox = document.getElementById("fusionToRarity")
  const costBox = document.getElementById("fusionCostLabel")

  function refresh() {
   const rarity = String(rarityInput?.value || "")
   const row = getFusionRowByRarity(rarity)
   const toRarity = getNextRarityFromMeta(rarity)
   if (fromBox) fromBox.textContent = rarity || "-"
   if (toBox) toBox.textContent = toRarity || "-"
   if (costBox) costBox.textContent = `${fmt(Number(row?.cost || 0))} doublons`
  }

  if (rarityInput) rarityInput.addEventListener("change", refresh)
  refresh()
 }

 function setupCraftPanel(crafts) {
  const select = document.getElementById("craftCardInput")
  const preview = document.getElementById("craftPreview")
  const readyTag = document.getElementById("craftReadyTag")

  function refresh() {
   const id = String(select?.value || "")
   const selected = crafts.find((item) => String(item.cardId) === id) || null
   if (!selected || !preview) {
    if (preview) preview.innerHTML = '<p class="mode-muted">Aucune carte craftable pour l’instant.</p>'
    if (readyTag) readyTag.textContent = "0/5"
    return
   }
   const progress = getFragmentProgressForCard(selected.cardId)
   const foundBadges = progress.found.map((n) => `<span class="mode-chip mode-chip-ok">Fragment ${n}</span>`).join("")
   const missingBadges = progress.missing.map((n) => `<span class="mode-chip">Manque ${n}</span>`).join("")
   preview.innerHTML = `
    <p><strong>${escapeHtml(selected.cardName)}</strong> - ${progress.unique}/5 fragments uniques</p>
    <div class="mode-chip-row">
     ${foundBadges || ""}
     ${missingBadges || ""}
    </div>
    <p class="mode-muted">Fragments totaux en stock: ${fmt(progress.total)}</p>
   `
   if (readyTag) readyTag.textContent = `${progress.unique}/5`
  }

  if (select) select.addEventListener("change", refresh)
  refresh()
 }

 function renderPacks() {
  const panel = document.getElementById("playPacks")
  const meta = state.gameMeta || {}
  const unlockedSets = meta.unlockedSets || []
  const hasSets = unlockedSets.length > 0
  const stock = Number(meta.packStock || 0)
  const packPrice = Number(meta.packPrice || 0)
  panel.innerHTML = `
   <section class="mode-shell mode-packs">
    <header class="mode-hero">
     <div>
      <h2>Gestion des Packs</h2>
      <p>Achète puis ouvre tes packs sur le set de ton choix.</p>
     </div>
     <div class="mode-kpi-grid">
      <div class="mode-kpi"><span>Prix unité</span><strong>${fmt(packPrice)} k</strong></div>
      <div class="mode-kpi"><span>Stock actuel</span><strong>${fmt(stock)}</strong></div>
      <div class="mode-kpi"><span>Sets débloqués</span><strong>${fmt(unlockedSets.length)}</strong></div>
     </div>
    </header>
    <div class="mode-layout">
     <article class="mode-card">
      <h3>Achat & Ouverture</h3>
      <p class="mode-muted">Une quantité unique est utilisée pour acheter ou ouvrir.</p>
      <label class="mode-label" for="actionPackQty">Quantité</label>
      <input id="actionPackQty" class="input" type="number" min="1" max="25" step="1" value="1">
      <label class="mode-label" for="actionSetInput">Set ciblé</label>
      <select id="actionSetInput" class="input input-select" ${hasSets ? "" : "disabled"}>
       ${unlockedSets.map((set) => `<option value="${escapeHtml(set.id)}">${escapeHtml(set.name)}</option>`).join("")}
      </select>
      <div class="mode-inline-stats">
       <div><span>Coût total</span><strong id="packTotalCost">${fmt(packPrice)} kamas</strong></div>
       <div><span>Projection stock</span><strong id="packStockNow">${fmt(Math.max(0, stock - 1))} packs après ouverture</strong></div>
      </div>
      <div class="action-row">
       <button id="buyPacksBtn" class="btn btn-outline">Acheter</button>
       <button id="openPacksBtn" class="btn btn-gold" ${hasSets ? "" : "disabled"}>Ouvrir</button>
      </div>
      <p id="openHint" class="mode-muted"></p>
      <div id="packResultBox" class="action-result mode-result"></div>
     </article>

     <article class="mode-card">
      <h3>Sets disponibles</h3>
      <p class="mode-muted">Seuls les sets débloqués peuvent être ouverts.</p>
      <div class="mode-chip-row">
       ${hasSets
        ? unlockedSets.map((set) => `<span class="mode-chip mode-chip-ok">${escapeHtml(set.name)}</span>`).join("")
        : '<span class="mode-chip">Aucun set débloqué</span>'}
      </div>
      <div class="mode-info-box">
       <p>Astuce: ouvre en petite quantité pour mieux piloter ton stock et tes kamas.</p>
      </div>
     </article>
    </div>
   </section>
  `
  setupPacksPanel(meta)
 }

 function renderFusion() {
  const panel = document.getElementById("playFusion")
  const meta = state.gameMeta || {}
  const unlockedSets = meta.unlockedSets || []
  const fusionRows = meta.fusion || []
  const hasSets = unlockedSets.length > 0
  const hasRows = fusionRows.length > 0
  panel.innerHTML = `
   <section class="mode-shell mode-fusion">
    <header class="mode-hero">
     <div>
      <h2>Atelier de Fusion</h2>
      <p>Convertis des doublons en cartes de rareté supérieure.</p>
     </div>
     <div class="mode-kpi-grid">
      <div class="mode-kpi"><span>Sets actifs</span><strong>${fmt(unlockedSets.length)}</strong></div>
      <div class="mode-kpi"><span>Raretés fusionnables</span><strong>${fmt(fusionRows.length)}</strong></div>
      <div class="mode-kpi"><span>Règle</span><strong>1 fusion = 1 carte</strong></div>
     </div>
    </header>
    <div class="mode-layout">
     <article class="mode-card">
      <h3>Paramètres de fusion</h3>
      <label class="mode-label" for="fusionSetInput">Set</label>
      <select id="fusionSetInput" class="input input-select" ${hasSets ? "" : "disabled"}>
       ${unlockedSets.map((set) => `<option value="${escapeHtml(set.id)}">${escapeHtml(set.name)}</option>`).join("")}
      </select>
      <label class="mode-label" for="fusionRarityInput">Rareté source</label>
      <select id="fusionRarityInput" class="input input-select" ${hasRows ? "" : "disabled"}>
       ${fusionRows.map((row) => `<option value="${escapeHtml(row.rarity)}">${escapeHtml(row.rarity)}</option>`).join("")}
      </select>
      <div class="mode-inline-stats mode-inline-stats-3">
       <div><span>De</span><strong id="fusionFromRarity">-</strong></div>
       <div><span>Vers</span><strong id="fusionToRarity">-</strong></div>
       <div><span>Coût</span><strong id="fusionCostLabel">0 doublons</strong></div>
      </div>
      <div class="action-row">
       <button id="fusionBtn" class="btn btn-gold" ${hasSets && hasRows ? "" : "disabled"}>Lancer la fusion</button>
      </div>
      <div id="fusionResultBox" class="action-result mode-result"></div>
     </article>

     <article class="mode-card">
      <h3>Table des coûts</h3>
      <div class="mode-rows">
       ${hasRows
        ? fusionRows.map((row) => {
         const next = getNextRarityFromMeta(row.rarity)
         return `<div class="mode-row"><span>${escapeHtml(row.rarity)} → ${escapeHtml(next || "-")}</span><strong>${fmt(row.cost)} doublons</strong></div>`
        }).join("")
        : '<p class="mode-muted">Aucune rareté fusionnable disponible.</p>'}
      </div>
      <div class="mode-info-box">
       <p>La fusion consomme des doublons d’un set et donne une carte aléatoire de la rareté cible.</p>
      </div>
     </article>
    </div>
   </section>
  `
  setupFusionPanel()
 }

 function renderCraft() {
  const panel = document.getElementById("playCraft")
  const crafts = getCraftCandidates()
  const hasCraft = crafts.length > 0
  panel.innerHTML = `
   <section class="mode-shell mode-craft">
    <header class="mode-hero">
     <div>
      <h2>Forge de Craft</h2>
      <p>Assemble 5 fragments uniques (1 a 5) pour créer une SSR.</p>
     </div>
     <div class="mode-kpi-grid">
      <div class="mode-kpi"><span>Cartes prêtes</span><strong>${fmt(crafts.filter((x) => x.uniqueCount >= 5).length)}</strong></div>
      <div class="mode-kpi"><span>Candidates</span><strong>${fmt(crafts.length)}</strong></div>
      <div class="mode-kpi"><span>Seuil craft</span><strong id="craftReadyTag">${hasCraft ? `${crafts[0].uniqueCount}/5` : "0/5"}</strong></div>
     </div>
    </header>
    <div class="mode-layout">
     <article class="mode-card">
      <h3>Carte a crafter</h3>
      <label class="mode-label" for="craftCardInput">Sélection</label>
      <select id="craftCardInput" class="input input-select" ${hasCraft ? "" : "disabled"}>
       ${crafts.map((item) => `<option value="${escapeHtml(item.cardId)}">${escapeHtml(item.cardName)} (${item.uniqueCount}/5)</option>`).join("")}
      </select>
      <div id="craftPreview" class="mode-preview"></div>
      <div class="action-row">
       <button id="craftBtn" class="btn btn-gold" ${hasCraft ? "" : "disabled"}>Crafter SSR</button>
      </div>
      <div id="craftResultBox" class="action-result mode-result"></div>
     </article>

     <article class="mode-card">
      <h3>Conditions</h3>
      <ul class="mode-list">
       <li>Fragments requis: 1, 2, 3, 4 et 5.</li>
       <li>Chaque numéro doit être unique pour la carte ciblée.</li>
       <li>Le craft consomme les fragments et crée une SSR.</li>
      </ul>
      <div class="mode-info-box">
       <p>Si une carte est à 4/5, va chercher le fragment manquant au marché pour finir plus vite.</p>
      </div>
     </article>
    </div>
   </section>
  `
  setupCraftPanel(crafts)
 }

 function showActionResult(boxId, html, error = false) {
  const box = document.getElementById(boxId)
  if (!box) return
  box.classList.toggle("error", Boolean(error))
  box.innerHTML = html || ""
 }

 async function reloadGameplayDataAndRender() {
  await loadData()
  renderCurrentMode()
 }

 async function handleBuyPacksAction() {
  const qty = Number(document.getElementById("actionPackQty")?.value || 1)
  const res = await postJson("/api/game/buy-packs", { quantity: qty })
  if (!res.ok) {
   showActionResult("packResultBox", `<p>${escapeHtml(res.data?.error || "Achat impossible.")}</p>`, true)
   return
  }
  showActionResult("packResultBox", `<p><strong>Achat validé:</strong> x${fmt(res.data?.quantity || qty)} packs</p><p>Stock: ${fmt(res.data?.packStock || 0)} - Solde: ${fmt(res.data?.kamas || 0)} kamas</p>`)
  await reloadGameplayDataAndRender()
 }

 async function handleOpenPacksAction() {
  const qty = Number(document.getElementById("actionPackQty")?.value || 1)
  const setId = String(document.getElementById("actionSetInput")?.value || "").trim()
  const res = await postJson("/api/game/open-packs", { quantity: qty, setId })
  if (!res.ok) {
   showActionResult("packResultBox", `<p>${escapeHtml(res.data?.error || "Ouverture impossible.")}</p>`, true)
   return
  }
  showActionResult("packResultBox", `<p><strong>Ouverture terminée:</strong> x${fmt(res.data?.quantity || qty)} pack(s)</p><p>Gain: ${fmt(res.data?.totals?.kamasGain || 0)} kamas - Fragments: ${fmt(res.data?.totals?.fragments || 0)}</p>`)
  await reloadGameplayDataAndRender()
 }

 async function handleFusionAction() {
  const setId = String(document.getElementById("fusionSetInput")?.value || "").trim()
  const rarity = String(document.getElementById("fusionRarityInput")?.value || "").trim()
  const res = await postJson("/api/game/fuse", { setId, rarity })
  if (!res.ok) {
   showActionResult("fusionResultBox", `<p>${escapeHtml(res.data?.error || "Fusion impossible.")}</p>`, true)
   return
  }
  showActionResult("fusionResultBox", `<p><strong>Fusion validée:</strong> ${escapeHtml(res.data?.fromRarity || rarity)} -> ${escapeHtml(res.data?.toRarity || "")}</p><p>Récompense: ${escapeHtml(res.data?.reward?.cardName || "Carte")}</p>`)
  await reloadGameplayDataAndRender()
 }

 async function handleCraftAction() {
  const cardId = String(document.getElementById("craftCardInput")?.value || "").trim()
  const res = await postJson("/api/game/craft", { cardId })
  if (!res.ok) {
   showActionResult("craftResultBox", `<p>${escapeHtml(res.data?.error || "Craft impossible.")}</p>`, true)
   return
  }
  showActionResult("craftResultBox", `<p><strong>Craft SSR validé:</strong> ${escapeHtml(res.data?.card?.cardName || "Carte")}</p>`)
  await reloadGameplayDataAndRender()
 }

 function syncPanelVisibility() {
  const controls = document.getElementById("playControls")
  const subtabs = document.getElementById("inventorySubtabs")
  const rarityFilter = document.getElementById("rarityFilter")
  const grid = document.getElementById("playGrid")
  const packsPanel = document.getElementById("playPacks")
  const fusionPanel = document.getElementById("playFusion")
  const craftPanel = document.getElementById("playCraft")
  const title = document.getElementById("playTitle")

  controls.style.display = "grid"
  subtabs.style.display = state.mode === "inventory" ? "flex" : "none"
  rarityFilter.style.display = (state.mode === "inventory" && state.inventoryView === "fragments") ? "none" : ""
  grid.style.display = "grid"
  packsPanel.style.display = "none"
  fusionPanel.style.display = "none"
  craftPanel.style.display = "none"

  if (state.mode === "packs") {
   title.textContent = "PACKS"
   controls.style.display = "none"
   grid.style.display = "none"
   packsPanel.style.display = "block"
  } else if (state.mode === "fusion") {
   title.textContent = "FUSION"
   controls.style.display = "none"
   grid.style.display = "none"
   fusionPanel.style.display = "block"
  } else if (state.mode === "craft") {
   title.textContent = "CRAFT"
   controls.style.display = "none"
   grid.style.display = "none"
   craftPanel.style.display = "block"
  } else {
   title.textContent = state.inventoryView === "fragments" ? "FRAGMENTS" : "INVENTAIRE"
  }
 }

 function renderCurrentMode() {
  syncPanelVisibility()
  if (state.mode === "packs") return renderPacks()
  if (state.mode === "fusion") return renderFusion()
  if (state.mode === "craft") return renderCraft()
  renderInventoryGrid()
 }

 function bindEvents() {
  document.getElementById("navToggle").addEventListener("click", () => {
   document.getElementById("navLinks").classList.toggle("open")
  })

  document.addEventListener("click", (event) => {
   const link = event.target.closest("[data-play-mode]")
   if (!link) return
   event.preventDefault()
   setMode(link.dataset.playMode)
  })

  document.querySelectorAll(".play-subtab").forEach((btn) => {
   btn.addEventListener("click", () => setInventoryView(btn.dataset.view))
  })

  document.getElementById("searchInput").addEventListener("input", renderCurrentMode)
  document.getElementById("setFilter").addEventListener("change", renderCurrentMode)
  document.getElementById("rarityFilter").addEventListener("change", renderCurrentMode)

  document.getElementById("sortBtn").addEventListener("click", () => {
   state.sortDesc = !state.sortDesc
   document.getElementById("sortBtn").textContent = state.sortDesc ? "Tri Qté v" : "Tri Qté ^"
   renderCurrentMode()
  })

  document.getElementById("playPacks").addEventListener("click", (event) => {
   if (event.target && event.target.id === "buyPacksBtn") return handleBuyPacksAction().catch(() => {})
   if (event.target && event.target.id === "openPacksBtn") return handleOpenPacksAction().catch(() => {})
  })

  document.getElementById("playFusion").addEventListener("click", (event) => {
   if (event.target && event.target.id === "fusionBtn") return handleFusionAction().catch(() => {})
  })

  document.getElementById("playCraft").addEventListener("click", (event) => {
   if (event.target && event.target.id === "craftBtn") return handleCraftAction().catch(() => {})
  })
 }

 async function bootstrap() {
  bindEvents()
  setMode(parseModeFromPath(), false)
  try {
   await loadData()
   renderCurrentMode()
  } catch (_) {
   window.location.href = "/"
  }
 }

 bootstrap()
 </script>
</body>
</html>
