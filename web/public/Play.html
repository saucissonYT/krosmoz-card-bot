<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Mon Jeu - Krosmoz Card</title>
 <meta name="theme-color" content="#0b0b18">
 <link rel="stylesheet" href="/css/style.css">
 <link rel="stylesheet" href="/Play.css">
</head>
<body class="play-page">
 <nav class="navbar scrolled">
  <div class="navbar-inner">
   <a href="/" class="navbar-brand">KROSMOZ CARD</a>
   <ul class="navbar-links" id="navLinks">
    <li><a href="/">Accueil</a></li>
    <li><a href="/tutorial">Tutoriel</a></li>
    <li><a href="/leaderboard">Classement</a></li>
    <li><a href="/cards">Cartes</a></li>
    <li><a href="/guild">Guildes</a></li>
   </ul>
   <div class="navbar-right">
    <a id="globalAuthBtn" class="btn btn-outline btn-auth-top" href="/auth/discord">Connexion</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">&#9776;</button>
   </div>
  </div>
 </nav>

 <div class="page">
  <div class="container">
   <section class="play-shell">
    <main class="play-main">
     <header class="play-head">
      <h1 id="playTitle">INVENTAIRE</h1>
     </header>

     <div class="play-controls" id="playControls">
      <input id="searchInput" class="input" placeholder="Rechercher...">
      <select id="setFilter" class="input input-select">
       <option value="">Tous les sets</option>
      </select>
      <select id="rarityFilter" class="input input-select">
       <option value="">Toutes les raretés</option>
       <option value="C">C</option>
       <option value="U">U</option>
       <option value="R">R</option>
       <option value="SR">SR</option>
       <option value="HR">HR</option>
       <option value="UR">UR</option>
       <option value="S">S</option>
       <option value="SSR">SSR</option>
      </select>
      <button id="sortBtn" class="btn btn-outline">Tri Qté v</button>
     </div>

     <div class="play-subtabs" id="inventorySubtabs">
      <button class="play-subtab active" data-view="cards">Cartes</button>
      <button class="play-subtab" data-view="fragments">Fragments</button>
     </div>

     <div class="play-content">
      <div id="playGrid" class="play-grid"></div>
      <div id="playPacks" class="play-panel-alt" style="display:none"></div>
      <div id="playFusion" class="play-panel-alt" style="display:none"></div>
      <div id="playCraft" class="play-panel-alt" style="display:none"></div>
     </div>
    </main>
   </section>
  </div>
 </div>

 <script src="/js/web-auth.js"></script>
 <script>
 const MODE_PATH = {
  inventory: "/play/inventory",
  packs: "/play/packs",
  fusion: "/play/fusion",
  craft: "/play/craft"
 }

 const RARITY_ORDER = ["C", "U", "R", "SR", "HR", "UR", "S", "SSR"]
const state = {
 mode: "inventory",
 inventoryView: "cards",
 sortDesc: true,
  me: null,
  profile: null,
  inventory: null,
 groupedFragments: [],
 gameMeta: null,
 selected: null,
 fusionUi: {
  setId: "",
  fromRarity: "C",
  quantity: 1
 },
 fusionHistory: []
}
 const PACK_BACK_IMAGE_DEFAULT = "/assets/ui/pack-back-normal.png"
 const PACK_BACK_IMAGE_BY_RARITY = {
  S: "/assets/ui/pack-back-s.png",
  SSR: "/assets/ui/pack-back-ssr.png"
 }
 const SET_UNLOCK_THRESHOLD_PCT = 70
const SET_UNLOCK_RULES = [
  { id: "incarnam", name: "Incarnam", levelRequired: 1, prevSet: null },
  { id: "astrub", name: "Astrub", levelRequired: 11, prevSet: "incarnam" },
  { id: "amakna", name: "Amakna", levelRequired: 36, prevSet: "astrub" },
  { id: "sufokia", name: "Sufokia", levelRequired: 51, prevSet: "amakna" },
  { id: "kelba", name: "Kelba", levelRequired: 66, prevSet: "sufokia" },
  { id: "katrepat", name: "Katrepat", levelRequired: 81, prevSet: "kelba" },
  { id: "sberg", name: "Sberg", levelRequired: 96, prevSet: "katrepat" }
]
let packRevealResolve = null
let packRevealEscHandlerBound = false
let packRevealTimers = []
const FUSION_MAX_CYCLES = 25

 function escapeHtml(value) {
  const div = document.createElement("div")
  div.textContent = String(value || "")
  return div.innerHTML
 }

 function fmt(n) { return Number(n || 0).toLocaleString("fr-FR") }
 function rarityRank(rarity) {
  const idx = RARITY_ORDER.indexOf(String(rarity || "").toUpperCase())
  return idx >= 0 ? idx : 99
 }

 function parseModeFromPath() {
  const tab = String(window.location.pathname || "").split("/")[2] || "inventory"
  return ["inventory", "packs", "fusion", "craft"].includes(tab) ? tab : "inventory"
 }

 async function fetchJson(url, options = {}) {
  const res = await fetch(url, { credentials: "same-origin", ...options })
  let data = null
  try { data = await res.json() } catch (_) {}
  return { ok: res.ok, status: res.status, data }
 }

 async function postJson(url, body) {
  return fetchJson(url, {
   method: "POST",
   headers: { "Content-Type": "application/json" },
   body: JSON.stringify(body || {})
  })
 }

 async function requireLogin() {
  const meRes = await fetchJson("/api/me")
  if (!meRes.ok || !meRes.data || !meRes.data.id) throw new Error("not_connected")
  state.me = meRes.data
 }

 function setMode(mode, updateUrl = true) {
  state.mode = mode
  state.selected = null
  document.querySelectorAll("[data-play-mode]").forEach((tab) => {
   tab.classList.toggle("active", tab.dataset.playMode === mode)
  })
  if (updateUrl && MODE_PATH[mode]) window.history.replaceState({}, "", MODE_PATH[mode])
  renderCurrentMode()
 }

 function setInventoryView(view) {
  state.inventoryView = view
  state.selected = null
  if (view === "fragments") {
   const rarityFilter = document.getElementById("rarityFilter")
   if (rarityFilter) rarityFilter.value = ""
  }
  document.querySelectorAll(".play-subtab").forEach((btn) => {
   btn.classList.toggle("active", btn.dataset.view === view)
  })
  renderCurrentMode()
 }

 function groupFragments(fragments = []) {
  const grouped = new Map()
  for (const fragment of fragments) {
   const key = `${fragment.cardId}:${fragment.fragmentNumber}`
   if (!grouped.has(key)) {
    grouped.set(key, {
     key,
     itemType: "fragment",
     cardId: String(fragment.cardId),
     fragmentNumber: Number(fragment.fragmentNumber || 0),
     cardName: fragment.cardName || `Carte ${fragment.cardId}`,
     rarity: fragment.rarity || "SSR",
     set: fragment.set || "unknown",
     setName: fragment.setName || fragment.set || "unknown",
     imageUrl: fragment.imageUrl || null,
     qty: 0
    })
   }
   grouped.get(key).qty += 1
  }
  return [...grouped.values()].sort((a, b) =>
   String(a.cardName).localeCompare(String(b.cardName), "fr") || a.fragmentNumber - b.fragmentNumber
  )
 }

 async function loadData() {
  await requireLogin()

  const [profileRes, inventoryRes, gameMetaRes] = await Promise.all([
   fetchJson(`/api/profile/${encodeURIComponent(state.me.id)}`),
   fetchJson("/api/me/inventory"),
   fetchJson("/api/game/meta")
  ])
  if (profileRes.ok) state.profile = profileRes.data
  if (inventoryRes.ok) state.inventory = inventoryRes.data
  if (gameMetaRes.ok) state.gameMeta = gameMetaRes.data
  state.groupedFragments = groupFragments((state.inventory && state.inventory.fragments) || [])

  const setSelect = document.getElementById("setFilter")
  setSelect.innerHTML = '<option value="">Tous les sets</option>'
  const sets = new Map()
  for (const item of ((state.inventory && state.inventory.cards) || [])) sets.set(item.set, item.setName || item.set)
  for (const item of state.groupedFragments) sets.set(item.set, item.setName || item.set)
  const options = [...sets.entries()].sort((a, b) => String(a[1]).localeCompare(String(b[1]), "fr"))
  for (const [id, name] of options) {
   const opt = document.createElement("option")
   opt.value = id
   opt.textContent = name
   setSelect.appendChild(opt)
  }

 }

 function getActiveSource() {
  if (state.mode === "inventory" && state.inventoryView === "fragments") return state.groupedFragments
  return (state.inventory && state.inventory.cards) || []
 }

 function getFilteredItems() {
  const query = String(document.getElementById("searchInput").value || "").trim().toLowerCase()
  const set = document.getElementById("setFilter").value
  const rarity = document.getElementById("rarityFilter").value

  const items = getActiveSource().filter((item) => {
   if (query && !String(item.cardName || "").toLowerCase().includes(query)) return false
   if (set && String(item.set) !== String(set)) return false
   if (rarity && String(item.rarity) !== String(rarity)) return false
   if (state.mode === "inventory" && state.inventoryView === "cards" && Number(item.qty || 0) <= 0) return false
   return true
  })

  items.sort((a, b) => {
   const qtyCmp = state.sortDesc ? Number(b.qty || 0) - Number(a.qty || 0) : Number(a.qty || 0) - Number(b.qty || 0)
   if (qtyCmp !== 0) return qtyCmp
   const rarityCmp = rarityRank(a.rarity) - rarityRank(b.rarity)
   if (rarityCmp !== 0) return rarityCmp
   return String(a.cardName || "").localeCompare(String(b.cardName || ""), "fr")
  })
  return items
 }

 function renderInventoryGrid() {
  const grid = document.getElementById("playGrid")
  const items = getFilteredItems()
  if (!items.length) {
   grid.innerHTML = '<div class="play-empty"><h3>Vide</h3><p>Aucun résultat avec ces filtres.</p></div>'
   return
  }
  grid.innerHTML = items.map((item) => {
   let label = `x${fmt(item.qty)}`
   if (item.itemType === "fragment") label = `Fragment ${item.fragmentNumber}/5 - x${fmt(item.qty)}`
   return `
    <article class="play-card">
     <div class="play-card-img-wrap">
      ${item.imageUrl ? `<img src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.cardName)}">` : "<span>?</span>"}
     </div>
     <div class="play-card-meta">
      <strong>${escapeHtml(item.rarity || "C")} ${escapeHtml(item.cardName)}</strong>
      <small>${escapeHtml(item.setName || item.set)} - ${escapeHtml(label)}</small>
     </div>
    </article>
   `
  }).join("")
 }

 function getCraftCandidates() {
  const grouped = new Map()
  for (const frag of state.groupedFragments || []) {
   const id = String(frag.cardId)
   if (!grouped.has(id)) {
    grouped.set(id, {
     cardId: id,
     cardName: frag.cardName,
     numbers: new Set()
    })
   }
   grouped.get(id).numbers.add(Number(frag.fragmentNumber || 0))
  }
  return [...grouped.values()].map((x) => ({
   ...x,
   uniqueCount: x.numbers.size
  })).sort((a, b) => b.uniqueCount - a.uniqueCount || String(a.cardName).localeCompare(String(b.cardName), "fr"))
 }

 function parseSafeQty(value, min, max, fallback = 1) {
  const n = Number(value)
  if (!Number.isFinite(n)) return fallback
  return Math.max(min, Math.min(max, Math.floor(n)))
 }

function getFusionRowByRarity(rarity) {
 const rows = (state.gameMeta && state.gameMeta.fusion) || []
 return rows.find((row) => String(row.rarity || "").toUpperCase() === String(rarity || "").toUpperCase()) || null
}

function getFusionRows() {
 const rows = (state.gameMeta && state.gameMeta.fusion) || []
 return rows.slice().sort((a, b) => rarityRank(a.rarity) - rarityRank(b.rarity))
}

function getCardsForSetAndRarity(setId, rarity) {
 const cards = (state.inventory && state.inventory.cards) || []
 return cards.filter((item) =>
  String(item.set) === String(setId) && String(item.rarity).toUpperCase() === String(rarity).toUpperCase()
 )
}

function getDuplicateInfoForFusion(setId, rarity) {
 const matches = getCardsForSetAndRarity(setId, rarity)
 let owned = 0
 let duplicates = 0
 for (const card of matches) {
  const qty = Number(card.qty || 0)
  owned += qty
  if (qty > 1) duplicates += (qty - 1)
 }
 return { owned, duplicates, cardKinds: matches.length }
}

function getNextRarityFromMeta(rarity) {
 const order = ["C", "U", "R", "SR", "HR", "UR", "S", "SSR"]
 const idx = order.indexOf(String(rarity || "").toUpperCase())
 if (idx < 0 || idx >= order.length - 1) return null
 return order[idx + 1]
 }

function getRarityEmoji(rarity) {
 const token = String(rarity || "").toUpperCase()
 const map = {
  C: "⚪",
  U: "🟢",
  R: "🔵",
  SR: "🟣",
  HR: "🔴",
  UR: "🟠",
  S: "✨",
  SSR: "🌟"
 }
 return map[token] || "🔹"
}

 function getFragmentProgressForCard(cardId) {
  const numbers = new Set()
  let total = 0
  for (const frag of state.groupedFragments || []) {
   if (String(frag.cardId) !== String(cardId)) continue
   numbers.add(Number(frag.fragmentNumber || 0))
   total += Number(frag.qty || 0)
  }
  const found = [...numbers].sort((a, b) => a - b).filter((x) => x >= 1 && x <= 5)
  const missing = [1, 2, 3, 4, 5].filter((x) => !numbers.has(x))
  return { found, missing, unique: found.length, total }
 }

 function getSetProgressPct(setId) {
  const progress = Array.isArray(state.profile?.setProgress) ? state.profile.setProgress : []
  const row = progress.find((item) => String(item.id) === String(setId))
  if (!row) return null
  const pct = Number(row.pct)
  return Number.isFinite(pct) ? Math.max(0, Math.min(100, Math.round(pct))) : null
 }

 function formatSetWithProgress(set) {
  const pct = getSetProgressPct(set.id)
  if (pct === null) return String(set.name || set.id)
  return `${String(set.name || set.id)} - ${pct}%`
 }

 function getSetName(setId) {
  const id = String(setId || "")
  const byRule = SET_UNLOCK_RULES.find((row) => String(row.id) === id)
  if (byRule?.name) return byRule.name
  const byProfile = (state.profile?.setProgress || []).find((row) => String(row.id) === id)
  return String(byProfile?.name || id || "Set")
 }

function getNextSetUnlockInfo(unlockedSetIds = []) {
  const unlocked = new Set((unlockedSetIds || []).map((id) => String(id)))
  const currentLevel = Number(state.profile?.level || state.me?.level || 1)

  for (const rule of SET_UNLOCK_RULES) {
   if (unlocked.has(String(rule.id))) continue
   const prevSetPct = rule.prevSet ? Number(getSetProgressPct(rule.prevSet) || 0) : 0
   return {
    ...rule,
    currentLevel,
    prevSetPct,
    missingLevels: Math.max(0, Number(rule.levelRequired || 1) - currentLevel),
    missingPct: Math.max(0, SET_UNLOCK_THRESHOLD_PCT - prevSetPct),
    prevSetName: rule.prevSet ? getSetName(rule.prevSet) : null
   }
  }

  return null
 }

 function getSetPityState(setId) {
  const pityRows = Array.isArray(state.profile?.pity) ? state.profile.pity : []
  const row = pityRows.find((item) => String(item.setId) === String(setId)) || null
  const ur = Math.max(0, Number(row?.UR || 0))
  const s = Math.max(0, Number(row?.S || 0))
  const ssr = Math.max(0, Number(row?.SSR || 0))
  return {
   UR: ur,
   S: s,
   SSR: ssr,
   toGuaranteed: {
    UR: Math.max(0, 10 - ur),
    S: Math.max(0, 30 - s),
    SSR: Math.max(0, 50 - ssr)
   }
  }
 }

 function setupPacksPanel(meta) {
  const buyQtyInput = document.getElementById("buyPackQty")
  const openQtyInput = document.getElementById("openPackQty")
  const totalBox = document.getElementById("packTotalCost")
  const buyStockBox = document.getElementById("packStockAfterBuy")
  const stockBox = document.getElementById("packStockNow")
  const setInput = document.getElementById("actionSetInput")
  const openHint = document.getElementById("openHint")
  const openQtyPreview = document.getElementById("packOpenQtyPreview")
  const pityBox = document.getElementById("packSetPityBox")
  const setCards = [...document.querySelectorAll(".pack-set-card[data-set-id]")]
  const price = Number(meta.packPrice || 0)
  const stock = Number(meta.packStock || 0)

  function syncActiveSetCard() {
   const selectedId = String(setInput?.value || "")
   setCards.forEach((card) => {
    card.classList.toggle("active", String(card.dataset.setId || "") === selectedId)
   })
  }

  function refresh() {
   const buyQty = parseSafeQty(buyQtyInput?.value, 1, 50, 1)
   const openQty = parseSafeQty(openQtyInput?.value, 1, 25, 1)
   if (buyQtyInput) buyQtyInput.value = String(buyQty)
   if (openQtyInput) openQtyInput.value = String(openQty)
   if (totalBox) totalBox.textContent = `💰 ${fmt(price * buyQty)}`
   if (buyStockBox) buyStockBox.textContent = `${fmt(stock + buyQty)} packs après achat`
   if (stockBox) {
    const left = Math.max(0, stock - openQty)
    stockBox.textContent = `${fmt(left)} packs après ouverture`
   }
   if (openQtyPreview) openQtyPreview.textContent = `x${fmt(openQty)} pack(s) a ouvrir`
   if (openHint) {
    const selectedName = String(setInput?.selectedOptions?.[0]?.dataset?.setName || setInput?.selectedOptions?.[0]?.textContent || "Set")
    openHint.textContent = `Ouverture ciblee sur ${selectedName}`
   }
   if (pityBox) {
    const selectedSetId = String(setInput?.value || "")
    const selectedSetName = String(setInput?.selectedOptions?.[0]?.dataset?.setName || setInput?.selectedOptions?.[0]?.textContent || selectedSetId || "Set")
    const pity = getSetPityState(selectedSetId)
    const urPct = Math.max(0, Math.min(100, Math.round((pity.UR / 10) * 100)))
    const sPct = Math.max(0, Math.min(100, Math.round((pity.S / 30) * 100)))
    const ssrPct = Math.max(0, Math.min(100, Math.round((pity.SSR / 50) * 100)))
    pityBox.innerHTML = `
     <h3>Pity du set</h3>
     <p class="mode-muted">${escapeHtml(selectedSetName)}</p>
     <div class="pack-pity-grid pack-pity-grid-bars">
      <div class="pack-pity-row">
       <div class="pack-pity-head"><span>UR</span><strong>${fmt(pity.UR)}/10</strong></div>
       <div class="set-bar"><div class="set-bar-fill ${getPctClass(urPct)}" style="width:${urPct}%"></div></div>
       <small>Garantie dans ${fmt(pity.toGuaranteed.UR)} pack(s)</small>
      </div>
      <div class="pack-pity-row">
       <div class="pack-pity-head"><span>S</span><strong>${fmt(pity.S)}/30</strong></div>
       <div class="set-bar"><div class="set-bar-fill ${getPctClass(sPct)}" style="width:${sPct}%"></div></div>
       <small>Garantie dans ${fmt(pity.toGuaranteed.S)} pack(s)</small>
      </div>
      <div class="pack-pity-row">
       <div class="pack-pity-head"><span>SSR</span><strong>${fmt(pity.SSR)}/50</strong></div>
       <div class="set-bar"><div class="set-bar-fill ${getPctClass(ssrPct)}" style="width:${ssrPct}%"></div></div>
       <small>Garantie dans ${fmt(pity.toGuaranteed.SSR)} pack(s)</small>
      </div>
     </div>
    `
   }
   syncActiveSetCard()
  }

  if (buyQtyInput) buyQtyInput.addEventListener("input", refresh)
  if (openQtyInput) openQtyInput.addEventListener("input", refresh)
  if (setInput) setInput.addEventListener("change", refresh)
  setCards.forEach((card) => {
   card.addEventListener("click", () => {
    if (!setInput) return
    setInput.value = String(card.dataset.setId || "")
    refresh()
   })
  })
  refresh()
 }

function setupFusionPanel() {
 const setInput = document.getElementById("fusionSetInput")
 const qtyInput = document.getElementById("fusionQtyInput")
 const runBtn = document.getElementById("fusionRunBtn")
 const infoLine = document.getElementById("fusionInfoLine")
 const historyBox = document.getElementById("fusionHistoryList")
 const stepButtons = [...document.querySelectorAll(".fusion-simple-step[data-rarity]")]
 const fusionRows = getFusionRows()
 if (!setInput || !qtyInput || !runBtn || !historyBox || !stepButtons.length || !fusionRows.length) return

 const setOptions = [...setInput.options].map((opt) => String(opt.value))
 const rarityOptions = fusionRows.map((row) => String(row.rarity || "").toUpperCase())

 if (!setOptions.includes(String(state.fusionUi.setId || ""))) {
  state.fusionUi.setId = setOptions[0] || ""
 }
 if (!rarityOptions.includes(String(state.fusionUi.fromRarity || ""))) {
  state.fusionUi.fromRarity = rarityOptions[0] || "C"
 }
 state.fusionUi.quantity = parseSafeQty(state.fusionUi.quantity || 1, 1, FUSION_MAX_CYCLES, 1)

 function renderHistory() {
  if (!Array.isArray(state.fusionHistory) || !state.fusionHistory.length) {
   historyBox.innerHTML = '<p class="mode-muted">Aucune fusion dans cette session.</p>'
   return
  }
  historyBox.innerHTML = state.fusionHistory.slice(0, 10).map((entry) => `
   <article class="fusion-history-item">
    <div>
     <strong>${escapeHtml(entry.from)} → ${escapeHtml(entry.to)}</strong>
     <small>${escapeHtml(entry.setName || "Set")}</small>
    </div>
    <div>
     <span>${escapeHtml(entry.rewardName || "Carte")}</span>
     <small>${new Date(Number(entry.timestamp || Date.now())).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</small>
    </div>
   </article>
  `).join("")
 }

 function refresh() {
  setInput.value = String(state.fusionUi.setId || "")
  const qty = parseSafeQty(qtyInput.value || state.fusionUi.quantity || 1, 1, FUSION_MAX_CYCLES, 1)
  state.fusionUi.quantity = qty
  qtyInput.value = String(qty)

  const fromRarity = String(state.fusionUi.fromRarity || "C").toUpperCase()
  const row = getFusionRowByRarity(fromRarity)
  const next = getNextRarityFromMeta(fromRarity) || "-"
  const info = getDuplicateInfoForFusion(state.fusionUi.setId, fromRarity)
  const cost = Number(row?.cost || 0)
  const maxCycles = cost > 0 ? Math.floor(info.duplicates / cost) : 0
  const requested = Math.max(0, Math.min(qty, maxCycles))

  stepButtons.forEach((btn) => {
   const rarity = String(btn.dataset.rarity || "").toUpperCase()
   const btnRow = getFusionRowByRarity(rarity)
   const btnInfo = getDuplicateInfoForFusion(state.fusionUi.setId, rarity)
   const btnCost = Number(btnRow?.cost || 0)
   const stockTag = btn.querySelector("[data-fusion-stock]")
   if (stockTag) stockTag.textContent = `${fmt(btnInfo.duplicates)}/${fmt(btnCost)}`
   btn.classList.toggle("active", rarity === fromRarity)
   btn.classList.toggle("ready", btnCost > 0 && btnInfo.duplicates >= btnCost)
   btn.disabled = !btnRow
  })

  if (infoLine) {
   const fromEmoji = getRarityEmoji(fromRarity)
   const nextEmoji = next && next !== "-" ? getRarityEmoji(next) : ""
   infoLine.textContent = `${fromEmoji} ${fromRarity} → ${nextEmoji ? `${nextEmoji} ${next}` : next} • ${fmt(info.duplicates)} doublons dispo • coût ${fmt(cost)} • prêt: ${fmt(requested)} fusion(s)`
  }
  runBtn.disabled = !(state.fusionUi.setId && row && requested > 0)
  runBtn.dataset.requested = String(requested)

function getFusionAnimationFragments(setId, rarity, needed = 5) {
 const slots = []
 const safeNeeded = Math.max(1, Number(needed || 5))
 const cards = getCardsForSetAndRarity(setId, rarity)

 for (const card of cards) {
  const qty = Number(card.qty || 0)
  const duplicates = Math.max(0, qty - 1)
  for (let i = 0; i < duplicates; i++) {
   slots.push({
    cardName: String(card.cardName || "Fragment"),
    imageUrl: card.imageUrl || null,
    rarity: String(card.rarity || rarity || "C")
   })
   if (slots.length >= safeNeeded) break
  }
  if (slots.length >= safeNeeded) break
 }

 if (slots.length < safeNeeded) {
  for (const card of cards) {
   const qty = Math.max(1, Number(card.qty || 0))
   for (let i = 0; i < qty; i++) {
    slots.push({
     cardName: String(card.cardName || "Fragment"),
     imageUrl: card.imageUrl || null,
     rarity: String(card.rarity || rarity || "C")
    })
    if (slots.length >= safeNeeded) break
   }
   if (slots.length >= safeNeeded) break
  }
 }

 while (slots.length < safeNeeded) {
  slots.push({
   cardName: `${String(rarity || "C")} fragment`,
   imageUrl: null,
   rarity: String(rarity || "C")
  })
 }

 return slots.slice(0, safeNeeded)
}

function buildFusionForgeOrbitMarkup(fragments = [], fallbackRarity = "C") {

 while (slots.length < 5) {

 }
 return slots.map((fragment, index) => `

   <div class="fusion-forge-orb-core">
    ${fragment?.imageUrl

     : `<span>${escapeHtml(String(fragment?.rarity || fallbackRarity).charAt(0))}</span>`}

 `).join("")
}

function getRarityToken(rarity) {
  return String(rarity || "C").toUpperCase().replace(/[^A-Z]/g, "") || "C"
 }

 function getPackBackImageForRarity(rarity) {
  const token = getRarityToken(rarity)
  return PACK_BACK_IMAGE_BY_RARITY[token] || PACK_BACK_IMAGE_DEFAULT
 }

 function getPctClass(percent) {
  const pct = Number(percent || 0)
  if (pct >= 100) return "pct-100"
  if (pct >= 70) return "pct-70"
  if (pct >= 50) return "pct-50"
  return "pct-0"
 }

 function expandGroupedCards(cards = []) {
  const expanded = []
  for (const item of cards || []) {
   const qty = Math.max(1, Number(item?.qty || 1))
   for (let i = 0; i < qty; i++) {
    expanded.push({
     cardId: String(item?.cardId || ""),
     cardName: String(item?.cardName || "Carte"),
     rarity: String(item?.rarity || "C"),
     set: String(item?.set || ""),
     image: item?.image || null,
     shiny: Boolean(item?.shiny),
     isNew: Boolean(item?.isNew)
    })
   }
  }
  return expanded
 }

 function getRevealCards(payload) {
  const reveal = Array.isArray(payload?.revealCards) && payload.revealCards.length
   ? payload.revealCards.slice()
   : expandGroupedCards(payload?.cards || [])
  const maxCards = 24
  return {
   visible: reveal.slice(0, maxCards),
   hiddenCount: Math.max(0, reveal.length - maxCards)
  }
 }

function buildPackRevealGroups(payload, revealCards) {
 const groups = []
 const pulls = Array.isArray(payload?.pulls) ? payload.pulls : []
 let cursor = 0

 if (pulls.length) {
  pulls.forEach((pull, index) => {
   const expectedSize = pull?.luckyPack ? 6 : 5
   const cards = revealCards.slice(cursor, cursor + expectedSize)
   cursor += expectedSize
   if (!cards.length) return
   groups.push({
    index: index + 1,
    lucky: Boolean(pull?.luckyPack),
    cards
   })
  })
 }

 while (cursor < revealCards.length) {
  const nextCards = revealCards.slice(cursor, cursor + 5)
  if (!nextCards.length) break
  groups.push({
   index: groups.length + 1,
   lucky: nextCards.length === 6,
   cards: nextCards
  })
  cursor += 5
 }

 if (!groups.length) {
  groups.push({
   index: 1,
   lucky: revealCards.length === 6,
   cards: revealCards.slice()
  })
 }

 return groups
}

 const skipBtn = document.getElementById("packSkipBtn")

     </div>

   `).join("")
  }

  function getRevealRarity(cardEl) {
   if (cardEl?.classList?.contains("rarity-ssr")) return "SSR"
   if (cardEl?.classList?.contains("rarity-s")) return "S"
   return "NORMAL"
  }

  function getRevealProfile(cardEl, mode = "single") {
   const rarity = getRevealRarity(cardEl)
   const baseGap = mode === "multi" ? 95 : 780
   const flipDuration = 1250
   if (rarity === "SSR") {
    const focusIn = 1250
    const rectoHold = 2000
    const focusOut = 320
    const nextGap = focusIn + flipDuration + rectoHold + focusOut + (mode === "multi" ? 160 : 220)
    return {
     rarity,
     isRare: true,
     focusIn,
     rectoHold,
     focusOut,
     flipDuration,
     scale: window.innerWidth < 720 ? 1.85 : 2,
     nextGap
    }
   }
   if (rarity === "S") {
    const focusIn = 190
    const rectoHold = 900
    const focusOut = 260
    const nextGap = focusIn + flipDuration + rectoHold + focusOut + (mode === "multi" ? 160 : 220)
    return {
     rarity,
     isRare: true,
     focusIn,
     rectoHold,
     focusOut,
     flipDuration,
     scale: window.innerWidth < 720 ? 1.62 : 1.82,
     nextGap
    }
   }
   return {
    rarity,
    isRare: false,
    focusIn: 0,
    rectoHold: 0,
    focusOut: 0,
    flipDuration: 0,
    scale: 1,
    nextGap: baseGap
   }
  }

  function setRareFocusPosition(cardEl, profile) {
   if (!cardEl) return
   const dialog = overlay.querySelector(".pack-open-dialog")
   if (!dialog) return
   const cardRect = cardEl.getBoundingClientRect()
   const dialogRect = dialog.getBoundingClientRect()
   if (!cardRect.width || !cardRect.height || !dialogRect.width || !dialogRect.height) return
   const cardCenterX = cardRect.left + (cardRect.width / 2)
   const cardCenterY = cardRect.top + (cardRect.height / 2)
   const targetCenterX = dialogRect.left + (dialogRect.width / 2)
   const targetCenterY = dialogRect.top + (dialogRect.height * 0.5)
   const shiftX = targetCenterX - cardCenterX
   const shiftY = targetCenterY - cardCenterY
   cardEl.style.setProperty("--rare-shift-x", `${Math.round(shiftX)}px`)
   cardEl.style.setProperty("--rare-shift-y", `${Math.round(shiftY)}px`)
   cardEl.style.setProperty("--rare-scale", String(profile?.scale || 1.5))
  }

  function playRevealCardAnimation(cardEl, mode = "single") {
   if (!cardEl) return
   const profile = getRevealProfile(cardEl, mode)
   if (!profile.isRare) {
    cardEl.classList.add("revealed")
    return
   }
   setRareFocusPosition(cardEl, profile)
   cardEl.classList.remove("rare-return", "rare-focus-ssr")
   cardEl.classList.add("no-rare-flash")
   if (profile.rarity === "SSR") cardEl.classList.add("rare-focus-ssr")
   cardEl.classList.add("rare-focus")
   const focusIn = profile.focusIn
   const rectoHold = profile.rectoHold
   const flipDuration = profile.flipDuration
   const focusOut = profile.focusOut
   const flipTimer = window.setTimeout(() => {
    cardEl.classList.add("revealed")
   }, focusIn)
   const settleAt = focusIn + flipDuration + rectoHold
   const settleTimer = window.setTimeout(() => {
    cardEl.classList.remove("rare-focus")
    cardEl.classList.add("rare-return")
   }, settleAt)
   const clearTimer = window.setTimeout(() => {
    cardEl.classList.remove("rare-return", "rare-focus-ssr")
    cardEl.style.removeProperty("--rare-shift-x")
    cardEl.style.removeProperty("--rare-shift-y")
    cardEl.style.removeProperty("--rare-scale")
   }, settleAt + focusOut)
   packRevealTimers.push(flipTimer, settleTimer, clearTimer)
  }

  function setFootText() {
   if (hasMultiGroups) {
    foot.textContent = "Ouverture progressive en etages (pack par pack). Fais defiler la fenetre pour tout voir."
    return

    skipBtn.disabled = true
    skipBtn.style.display = "none"
   }
   if (replayBtn) {
    replayBtn.disabled = false
    replayBtn.style.display = ""
   }
  }

  function runRevealAnimation(animated) {

     tier.classList.add("active")
    }, Math.max(0, tierStart - 110))
    packRevealTimers.push(tierMarkTimer)
    tierCards.forEach((cardEl) => {
     const revealAt = revealCursor
     const timer = window.setTimeout(() => {
      playRevealCardAnimation(cardEl, "multi")
     }, revealAt)
     packRevealTimers.push(timer)
     const profile = getRevealProfile(cardEl, "multi")
     revealCursor += profile.nextGap
     })
    revealCursor += tierIndex < tiers.length - 1 ? 150 : 0
    })
    const doneTimer = window.setTimeout(() => {
     showCompleteState()
   }, revealCursor + 420)
    packRevealTimers.push(doneTimer)
    return
   }

   const cardEls = [...grid.querySelectorAll(".pack-reveal-card")]
   let revealCursor = 1400
   cardEls.forEach((el) => {
    const revealAt = revealCursor
    const timer = window.setTimeout(() => {
     playRevealCardAnimation(el, "single")
    }, revealAt)
    packRevealTimers.push(timer)
    const profile = getRevealProfile(el, "single")
    revealCursor += profile.nextGap
   })
   const doneTimer = window.setTimeout(() => {
    showCompleteState()
   }, revealCursor + 460)
   packRevealTimers.push(doneTimer)
  }

  if (selectorBox) {
   selectorBox.style.display = "none"
   selectorBox.innerHTML = ""
  }

  const pityCounters = payload?.pity?.counters || {}
  const pityToGuaranteed = payload?.pity?.toGuaranteed || {}
  const summaryItems = allCards.map((card) => {
   const rarity = String(card?.rarity || "C")
   const qtyLabel = Number(card?.qty || 0)
   const newTag = Boolean(card?.isNew) ? '<span class="pack-summary-new">✨ NEW</span>' : ""
   return `
    <li class="pack-summary-row rarity-${getRarityToken(rarity).toLowerCase()}">
     <span><strong>${escapeHtml(rarity)} ${escapeHtml(card?.cardName || "Carte")}</strong> ${newTag}</span>
     <small>x${fmt(qtyLabel)}</small>
    </li>
   `
  }).join("")

  const totalNew = revealCards.filter((card) => Boolean(card?.isNew)).length

  const pityUr = Number(pityCounters.UR || 0)
  const pityS = Number(pityCounters.S || 0)
  const pitySsr = Number(pityCounters.SSR || 0)
  const urPct = Math.max(0, Math.min(100, Math.round((pityUr / 10) * 100)))
  const sPct = Math.max(0, Math.min(100, Math.round((pityS / 30) * 100)))
  const ssrPct = Math.max(0, Math.min(100, Math.round((pitySsr / 50) * 100)))

  summary.innerHTML = `
   <div class="pack-summary-block">
    <h4>Recap de l'ouverture</h4>
    <p class="pack-summary-meta">${fmt(revealCards.length)} carte(s) tiree(s) • ${fmt(totalNew)} nouvelle(s)</p>
    <ul class="pack-summary-list">
     ${summaryItems || '<li class="pack-summary-row"><span>Aucune carte</span><small>x0</small></li>'}
    </ul>
   </div>
   <div class="pack-summary-block">
    <h4>Pity (${escapeHtml(String(payload?.setId || "set"))})</h4>
    <div class="pack-pity-grid pack-pity-grid-bars">
     <div class="pack-pity-row">
      <div class="pack-pity-head"><span>UR</span><strong>${fmt(pityUr)}/10</strong></div>
      <div class="set-bar"><div class="set-bar-fill ${getPctClass(urPct)}" style="width:${urPct}%"></div></div>
      <small>Garantie dans ${fmt(Number(pityToGuaranteed.UR || 0))} pack(s)</small>
     </div>
     <div class="pack-pity-row">
      <div class="pack-pity-head"><span>S</span><strong>${fmt(pityS)}/30</strong></div>
      <div class="set-bar"><div class="set-bar-fill ${getPctClass(sPct)}" style="width:${sPct}%"></div></div>
      <small>Garantie dans ${fmt(Number(pityToGuaranteed.S || 0))} pack(s)</small>
     </div>
     <div class="pack-pity-row">
      <div class="pack-pity-head"><span>SSR</span><strong>${fmt(pitySsr)}/50</strong></div>
      <div class="set-bar"><div class="set-bar-fill ${getPctClass(ssrPct)}" style="width:${ssrPct}%"></div></div>
      <small>Garantie dans ${fmt(Number(pityToGuaranteed.SSR || 0))} pack(s)</small>
     </div>
    </div>
   </div>
  `

  overlay.classList.remove("complete")
  overlay.classList.toggle("multi-open", hasMultiGroups)
  overlay.setAttribute("aria-hidden", "false")
  document.body.classList.add("pack-opening-lock")
  if (skipBtn) {
   skipBtn.disabled = false
   skipBtn.style.display = ""
   skipBtn.onclick = () => completePackOpeningReveal()
  }
  if (replayBtn) {
   replayBtn.disabled = true
   replayBtn.style.display = "none"
   replayBtn.onclick = () => {
    replayBtn.disabled = true
    closePackOpeningOverlay()
    window.setTimeout(() => {
     handleOpenPacksAction().catch(() => {})
    }, 180)
   }
  }
  window.requestAnimationFrame(() => {
   overlay.classList.add("open")
  })

  runRevealAnimation(true)

  return new Promise((resolve) => {
   packRevealResolve = resolve
  })
 }

async function handleFusionAction() {
 const stage = document.getElementById("fusionForgeStage")
 if (String(stage?.getAttribute("data-busy") || "0") === "1") return

 const setId = String(state.fusionUi.setId || document.getElementById("fusionSetInput")?.value || "").trim()
 const fromRarity = String(state.fusionUi.fromRarity || "").toUpperCase()
 const qtyInput = document.getElementById("fusionQtyInput")
 const sourceRow = getFusionRowByRarity(fromRarity)
 const sourceInfo = getDuplicateInfoForFusion(setId, fromRarity)
 const cost = Number(sourceRow?.cost || 0)
 const maxSingleFusions = cost > 0 ? Math.floor(sourceInfo.duplicates / cost) : 0
 const askedQty = parseSafeQty(qtyInput?.value || state.fusionUi.quantity || 1, 1, FUSION_MAX_CYCLES, 1)
 state.fusionUi.quantity = askedQty
 if (qtyInput) qtyInput.value = String(askedQty)
 const requestedCycles = Math.max(0, Math.min(askedQty, maxSingleFusions))
 if (!setId || !fromRarity || !sourceRow || requestedCycles <= 0) {
  showActionResult("fusionResultBox", "<p>Impossible de lancer la fusion avec les paramètres actuels.</p>", true)
  return
 }

 const runBtn = document.getElementById("fusionRunBtn")
 const baseLabel = String(runBtn?.textContent || "Valider")
 let refreshed = false

 try {
  if (runBtn) {
   runBtn.disabled = true
   runBtn.textContent = "Forge en cours..."
  }
  showActionResult("fusionResultBox", "<p>Canalisation des fragments...</p>")

  const logs = []
  let interruption = ""
  for (let cycle = 0; cycle < requestedCycles; cycle++) {
   const res = await postJson("/api/game/fuse", { setId, rarity: fromRarity })
   if (!res.ok) {
    if (!logs.length) {
     showActionResult("fusionResultBox", `<p>${escapeHtml(res.data?.error || "Fusion impossible.")}</p>`, true)
     return
    }
    interruption = String(res.data?.error || "Fusion interrompue.")
    break
   }

   const data = res.data || {}
   logs.push({
    setId,
    setName: getSetName(setId),
    from: String(data.fromRarity || fromRarity),
    to: String(data.toRarity || getNextRarityFromMeta(fromRarity) || ""),
    rewardName: String(data?.reward?.cardName || "Carte"),
    rewardRarity: String(data?.reward?.rarity || data.toRarity || ""),
    rewardImage: data?.reward?.imageUrl || null,
    reward: data?.reward || null,
    timestamp: Date.now()
   })
  }

  if (!logs.length) {
   showActionResult("fusionResultBox", "<p>Aucune fusion effectuée.</p>", true)
   return
  }

  const last = logs[logs.length - 1]
  await playFusionForgeAnimation({
   fromRarity: last.from,
   toRarity: last.to,
   reward: {
    cardName: last.rewardName,
    rarity: last.rewardRarity,
    imageUrl: last.rewardImage
   },
   fragments: getFusionAnimationFragments(setId, last.from, 5)
  })

  state.fusionHistory = logs.slice().reverse().map((entry) => ({
   from: entry.from,
   to: entry.to,
   rewardName: `${entry.rewardRarity} ${entry.rewardName}`.trim(),
   setName: entry.setName,
   timestamp: entry.timestamp
  })).concat(state.fusionHistory || []).slice(0, 24)

  const summary = `
   <p><strong>Forge terminée:</strong> ${fmt(logs.length)} fusion(s) validée(s) sur ${fmt(requestedCycles)} demandée(s)</p>
   <p>Dernier résultat: ${escapeHtml((last.rewardRarity ? `${last.rewardRarity} ` : "") + (last.rewardName || "Carte"))}</p>
   ${interruption ? `<p class="mode-muted">Arrêt partiel: ${escapeHtml(interruption)}</p>` : ""}
  `
  await reloadGameplayDataAndRender()
  refreshed = true
  showActionResult("fusionResultBox", summary)
 } finally {
  if (!refreshed && runBtn) {
   runBtn.disabled = false
   runBtn.textContent = baseLabel
  }
 }
}

  })

  document.addEventListener("click", (event) => {
   const link = event.target.closest("[data-play-mode]")
   if (!link) return
   event.preventDefault()
   setMode(link.dataset.playMode)
  })

  document.querySelectorAll(".play-subtab").forEach((btn) => {
   btn.addEventListener("click", () => setInventoryView(btn.dataset.view))
  })

  document.getElementById("searchInput").addEventListener("input", renderCurrentMode)
  document.getElementById("setFilter").addEventListener("change", renderCurrentMode)
  document.getElementById("rarityFilter").addEventListener("change", renderCurrentMode)

  document.getElementById("sortBtn").addEventListener("click", () => {
   state.sortDesc = !state.sortDesc
   document.getElementById("sortBtn").textContent = state.sortDesc ? "Tri Qté v" : "Tri Qté ^"
   renderCurrentMode()
  })

  document.getElementById("playPacks").addEventListener("click", (event) => {
   if (event.target && event.target.id === "buyPacksBtn") return handleBuyPacksAction().catch(() => {})
   if (event.target && event.target.id === "openPacksBtn") return handleOpenPacksAction().catch(() => {})
  })

 document.getElementById("playFusion").addEventListener("click", (event) => {
  const btn = event.target.closest("#fusionRunBtn")
  if (btn) return handleFusionAction().catch(() => {})
 })

  document.getElementById("playCraft").addEventListener("click", (event) => {
   if (event.target && event.target.id === "craftBtn") return handleCraftAction().catch(() => {})
  })
 }

 async function bootstrap() {
  bindEvents()
  setMode(parseModeFromPath(), false)
  try {
   await loadData()
   renderCurrentMode()
  } catch (_) {
   window.location.href = "/"
  }
 }

 bootstrap()
 </script>
</body>
</html>
