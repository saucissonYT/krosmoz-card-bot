if (__initialPlayTab === "fusion") {

} else if (__initialPlayTab === "craft") {

} else if (__initialPlayTab === "packs") {

} else if (__initialPlayTab === "inventory") {

}

 <script src="/js/web-auth.js"></script>
 <script>
 const MODE_PATH = {
  inventory: "/play/inventory",
  packs: "/play/packs",
  fusion: "/play/fusion",
  craft: "/play/craft",
  quests: "/play/quests"
 }

 const RARITY_ORDER = ["C", "U", "R", "SR", "HR", "UR", "S", "SSR"]
const state = {
 mode: "inventory",
 inventoryView: "cards",
 sortDesc: true,
  me: null,
  profile: null,
  inventory: null,
 groupedFragments: [],
 gameMeta: null,
 selected: null,
 fusionUi: {
  setId: "",
  fromRarity: "C",
  quantity: 1
 },
 fusionHistory: [],
 craftUi: {
  cardId: ""
 },
 craftHistory: [],
 questsState: null
}
 const PACK_BACK_IMAGE_DEFAULT = "/assets/ui/pack-back-normal.png"
 const PACK_BACK_IMAGE_BY_RARITY = {
  S: "/assets/ui/pack-back-s.png",
  SSR: "/assets/ui/pack-back-ssr.png"
 }
 const SET_UNLOCK_THRESHOLD_PCT = 70
const SET_UNLOCK_RULES = [
  { id: "incarnam", name: "Incarnam", levelRequired: 1, prevSet: null },
  { id: "astrub", name: "Astrub", levelRequired: 11, prevSet: "incarnam" },
  { id: "amakna", name: "Amakna", levelRequired: 36, prevSet: "astrub" },
  { id: "sufokia", name: "Sufokia", levelRequired: 51, prevSet: "amakna" },
  { id: "kelba", name: "Kelba", levelRequired: 66, prevSet: "sufokia" },
  { id: "katrepat", name: "Katrepat", levelRequired: 81, prevSet: "kelba" },
  { id: "sberg", name: "Sberg", levelRequired: 96, prevSet: "katrepat" }
]
let packRevealResolve = null
let packRevealEscHandlerBound = false
let packRevealTimers = []
const FUSION_MAX_CYCLES = 25

 function escapeHtml(value) {
  const div = document.createElement("div")
  div.textContent = String(value || "")
  return div.innerHTML
 }

 function fmt(n) { return Number(n || 0).toLocaleString("fr-FR") }
 function rarityRank(rarity) {
  const idx = RARITY_ORDER.indexOf(String(rarity || "").toUpperCase())
  return idx >= 0 ? idx : 99
 }

 function parseModeFromPath() {
  const tab = String(window.location.pathname || "").split("/")[2] || "inventory"
  return ["inventory", "packs", "fusion", "craft", "quests"].includes(tab) ? tab : "inventory"
 }

 async function fetchJson(url, options = {}) {
  const res = await fetch(url, { credentials: "same-origin", ...options })
  let data = null
  try { data = await res.json() } catch (_) {}
  return { ok: res.ok, status: res.status, data }
 }

 async function postJson(url, body) {
  return fetchJson(url, {
   method: "POST",
   headers: { "Content-Type": "application/json" },
   body: JSON.stringify(body || {})
  })
 }

 async function requireLogin() {
  const meRes = await fetchJson("/api/me")
  if (!meRes.ok || !meRes.data || !meRes.data.id) throw new Error("not_connected")
  state.me = meRes.data
 }

function setMode(mode, updateUrl = true) {
  state.mode = mode
  state.selected = null
  const isForgeMode = mode === "fusion" || mode === "craft"
  document.body.classList.toggle("route-inventory-bg", mode === "inventory")
  document.body.classList.toggle("inventory-bg-active", mode === "inventory")
  document.body.classList.toggle("route-quests-bg", mode === "quests")
  document.body.classList.toggle("quests-bg-active", mode === "quests")
  document.body.classList.toggle("route-fusion-bg", mode === "fusion")
  document.body.classList.toggle("fusion-bg-active", mode === "fusion")
  document.body.classList.toggle("route-craft-bg", mode === "craft")
  document.body.classList.toggle("craft-bg-active", mode === "craft")
  document.body.classList.toggle("fusion-mode-active", isForgeMode)
  document.body.classList.toggle("route-pack-bg", mode === "packs")
  document.body.classList.toggle("pack-bg-active", mode === "packs")
  document.body.classList.toggle("packs-mode-active", mode === "packs")
  document.querySelectorAll("[data-play-mode]").forEach((tab) => {
   tab.classList.toggle("active", tab.dataset.playMode === mode)
  })
  if (updateUrl && MODE_PATH[mode]) window.history.replaceState({}, "", MODE_PATH[mode])
  renderCurrentMode()
 }

 function setInventoryView(view) {
  state.inventoryView = view
  state.selected = null
  if (view === "fragments") {
   const rarityFilter = document.getElementById("rarityFilter")
   if (rarityFilter) rarityFilter.value = ""
  }
  document.querySelectorAll(".play-subtab").forEach((btn) => {
   btn.classList.toggle("active", btn.dataset.view === view)
  })
  renderCurrentMode()
 }

 function groupFragments(fragments = []) {
  const grouped = new Map()
  for (const fragment of fragments) {
   const key = `${fragment.cardId}:${fragment.fragmentNumber}`
   if (!grouped.has(key)) {
    grouped.set(key, {
     key,
     itemType: "fragment",
     cardId: String(fragment.cardId),
     fragmentNumber: Number(fragment.fragmentNumber || 0),
     cardName: fragment.cardName || `Carte ${fragment.cardId}`,
     rarity: fragment.rarity || "SSR",
     set: fragment.set || "unknown",
     setName: fragment.setName || fragment.set || "unknown",
     imageUrl: fragment.imageUrl || null,
     qty: 0
    })
   }
   grouped.get(key).qty += 1
  }
  return [...grouped.values()].sort((a, b) =>
   String(a.cardName).localeCompare(String(b.cardName), "fr") || a.fragmentNumber - b.fragmentNumber
  )
 }

 async function loadData() {
  await requireLogin()

  const [profileRes, inventoryRes, gameMetaRes] = await Promise.all([
   fetchJson(`/api/profile/${encodeURIComponent(state.me.id)}`),
   fetchJson("/api/me/inventory"),
   fetchJson("/api/game/meta")
  ])
  if (profileRes.ok) state.profile = profileRes.data
  if (inventoryRes.ok) state.inventory = inventoryRes.data
  if (gameMetaRes.ok) state.gameMeta = gameMetaRes.data
  state.groupedFragments = groupFragments((state.inventory && state.inventory.fragments) || [])

  const setSelect = document.getElementById("setFilter")
  setSelect.innerHTML = '<option value="">Tous les sets</option>'
  const sets = new Map()
  for (const item of ((state.inventory && state.inventory.cards) || [])) sets.set(item.set, item.setName || item.set)
  for (const item of state.groupedFragments) sets.set(item.set, item.setName || item.set)
  const options = [...sets.entries()].sort((a, b) => String(a[1]).localeCompare(String(b[1]), "fr"))
  for (const [id, name] of options) {
   const opt = document.createElement("option")
   opt.value = id
   opt.textContent = name
   setSelect.appendChild(opt)
  }

 }

 function getActiveSource() {
  if (state.mode === "inventory" && state.inventoryView === "fragments") return state.groupedFragments
  return (state.inventory && state.inventory.cards) || []
 }

 function getFilteredItems() {
  const query = String(document.getElementById("searchInput").value || "").trim().toLowerCase()
  const set = document.getElementById("setFilter").value
  const rarity = document.getElementById("rarityFilter").value

  const items = getActiveSource().filter((item) => {
   if (query && !String(item.cardName || "").toLowerCase().includes(query)) return false
   if (set && String(item.set) !== String(set)) return false
   if (rarity && String(item.rarity) !== String(rarity)) return false
   if (state.mode === "inventory" && state.inventoryView === "cards" && Number(item.qty || 0) <= 0) return false
   return true
  })

  items.sort((a, b) => {
   const qtyCmp = state.sortDesc ? Number(b.qty || 0) - Number(a.qty || 0) : Number(a.qty || 0) - Number(b.qty || 0)
   if (qtyCmp !== 0) return qtyCmp
   const rarityCmp = rarityRank(a.rarity) - rarityRank(b.rarity)
   if (rarityCmp !== 0) return rarityCmp
   return String(a.cardName || "").localeCompare(String(b.cardName || ""), "fr")
  })
  return items
 }

function renderInventoryGrid() {
 const grid = document.getElementById("playGrid")
 const items = getFilteredItems()
 if (!items.length) {
  grid.innerHTML = '<div class="play-empty"><h3>Vide</h3><p>Aucun résultat avec ces filtres.</p></div>'
  return
 }
 grid.innerHTML = items.map((item) => {
  const isCard = state.inventoryView === "cards" && String(item.itemType || "card") !== "fragment"
  const rarity = String(item.rarity || "C").toUpperCase()
  const setName = String(item.setName || item.set || "Set")
  const cardName = String(item.cardName || "Carte")
  const cardId = String(item.cardId || "")
  const qty = Number(item.qty || 0)
  const isFragment = String(item.itemType || "card") === "fragment"
  const quantityLabel = isFragment
   ? `Fragment ${Number(item.fragmentNumber || 0)}/5 • x${fmt(qty)}`
   : `Possedees: x${fmt(qty)}`
  const sellPrice = Number(item.sellPrice || 0)
  const miniThumbSrc = String(item.imageUrl || "/assets/ui/pack-back-normal.png")
  const sellAction = isCard
   ? `
      <div class="action-row play-card-actions">
       <button
        type="button"
        class="btn btn-outline play-card-sell-btn"
        data-card-id="${escapeHtml(item.cardId)}"
        data-card-name="${escapeHtml(item.cardName || "Carte")}"
        data-sell-price="${sellPrice}">
        Vendre ${fmt(sellPrice)} kamas
       </button>
      </div>
     `
   : ""
  return `
    <article class="play-card kshop-card play-kshop-card">
     <div class="kshop-card-head">
      <span class="chip chip-rarity">${escapeHtml(rarity)}</span>
      <span class="chip">${escapeHtml(setName)}</span>
     </div>
     <h3>${escapeHtml(cardName)}</h3>
     <p class="kshop-muted">${cardId ? `ID #${escapeHtml(cardId)}` : "ID --"}</p>
     <div class="kshop-meta-row">
      <div class="kshop-meta-main">
       <p class="kshop-price-line"><strong>${escapeHtml(quantityLabel)}</strong></p>
      </div>
      <div class="kshop-mini-thumb-wrap" aria-hidden="true">
       <img class="kshop-mini-thumb" loading="lazy" src="${escapeHtml(miniThumbSrc)}" alt="" onerror="this.src='/assets/ui/pack-back-normal.png'">
      </div>
     </div>
     ${sellAction}
    </article>
   `
  }).join("")

  grid.querySelectorAll(".play-card-sell-btn").forEach((btn) => {
   btn.addEventListener("click", async (event) => {
    event.preventDefault()
    event.stopPropagation()
    const cardId = String(btn.dataset.cardId || "").trim()
    const cardName = String(btn.dataset.cardName || "Carte")
    const sellPrice = Number(btn.dataset.sellPrice || 0)
    if (!cardId || !Number.isFinite(sellPrice) || sellPrice <= 0) {
     showActionResult("inventoryActionBox", "<p>Prix de vente indisponible pour cette carte.</p>", true)
     return
    }
    const ok = window.confirm(`Vendre 1 exemplaire de ${cardName} pour ${fmt(sellPrice)} kamas ?`)
    if (!ok) return
    btn.disabled = true
    btn.textContent = "Vente..."
    const res = await postJson("/api/game/sell-card", { cardId })
    if (!res.ok) {
     showActionResult("inventoryActionBox", `<p>${escapeHtml(res.data?.error || "Vente impossible.")}</p>`, true)
     renderCurrentMode()
     return
    }
    const sold = res.data?.sold || {}
    await reloadGameplayDataAndRender()
    showActionResult(
     "inventoryActionBox",
     `<p><strong>Carte vendue :</strong> ${escapeHtml(sold.cardName || cardName)} (${escapeHtml(sold.rarity || "")})</p><p>Gain: +${fmt(Number(sold.gain || sellPrice))} kamas • Solde: ${fmt(Number(sold.kamasAfter || res.data?.kamas || 0))} kamas</p>`
    )
   })
  })
 }

function getCraftCandidates() {
 const grouped = new Map()
 for (const frag of state.groupedFragments || []) {
  const id = String(frag.cardId)
  if (!grouped.has(id)) {
   grouped.set(id, {
     cardId: id,
     cardName: frag.cardName,
     set: String(frag.set || "unknown"),
     setName: String(frag.setName || frag.set || "Set"),
     imageUrl: frag.imageUrl || null,
     numbers: new Set()
    })
   }
   grouped.get(id).numbers.add(Number(frag.fragmentNumber || 0))
  }
  return [...grouped.values()].map((x) => ({
   ...x,
   uniqueCount: x.numbers.size
  })).sort((a, b) => b.uniqueCount - a.uniqueCount || String(a.cardName).localeCompare(String(b.cardName), "fr"))
 }

 function parseSafeQty(value, min, max, fallback = 1) {
  const n = Number(value)
  if (!Number.isFinite(n)) return fallback
  return Math.max(min, Math.min(max, Math.floor(n)))
 }

function getFusionRowByRarity(rarity) {
 const rows = (state.gameMeta && state.gameMeta.fusion) || []
 return rows.find((row) => String(row.rarity || "").toUpperCase() === String(rarity || "").toUpperCase()) || null
}

function getFusionRows() {
 const rows = (state.gameMeta && state.gameMeta.fusion) || []
 return rows.slice().sort((a, b) => rarityRank(a.rarity) - rarityRank(b.rarity))
}

function getCardsForSetAndRarity(setId, rarity) {
 const cards = (state.inventory && state.inventory.cards) || []
 return cards.filter((item) =>
  String(item.set) === String(setId) && String(item.rarity).toUpperCase() === String(rarity).toUpperCase()
 )
}

function getDuplicateInfoForFusion(setId, rarity) {
 const matches = getCardsForSetAndRarity(setId, rarity)
 let owned = 0
 let duplicates = 0
 for (const card of matches) {
  const qty = Number(card.qty || 0)
  owned += qty
  if (qty > 1) duplicates += (qty - 1)
 }
 return { owned, duplicates, cardKinds: matches.length }
}

function getNextRarityFromMeta(rarity) {
 const order = ["C", "U", "R", "SR", "HR", "UR", "S", "SSR"]
 const idx = order.indexOf(String(rarity || "").toUpperCase())
 if (idx < 0 || idx >= order.length - 1) return null
 return order[idx + 1]
 }

function getRarityEmoji(rarity) {
 const token = String(rarity || "").toUpperCase()
 const map = {
  C: "⚪",
  U: "🟢",
  R: "🔵",
  SR: "🟣",
  HR: "🔴",
  UR: "🟠",
  S: "✨",
  SSR: "🌟"
 }
 return map[token] || "🔹"
}

 function getFragmentProgressForCard(cardId) {
  const numbers = new Set()
  let total = 0
  for (const frag of state.groupedFragments || []) {
   if (String(frag.cardId) !== String(cardId)) continue
   numbers.add(Number(frag.fragmentNumber || 0))
   total += Number(frag.qty || 0)
  }
  const found = [...numbers].sort((a, b) => a - b).filter((x) => x >= 1 && x <= 5)
  const missing = [1, 2, 3, 4, 5].filter((x) => !numbers.has(x))
  return { found, missing, unique: found.length, total }
 }

 function getSetProgressPct(setId) {
  const progress = Array.isArray(state.profile?.setProgress) ? state.profile.setProgress : []
  const row = progress.find((item) => String(item.id) === String(setId))
  if (!row) return null
  const pct = Number(row.pct)
  return Number.isFinite(pct) ? Math.max(0, Math.min(100, Math.round(pct))) : null
 }

 function formatSetWithProgress(set) {
  const pct = getSetProgressPct(set.id)
  if (pct === null) return String(set.name || set.id)
  return `${String(set.name || set.id)} - ${pct}%`
 }

 function getSetName(setId) {
  const id = String(setId || "")
  const byRule = SET_UNLOCK_RULES.find((row) => String(row.id) === id)
  if (byRule?.name) return byRule.name
  const byProfile = (state.profile?.setProgress || []).find((row) => String(row.id) === id)
  return String(byProfile?.name || id || "Set")
 }

function getNextSetUnlockInfo(unlockedSetIds = []) {
  const unlocked = new Set((unlockedSetIds || []).map((id) => String(id)))
  const currentLevel = Number(state.profile?.level || state.me?.level || 1)

  for (const rule of SET_UNLOCK_RULES) {
   if (unlocked.has(String(rule.id))) continue
   const prevSetPct = rule.prevSet ? Number(getSetProgressPct(rule.prevSet) || 0) : 0
   return {
    ...rule,
    currentLevel,
    prevSetPct,
    missingLevels: Math.max(0, Number(rule.levelRequired || 1) - currentLevel),
    missingPct: Math.max(0, SET_UNLOCK_THRESHOLD_PCT - prevSetPct),
    prevSetName: rule.prevSet ? getSetName(rule.prevSet) : null
   }
  }

  return null
 }

 function getSetPityState(setId) {
  const pityRows = Array.isArray(state.profile?.pity) ? state.profile.pity : []
  const row = pityRows.find((item) => String(item.setId) === String(setId)) || null
  const ur = Math.max(0, Number(row?.UR || 0))
  const s = Math.max(0, Number(row?.S || 0))
  const ssr = Math.max(0, Number(row?.SSR || 0))
  return {
   UR: ur,
   S: s,
   SSR: ssr,
   toGuaranteed: {
    UR: Math.max(0, 10 - ur),
    S: Math.max(0, 30 - s),
    SSR: Math.max(0, 50 - ssr)
   }
  }
 }

 function setupPacksPanel(meta) {
  const buyQtyInput = document.getElementById("buyPackQty")
  const openQtyInput = document.getElementById("openPackQty")
  const totalBox = document.getElementById("packTotalCost")
  const buyStockBox = document.getElementById("packStockAfterBuy")
  const stockBox = document.getElementById("packStockNow")
  const setInput = document.getElementById("actionSetInput")
  const openHint = document.getElementById("openHint")
  const openQtyPreview = document.getElementById("packOpenQtyPreview")
  const pityBox = document.getElementById("packSetPityBox")
  const setCards = [...document.querySelectorAll(".pack-set-card[data-set-id]")]
  const price = Number(meta.packPrice || 0)
  const stock = Number(meta.packStock || 0)

  function syncActiveSetCard() {
   const selectedId = String(setInput?.value || "")
   setCards.forEach((card) => {
    card.classList.toggle("active", String(card.dataset.setId || "") === selectedId)
   })
  }

  function refresh() {
   const buyQty = parseSafeQty(buyQtyInput?.value, 1, 50, 1)
   const openQty = parseSafeQty(openQtyInput?.value, 1, 25, 1)
   if (buyQtyInput) buyQtyInput.value = String(buyQty)
   if (openQtyInput) openQtyInput.value = String(openQty)
   if (totalBox) totalBox.textContent = `💰 ${fmt(price * buyQty)}`
   if (buyStockBox) buyStockBox.textContent = `${fmt(stock + buyQty)} packs après achat`
   if (stockBox) {
    const left = Math.max(0, stock - openQty)
    stockBox.textContent = `${fmt(left)} packs après ouverture`
   }
   if (openQtyPreview) openQtyPreview.textContent = `x${fmt(openQty)} pack(s) a ouvrir`
   if (openHint) {
    const selectedName = String(setInput?.selectedOptions?.[0]?.dataset?.setName || setInput?.selectedOptions?.[0]?.textContent || "Set")
    openHint.textContent = `Ouverture ciblee sur ${selectedName}`
   }
   if (pityBox) {
    const selectedSetId = String(setInput?.value || "")
    const selectedSetName = String(setInput?.selectedOptions?.[0]?.dataset?.setName || setInput?.selectedOptions?.[0]?.textContent || selectedSetId || "Set")
    const pity = getSetPityState(selectedSetId)
    const urPct = Math.max(0, Math.min(100, Math.round((pity.UR / 10) * 100)))
    const sPct = Math.max(0, Math.min(100, Math.round((pity.S / 30) * 100)))
    const ssrPct = Math.max(0, Math.min(100, Math.round((pity.SSR / 50) * 100)))
    pityBox.innerHTML = `
     <h3>Pity du set</h3>
     <p class="mode-muted">${escapeHtml(selectedSetName)}</p>
     <div class="pack-pity-grid pack-pity-grid-bars">
      <div class="pack-pity-row">

 if (!setOptions.includes(String(state.fusionUi.setId || ""))) {

 if (!rarityOptions.includes(String(state.fusionUi.fromRarity || ""))) {

 }
 state.fusionUi.quantity = parseSafeQty(state.fusionUi.quantity || 1, 1, FUSION_MAX_CYCLES, 1)

 function renderHistory() {
  if (!Array.isArray(state.fusionHistory) || !state.fusionHistory.length) {

   btn.disabled = !btnRow

   const fromEmoji = getRarityEmoji(fromRarity)
   const nextEmoji = next && next !== "-" ? getRarityEmoji(next) : ""

  runBtn.textContent = requested > 0 ? `Valider x${fmt(requested)}` : "Valider"

  renderFusionForgeIdle(state.fusionUi.setId, fromRarity)
  renderHistory()
 }

 setInput.addEventListener("change", () => {

 qtyInput.addEventListener("input", () => {
  refresh()

 stepButtons.forEach((btn) => {

function getFusionAnimationFragments(setId, rarity, needed = 5) {
 const slots = []
 const safeNeeded = Math.max(1, Number(needed || 5))
 const cards = getCardsForSetAndRarity(setId, rarity)

 for (const card of cards) {
  const qty = Number(card.qty || 0)
  const duplicates = Math.max(0, qty - 1)
  for (let i = 0; i < duplicates; i++) {
   slots.push({
    cardName: String(card.cardName || "Fragment"),
    imageUrl: card.imageUrl || null,
    rarity: String(card.rarity || rarity || "C")
   })
   if (slots.length >= safeNeeded) break
  }
  if (slots.length >= safeNeeded) break
 }

 if (slots.length < safeNeeded) {
  for (const card of cards) {
   const qty = Math.max(1, Number(card.qty || 0))
   for (let i = 0; i < qty; i++) {
    slots.push({
     cardName: String(card.cardName || "Fragment"),
     imageUrl: card.imageUrl || null,
     rarity: String(card.rarity || rarity || "C")
    })
    if (slots.length >= safeNeeded) break
   }
   if (slots.length >= safeNeeded) break
  }
 }

 while (slots.length < safeNeeded) {
  slots.push({
   cardName: `${String(rarity || "C")} fragment`,
   imageUrl: null,
   rarity: String(rarity || "C")
  })
 }

 return slots.slice(0, safeNeeded)
}

function buildFusionForgeOrbitMarkup(fragments = [], fallbackRarity = "C") {
 const slots = Array.isArray(fragments) ? fragments.slice(0, 5) : []
 while (slots.length < 5) {

 }
 return slots.map((fragment, index) => `
  <div class="fusion-forge-orb orb-${index + 1}" style="--orb-index:${index};">
   <div class="fusion-forge-orb-core">
    ${fragment?.imageUrl
     ? `<img src="${escapeHtml(fragment.imageUrl)}" alt="${escapeHtml(fragment.cardName || "Fragment")}">`
     : `<span>${escapeHtml(String(fragment?.label || String(fragment?.rarity || fallbackRarity).charAt(0)))}</span>`}
   </div>
  </div>
 `).join("")
}

function playFusionForgeAnimation(payload = {}) {
 const stage = document.getElementById("fusionForgeStage")
 const orbit = document.getElementById("fusionForgeOrbit")
 const result = document.getElementById("fusionForgeResult")
 const resultImage = document.getElementById("fusionForgeResultImage")
 const resultName = document.getElementById("fusionForgeResultName")
 const status = document.getElementById("fusionForgeStatus")
 if (!stage || !orbit || !result || !resultName || !status) return Promise.resolve()

 if (Array.isArray(stage._fusionTimers)) {
  for (const timer of stage._fusionTimers) window.clearTimeout(timer)
 }
 stage._fusionTimers = []
 stage._fusionAbort = null

 const fromRarity = String(payload?.fromRarity || "C")
 const toRarity = String(payload?.toRarity || "")
 const reward = payload?.reward || {}
 const fragments = Array.isArray(payload?.fragments) ? payload.fragments.slice(0, 5) : []

 orbit.innerHTML = buildFusionForgeOrbitMarkup(fragments, fromRarity)

 const rewardName = `${String(reward?.rarity || toRarity || "").trim()} ${String(reward?.cardName || "Carte mystère").trim()}`.trim()
 if (resultImage) {
  if (reward?.imageUrl) {
   resultImage.src = String(reward.imageUrl)
   resultImage.alt = rewardName
   resultImage.style.display = ""
  } else {
   resultImage.removeAttribute("src")
   resultImage.alt = rewardName
   resultImage.style.display = "none"
  }
 }
 resultName.textContent = rewardName
 status.textContent = `Fusion ${fromRarity} → ${toRarity || "?"}`

 stage.classList.remove("animating", "phase-spin", "phase-converge", "phase-result", "phase-out")
 result.classList.remove("visible")
 stage.setAttribute("data-busy", "1")
 void stage.offsetWidth
 stage.classList.add("animating", "phase-spin")

 return new Promise((resolve) => {
  let done = false
  const finish = (skipped = false) => {
   if (done) return
   done = true
   if (Array.isArray(stage._fusionTimers)) {
    for (const timer of stage._fusionTimers) window.clearTimeout(timer)
   }
   stage.classList.remove("animating", "phase-spin", "phase-converge", "phase-result", "phase-out")
   stage.setAttribute("data-busy", "0")
   result.classList.remove("visible")
   status.textContent = skipped ? "Animation passée" : `Dernier résultat: ${rewardName}`
   stage._fusionTimers = []
   stage._fusionAbort = null
   resolve({ skipped })
  }

  const queue = (delay, callback) => {
   const timer = window.setTimeout(() => {
    if (done) return
    callback()
   }, delay)
   stage._fusionTimers.push(timer)
  }
  stage._fusionAbort = () => finish(true)

  queue(860, () => {
   stage.classList.add("phase-converge")
   status.textContent = "Les fragments convergent vers le noyau..."
  })
  queue(1980, () => {
   stage.classList.add("phase-result")
   result.classList.add("visible")
   status.textContent = "Transmutation réussie"
  })
  queue(4020, () => {
   stage.classList.add("phase-out")
  })
  queue(4460, () => {
   finish(false)
  })
 })
}

function getCraftAnimationFragments(cardId, needed = 5) {
 const safeNeeded = Math.max(1, Number(needed || 5))
 const byNumber = new Map()
 for (const frag of state.groupedFragments || []) {
  if (String(frag.cardId) !== String(cardId)) continue
  const number = Number(frag.fragmentNumber || 0)
  if (number < 1 || number > 5) continue
  if (!byNumber.has(number)) {
   byNumber.set(number, {
    cardName: String(frag.cardName || "Fragment"),
    imageUrl: frag.imageUrl || null,
    qty: Number(frag.qty || 0)
   })
  }
 }

 const slots = []
 for (let number = 1; number <= 5 && slots.length < safeNeeded; number++) {
  const row = byNumber.get(number)
  if (row && row.qty > 0) {
   slots.push({
    cardName: `${row.cardName} - Fragment ${number}/5`,
    imageUrl: row.imageUrl,
    rarity: "SSR",
    label: String(number)
   })
  } else {
   slots.push({
    cardName: `Fragment ${number}/5 manquant`,
    imageUrl: null,
    rarity: "SSR",
    label: String(number)
   })
  }
 }

 while (slots.length < safeNeeded) {
  slots.push({
   cardName: "Fragment",
   imageUrl: null,
   rarity: "SSR",
   label: String(slots.length + 1)
  })
 }

 return slots.slice(0, safeNeeded)
}

function getRarityToken(rarity) {
 return String(rarity || "C").toUpperCase().replace(/[^A-Z]/g, "") || "C"
}

 function getPackBackImageForRarity(rarity) {
  const token = getRarityToken(rarity)
  return PACK_BACK_IMAGE_BY_RARITY[token] || PACK_BACK_IMAGE_DEFAULT
 }

 function getPctClass(percent) {
  const pct = Number(percent || 0)
  if (pct >= 100) return "pct-100"
  if (pct >= 70) return "pct-70"
  if (pct >= 50) return "pct-50"
  return "pct-0"
 }

 function expandGroupedCards(cards = []) {
  const expanded = []
  for (const item of cards || []) {
   const qty = Math.max(1, Number(item?.qty || 1))
   for (let i = 0; i < qty; i++) {
    expanded.push({
     cardId: String(item?.cardId || ""),
     cardName: String(item?.cardName || "Carte"),
     rarity: String(item?.rarity || "C"),
     set: String(item?.set || ""),
     image: item?.image || null,
     shiny: Boolean(item?.shiny),
     isNew: Boolean(item?.isNew)
    })
   }
  }
  return expanded
 }

 function getRevealCards(payload) {
  const reveal = Array.isArray(payload?.revealCards) && payload.revealCards.length
   ? payload.revealCards.slice()
   : expandGroupedCards(payload?.cards || [])
  const maxCards = 24
  return {
   visible: reveal.slice(0, maxCards),
   hiddenCount: Math.max(0, reveal.length - maxCards)
  }
 }

    <div class="pack-stardust" aria-hidden="true">
     ${Array.from({ length: 16 }, (_, idx) => `<span class="pack-stardust-dot dot-${idx + 1}"></span>`).join("")}
    </div>
    <div class="pack-open-dialog" role="dialog" aria-modal="true" aria-label="Ouverture de pack">
     <button class="pack-open-close" type="button" data-pack-close aria-label="Fermer">×</button>
     <h3 id="packOpenTitle">Ouverture du Krosmoz</h3>
     <p id="packOpenMeta" class="pack-open-meta"></p>
     <div id="packOpenPackSelector" class="pack-open-pack-selector" style="display:none"></div>
     <div id="packOpenGrid" class="pack-open-grid"></div>
     <p id="packOpenFoot" class="pack-open-foot"></p>
     <div id="packOpenSummary" class="pack-open-summary"></div>
     <div class="pack-open-actions">
      <button class="btn btn-outline" type="button" id="packSkipBtn">Skip animation</button>
      <button class="btn btn-outline" type="button" id="packReplayBtn" style="display:none">Relancer</button>
      <button class="btn btn-gold" type="button" data-pack-close>Continuer</button>
     </div>
    </div>
   `
   document.body.appendChild(overlay)

   overlay.addEventListener("click", (event) => {
    if (event.target === overlay) closePackOpeningOverlay()
   })
   overlay.querySelectorAll("[data-pack-close]").forEach((btn) => {
    btn.addEventListener("click", () => closePackOpeningOverlay())
   })
  }

  if (!packRevealEscHandlerBound) {
   document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closePackOpeningOverlay()
   })
   packRevealEscHandlerBound = true
  }

 return overlay
}

function completePackOpeningReveal() {
 const overlay = document.getElementById("packOpenOverlay")
 if (!overlay || !overlay.classList.contains("open")) return
 for (const timer of packRevealTimers) window.clearTimeout(timer)
 packRevealTimers = []
 overlay.querySelectorAll(".pack-reveal-card").forEach((card) => {
  card.classList.remove("rare-focus", "rare-return", "rare-focus-ssr", "no-rare-flash")
  card.style.removeProperty("--rare-shift-x")
  card.style.removeProperty("--rare-shift-y")
  card.style.removeProperty("--rare-scale")
  card.classList.add("revealed")
 })
 overlay.querySelectorAll(".pack-reveal-tier").forEach((tier) => tier.classList.add("active"))
 overlay.classList.add("complete")
 const skipBtn = document.getElementById("packSkipBtn")
 const replayBtn = document.getElementById("packReplayBtn")
 if (skipBtn) {
  skipBtn.disabled = true
  skipBtn.style.display = "none"
 }
 if (replayBtn) {
  replayBtn.disabled = false
  replayBtn.style.display = ""
 }
}

function buildPackRevealGroups(payload, revealCards) {
 const groups = []
 const pulls = Array.isArray(payload?.pulls) ? payload.pulls : []
 let cursor = 0

 if (pulls.length) {
  pulls.forEach((pull, index) => {
   const expectedSize = pull?.luckyPack ? 6 : 5
   const cards = revealCards.slice(cursor, cursor + expectedSize)
   cursor += expectedSize
   if (!cards.length) return
   groups.push({
    index: index + 1,
    lucky: Boolean(pull?.luckyPack),
    cards
   })
  })
 }

 while (cursor < revealCards.length) {
  const nextCards = revealCards.slice(cursor, cursor + 5)
  if (!nextCards.length) break
  groups.push({
   index: groups.length + 1,
   lucky: nextCards.length === 6,
   cards: nextCards
  })
  cursor += 5
 }

 if (!groups.length) {
  groups.push({
   index: 1,
   lucky: revealCards.length === 6,
   cards: revealCards.slice()
  })
 }

 return groups
}

function showPackOpeningAnimation(payload) {
  const overlay = ensurePackOpeningOverlay()
  if (typeof packRevealResolve === "function") {
   const previous = packRevealResolve
   packRevealResolve = null
   previous()
  }

  const title = document.getElementById("packOpenTitle")
  const meta = document.getElementById("packOpenMeta")
  const selectorBox = document.getElementById("packOpenPackSelector")
  const grid = document.getElementById("packOpenGrid")
  const foot = document.getElementById("packOpenFoot")
  const summary = document.getElementById("packOpenSummary")
 const allCards = Array.isArray(payload?.cards) ? payload.cards : []
 const revealCards = Array.isArray(payload?.revealCards) && payload.revealCards.length
  ? payload.revealCards.slice()
  : expandGroupedCards(payload?.cards || [])
 const qty = Number(payload?.quantity || 1)
 const kamasGain = Number(payload?.totals?.kamasGain || 0)
 const fragmentsGain = Number(payload?.totals?.fragments || 0)
 const skipBtn = document.getElementById("packSkipBtn")
 const replayBtn = document.getElementById("packReplayBtn")
 for (const timer of packRevealTimers) window.clearTimeout(timer)
 packRevealTimers = []

  title.textContent = "Ouverture du Krosmoz"
  meta.textContent = `x${fmt(qty)} pack(s) | +💰 ${fmt(kamasGain)} | ${fmt(fragmentsGain)} fragment(s)`
  const revealGroups = buildPackRevealGroups(payload, revealCards)
  const hasMultiGroups = qty > 1 && revealGroups.length > 1
  const firstGroupCards = Array.isArray(revealGroups[0]?.cards) ? revealGroups[0].cards : []

  function renderCardMarkup(card) {
   const rarity = getRarityToken(card?.rarity)
   const backImage = getPackBackImageForRarity(rarity)
   const newBadge = Boolean(card?.isNew) ? '<span class="pack-new-badge">✨ NEW</span>' : ""
   return `
    <article class="pack-reveal-card rarity-${rarity.toLowerCase()}">
     <div class="pack-reveal-inner">
      <div class="pack-reveal-core">
       <div class="pack-reveal-face pack-reveal-back">
        <img src="${backImage}" alt="Dos de carte Krosmoz ${escapeHtml(rarity)}">
       </div>
       <div class="pack-reveal-face pack-reveal-front">
        <div class="pack-reveal-front-image">
        ${card?.image ? `<img src="${escapeHtml(card.image)}" alt="${escapeHtml(card.cardName)}">` : "<span>?</span>"}
        </div>
        <div class="pack-reveal-front-meta">
         <strong>${escapeHtml(card?.rarity || "C")} ${escapeHtml(card?.cardName || "Carte")}</strong>
         <small>x1 ${newBadge}</small>
        </div>
       </div>
      </div>
     </div>
    </article>
   `
  }

  function renderSingleGroup(cardsToRender) {
   const cards = Array.isArray(cardsToRender) ? cardsToRender : []
   grid.classList.remove("pack-open-grid-stack")
   grid.classList.toggle("pack-open-grid-six", cards.length === 6)
   overlay.classList.toggle("single-pack-six", qty === 1 && cards.length === 6)
   grid.innerHTML = cards.map((card) => renderCardMarkup(card)).join("")
  }

  function renderMultiStack() {
   grid.classList.remove("pack-open-grid-six")
   grid.classList.add("pack-open-grid-stack")
   overlay.classList.remove("single-pack-six")
   grid.innerHTML = revealGroups.map((group) => `
    <section class="pack-reveal-tier" data-tier-index="${Math.max(0, Number(group.index || 1) - 1)}">
     <header class="pack-reveal-tier-head">Pack ${fmt(group.index)}${group.lucky ? " • Lucky" : ""} • ${fmt((group.cards || []).length)} cartes</header>
     <div class="pack-reveal-tier-cards ${(group.cards || []).length === 6 ? "pack-reveal-tier-cards-six" : ""}">
      ${(group.cards || []).map((card) => renderCardMarkup(card)).join("")}
     </div>
    </section>
   `).join("")
  }

  function getRevealRarity(cardEl) {
   if (cardEl?.classList?.contains("rarity-ssr")) return "SSR"
   if (cardEl?.classList?.contains("rarity-s")) return "S"
   return "NORMAL"
  }

  function getRevealProfile(cardEl, mode = "single") {
   const rarity = getRevealRarity(cardEl)
   const baseGap = mode === "multi" ? 95 : 780
   const flipDuration = 1250
   if (rarity === "SSR") {
    const focusIn = 1250
    const rectoHold = 2000
    const focusOut = 320
    const nextGap = focusIn + flipDuration + rectoHold + focusOut + (mode === "multi" ? 160 : 220)
    return {
     rarity,
     isRare: true,
     focusIn,
     rectoHold,
     focusOut,
     flipDuration,
     scale: window.innerWidth < 720 ? 1.85 : 2,
     nextGap
    }
   }
   if (rarity === "S") {
    const focusIn = 190
    const rectoHold = 900
    const focusOut = 260
    const nextGap = focusIn + flipDuration + rectoHold + focusOut + (mode === "multi" ? 160 : 220)
    return {
     rarity,
     isRare: true,
     focusIn,
     rectoHold,
     focusOut,
     flipDuration,
     scale: window.innerWidth < 720 ? 1.62 : 1.82,
     nextGap
    }
   }
   return {
    rarity,
    isRare: false,
    focusIn: 0,
    rectoHold: 0,
    focusOut: 0,
    flipDuration: 0,
    scale: 1,
    nextGap: baseGap
   }
  }

  function setRareFocusPosition(cardEl, profile) {
   if (!cardEl) return
   const dialog = overlay.querySelector(".pack-open-dialog")
   if (!dialog) return
   const cardRect = cardEl.getBoundingClientRect()
   const dialogRect = dialog.getBoundingClientRect()
   if (!cardRect.width || !cardRect.height || !dialogRect.width || !dialogRect.height) return
   const cardCenterX = cardRect.left + (cardRect.width / 2)
   const cardCenterY = cardRect.top + (cardRect.height / 2)
   const targetCenterX = dialogRect.left + (dialogRect.width / 2)
   const targetCenterY = dialogRect.top + (dialogRect.height * 0.5)
   const shiftX = targetCenterX - cardCenterX
   const shiftY = targetCenterY - cardCenterY
   cardEl.style.setProperty("--rare-shift-x", `${Math.round(shiftX)}px`)
   cardEl.style.setProperty("--rare-shift-y", `${Math.round(shiftY)}px`)
   cardEl.style.setProperty("--rare-scale", String(profile?.scale || 1.5))
  }

  function playRevealCardAnimation(cardEl, mode = "single") {
   if (!cardEl) return
   const profile = getRevealProfile(cardEl, mode)
   if (!profile.isRare) {
    cardEl.classList.add("revealed")
    return
   }
   setRareFocusPosition(cardEl, profile)
   cardEl.classList.remove("rare-return", "rare-focus-ssr")
   cardEl.classList.add("no-rare-flash")
   if (profile.rarity === "SSR") cardEl.classList.add("rare-focus-ssr")
   cardEl.classList.add("rare-focus")
   const focusIn = profile.focusIn
   const rectoHold = profile.rectoHold
   const flipDuration = profile.flipDuration
   const focusOut = profile.focusOut
   const flipTimer = window.setTimeout(() => {
    cardEl.classList.add("revealed")
   }, focusIn)
   const settleAt = focusIn + flipDuration + rectoHold
   const settleTimer = window.setTimeout(() => {
    cardEl.classList.remove("rare-focus")
    cardEl.classList.add("rare-return")
   }, settleAt)
   const clearTimer = window.setTimeout(() => {
    cardEl.classList.remove("rare-return", "rare-focus-ssr")
    cardEl.style.removeProperty("--rare-shift-x")
    cardEl.style.removeProperty("--rare-shift-y")
    cardEl.style.removeProperty("--rare-scale")
   }, settleAt + focusOut)
   packRevealTimers.push(flipTimer, settleTimer, clearTimer)
  }

  function setFootText() {
   if (hasMultiGroups) {
    foot.textContent = "Ouverture progressive en etages (pack par pack). Fais defiler la fenetre pour tout voir."
    return
   }
   foot.textContent = "Toutes les cartes tirées sont listées dans le recap ci-dessous."
  }

  function showCompleteState() {
   overlay.classList.add("complete")
   if (skipBtn) {
    skipBtn.disabled = true
    skipBtn.style.display = "none"
   }
   if (replayBtn) {
    replayBtn.disabled = false
    replayBtn.style.display = ""
   }
  }

  function runRevealAnimation(animated) {
   for (const timer of packRevealTimers) window.clearTimeout(timer)
   packRevealTimers = []
   overlay.classList.remove("complete")
   if (hasMultiGroups) {
    renderMultiStack()
    grid.scrollTop = 0
    grid.scrollLeft = 0
   } else {
    renderSingleGroup(firstGroupCards)
   }
   setFootText()

   if (replayBtn) {
    replayBtn.disabled = true
    replayBtn.style.display = "none"
   }

   if (!animated) {
    grid.querySelectorAll(".pack-reveal-card").forEach((card) => card.classList.add("revealed"))
    grid.querySelectorAll(".pack-reveal-tier").forEach((tier) => tier.classList.add("active"))
    showCompleteState()
    return
   }

   if (skipBtn) {
    skipBtn.disabled = false
    skipBtn.style.display = ""
   }

  if (hasMultiGroups) {
   const tiers = [...grid.querySelectorAll(".pack-reveal-tier")]
   let revealCursor = 380
   tiers.forEach((tier, tierIndex) => {
    const tierCards = [...tier.querySelectorAll(".pack-reveal-card")]
    const tierStart = revealCursor
    const tierMarkTimer = window.setTimeout(() => {
     tier.classList.add("active")
    }, Math.max(0, tierStart - 110))
    packRevealTimers.push(tierMarkTimer)
    tierCards.forEach((cardEl) => {
     const revealAt = revealCursor
     const timer = window.setTimeout(() => {
      playRevealCardAnimation(cardEl, "multi")
     }, revealAt)
     packRevealTimers.push(timer)
     const profile = getRevealProfile(cardEl, "multi")
     revealCursor += profile.nextGap
     })
    revealCursor += tierIndex < tiers.length - 1 ? 150 : 0
    })
    const doneTimer = window.setTimeout(() => {
     showCompleteState()
   }, revealCursor + 420)
    packRevealTimers.push(doneTimer)
    return
   }

   const cardEls = [...grid.querySelectorAll(".pack-reveal-card")]
   let revealCursor = 1400
   cardEls.forEach((el) => {
    const revealAt = revealCursor
    const timer = window.setTimeout(() => {
     playRevealCardAnimation(el, "single")
    }, revealAt)
    packRevealTimers.push(timer)
    const profile = getRevealProfile(el, "single")
    revealCursor += profile.nextGap
   })
   const doneTimer = window.setTimeout(() => {
    showCompleteState()
   }, revealCursor + 460)
   packRevealTimers.push(doneTimer)
  }

  if (selectorBox) {
   selectorBox.style.display = "none"
   selectorBox.innerHTML = ""
  }

  const pityCounters = payload?.pity?.counters || {}
  const pityToGuaranteed = payload?.pity?.toGuaranteed || {}
  const summaryItems = allCards.map((card) => {
   const rarity = String(card?.rarity || "C")
   const qtyLabel = Number(card?.qty || 0)
   const newTag = Boolean(card?.isNew) ? '<span class="pack-summary-new">✨ NEW</span>' : ""
   return `
    <li class="pack-summary-row rarity-${getRarityToken(rarity).toLowerCase()}">
     <span><strong>${escapeHtml(rarity)} ${escapeHtml(card?.cardName || "Carte")}</strong> ${newTag}</span>
     <small>x${fmt(qtyLabel)}</small>
    </li>
   `
  }).join("")

  const totalNew = revealCards.filter((card) => Boolean(card?.isNew)).length

  const pityUr = Number(pityCounters.UR || 0)
  const pityS = Number(pityCounters.S || 0)
  const pitySsr = Number(pityCounters.SSR || 0)
  const urPct = Math.max(0, Math.min(100, Math.round((pityUr / 10) * 100)))
  const sPct = Math.max(0, Math.min(100, Math.round((pityS / 30) * 100)))
  const ssrPct = Math.max(0, Math.min(100, Math.round((pitySsr / 50) * 100)))

  summary.innerHTML = `
   <div class="pack-summary-block">
    <h4>Recap de l'ouverture</h4>
    <p class="pack-summary-meta">${fmt(revealCards.length)} carte(s) tiree(s) • ${fmt(totalNew)} nouvelle(s)</p>
    <ul class="pack-summary-list">
     ${summaryItems || '<li class="pack-summary-row"><span>Aucune carte</span><small>x0</small></li>'}
    </ul>
   </div>
   <div class="pack-summary-block">
    <h4>Pity (${escapeHtml(String(payload?.setId || "set"))})</h4>
    <div class="pack-pity-grid pack-pity-grid-bars">
     <div class="pack-pity-row">
      <div class="pack-pity-head"><span>UR</span><strong>${fmt(pityUr)}/10</strong></div>
      <div class="set-bar"><div class="set-bar-fill ${getPctClass(urPct)}" style="width:${urPct}%"></div></div>
      <small>Garantie dans ${fmt(Number(pityToGuaranteed.UR || 0))} pack(s)</small>
     </div>
     <div class="pack-pity-row">
      <div class="pack-pity-head"><span>S</span><strong>${fmt(pityS)}/30</strong></div>
      <div class="set-bar"><div class="set-bar-fill ${getPctClass(sPct)}" style="width:${sPct}%"></div></div>
      <small>Garantie dans ${fmt(Number(pityToGuaranteed.S || 0))} pack(s)</small>
     </div>
     <div class="pack-pity-row">
      <div class="pack-pity-head"><span>SSR</span><strong>${fmt(pitySsr)}/50</strong></div>
      <div class="set-bar"><div class="set-bar-fill ${getPctClass(ssrPct)}" style="width:${ssrPct}%"></div></div>
      <small>Garantie dans ${fmt(Number(pityToGuaranteed.SSR || 0))} pack(s)</small>
     </div>
    </div>
   </div>
  `

  overlay.classList.remove("complete")
  overlay.classList.toggle("multi-open", hasMultiGroups)
  overlay.setAttribute("aria-hidden", "false")
  document.body.classList.add("pack-opening-lock")
  if (skipBtn) {
   skipBtn.disabled = false
   skipBtn.style.display = ""
   skipBtn.onclick = () => completePackOpeningReveal()
  }
  if (replayBtn) {
   replayBtn.disabled = true
   replayBtn.style.display = "none"
   replayBtn.onclick = () => {
    replayBtn.disabled = true
    closePackOpeningOverlay()
    window.setTimeout(() => {
     handleOpenPacksAction().catch(() => {})
    }, 180)
   }
  }
  window.requestAnimationFrame(() => {
   overlay.classList.add("open")
  })

  runRevealAnimation(true)

  return new Promise((resolve) => {
   packRevealResolve = resolve
  })
 }

function questProgressPercent(quest) {
 const goal = Math.max(1, Number(quest?.goal || 1))
 const current = Math.max(0, Number(quest?.current || 0))
 return Math.max(0, Math.min(100, Math.round((current / goal) * 100)))
}

function formatQuestRewards(reward, scope = "player") {
 const parts = []
 if (scope === "guild") {
  if (Number(reward?.guildXp || 0) > 0) parts.push(`⭐ ${fmt(reward.guildXp)} XP guilde`)
 } else {
  if (Number(reward?.kamas || 0) > 0) parts.push(`💰 ${fmt(reward.kamas)}`)
  if (Number(reward?.xp || 0) > 0) parts.push(`⭐ ${fmt(reward.xp)} XP`)
  if (Number(reward?.packs || 0) > 0) parts.push(`📦 ${fmt(reward.packs)}`)
}
return parts.join(" • ") || "Récompense"
}

function getQuestGroupFromState(questsState, scope = "player", type = "daily") {
 const safeType = String(type || "").toLowerCase() === "weekly" ? "weekly" : "daily"
 if (!questsState) return null
 if (String(scope || "").toLowerCase() === "guild") return questsState?.guild?.[safeType] || null
 return questsState?.player?.[safeType] || null
}

function resolveClaimQuestName(questsState, { scope = "player", type = "daily", questId = "" } = {}) {
 const group = getQuestGroupFromState(questsState, scope, type)
 const quests = Array.isArray(group?.quests) ? group.quests : []
 const id = String(questId || "").trim()
 if (id) {
  const exact = quests.find((q) => String(q?.id || "") === id)
  if (exact?.name) return String(exact.name)
 }
 const firstClaimable = quests.find((q) => Boolean(q?.claimable) && !Boolean(q?.claimed))
 if (firstClaimable?.name) return String(firstClaimable.name)
 return ""
}

function resolveClaimQuestDescription(questsState, { scope = "player", type = "daily", questId = "" } = {}) {
 const group = getQuestGroupFromState(questsState, scope, type)
 const quests = Array.isArray(group?.quests) ? group.quests : []
 const id = String(questId || "").trim()
 if (id) {
  const exact = quests.find((q) => String(q?.id || "") === id)
  if (exact?.desc) return String(exact.desc)
 }
 const firstClaimable = quests.find((q) => Boolean(q?.claimable) && !Boolean(q?.claimed))
 if (firstClaimable?.desc) return String(firstClaimable.desc)
 return ""
}

function formatQuestClaimToastReward(scope = "player", claimResult = null) {
 const parts = []
 if (String(scope || "").toLowerCase() === "guild") {
  const totalXP = Number(claimResult?.totalXP || 0)
  const bonusXP = Number(claimResult?.bonusXP || 0)
  if (totalXP > 0) parts.push(`⭐ +${fmt(totalXP)} XP guilde`)
  if (bonusXP > 0) parts.push(`✨ Bonus +${fmt(bonusXP)} XP guilde`)
  return parts.join(" • ")
 }

 const kamas = Number(claimResult?.totalKamas || 0)
 const xp = Number(claimResult?.totalXp || 0)
 const packs = Number(claimResult?.totalPacks || 0)
 const bpXp = Number(claimResult?.totalBpXp || 0)
 if (kamas > 0) parts.push(`💰 +${fmt(kamas)}`)
 if (xp > 0) parts.push(`⭐ +${fmt(xp)} XP`)
 if (packs > 0) parts.push(`📦 +${fmt(packs)}`)
 if (bpXp > 0) parts.push(`🎟️ +${fmt(bpXp)} XP BP`)
 return parts.join(" • ")
}

function showQuestClaimToast({ scope = "player", type = "daily", questId = "", beforeState = null, claimResult = null } = {}) {
 const notify = window.__kcQuestToastNotify
 if (typeof notify !== "function") return

 const guildScope = String(scope || "").toLowerCase() === "guild"
 const claimedCount = guildScope
  ? Number(claimResult?.claimed || 0)
  : Number(claimResult?.claimedCount || 0)
 const useSingleQuestName = Boolean(String(questId || "").trim()) || claimedCount === 1
 const questName = useSingleQuestName
  ? resolveClaimQuestName(beforeState, { scope, type, questId })
  : ""
 let questDescription = useSingleQuestName
  ? resolveClaimQuestDescription(beforeState, { scope, type, questId })
  : ""
 if (!questDescription) {
  questDescription = String(claimResult?.raw?.quest?.desc || "")
 }

 let title = guildScope ? "Quête de guilde terminée" : "Quête terminée"
 if (questName) {
  title = `${title} "${questName}"`
 } else if (claimedCount > 1) {
  title = `${title} (${fmt(claimedCount)})`
 }

 notify({
  title,
  subtitle: "",
  description: questDescription,
  rewardText: formatQuestClaimToastReward(scope, claimResult),
  variant: "complete",
  fromPct: 0,
  toPct: 100
 })
}

function renderQuestRows(quests = [], scope = "player", type = "daily", canClaim = true) {
 if (!Array.isArray(quests) || quests.length <= 0) {
  return '<p class="mode-muted">Aucune quête disponible.</p>'
 }

 const orderedQuests = quests
  .map((quest, index) => ({ quest, index }))
  .sort((a, b) => {
   const aDone = Boolean(a.quest?.done)
   const bDone = Boolean(b.quest?.done)
   if (aDone !== bDone) return aDone ? 1 : -1
   return a.index - b.index
  })
  .map((entry) => entry.quest)

 return orderedQuests.map((quest) => {
  const pct = questProgressPercent(quest)
  const goal = Math.max(1, Number(quest?.goal || 1))
  const current = Math.max(0, Math.min(goal, Number(quest?.current || 0)))
  const isClaimable = Boolean(quest?.claimable) && canClaim
  const rowClass = quest?.claimed ? "quest-row claimed" : (quest?.done ? "quest-row done" : "quest-row")
  let actionHtml = `<span class="mode-chip">${current}/${goal}</span>`
  if (quest?.claimed) {
    actionHtml = '<span class="mode-chip mode-chip-ok">Récupérée</span>'
  } else if (isClaimable) {
    actionHtml = `
      <button class="btn btn-outline quest-claim-btn" data-quest-claim-one data-scope="${escapeHtml(scope)}" data-type="${escapeHtml(type)}" data-quest-id="${escapeHtml(quest.id)}">
       Récupérer
      </button>
    `
  } else if (quest?.done && !canClaim) {
    const blockedLabel = scope === "guild" ? "Meneur / officier requis" : "Connexion requise"
    actionHtml = `<span class="mode-chip">${blockedLabel}</span>`
  }

  return `
   <article class="${rowClass}">
    <div class="quest-row-head">
     <strong>${escapeHtml(`${quest?.emoji || "🎯"} ${quest?.name || "Quête"}`)}</strong>
     ${actionHtml}
    </div>
    <p>${escapeHtml(quest?.desc || "")}</p>
    <div class="quest-progress-row">
     <div class="quest-progress-track">
      <span style="width:${pct}%"></span>
     </div>
     <small>${fmt(current)}/${fmt(goal)}</small>
    </div>
    <small class="quest-reward-text">${escapeHtml(formatQuestRewards(quest?.reward || {}, scope))}</small>
   </article>
  `
 }).join("")
}

 const sourceRow = getFusionRowByRarity(fromRarity)
 const sourceInfo = getDuplicateInfoForFusion(setId, fromRarity)
 const cost = Number(sourceRow?.cost || 0)
 const maxSingleFusions = cost > 0 ? Math.floor(sourceInfo.duplicates / cost) : 0
 const askedQty = parseSafeQty(qtyInput?.value || state.fusionUi.quantity || 1, 1, FUSION_MAX_CYCLES, 1)
 state.fusionUi.quantity = askedQty
 if (qtyInput) qtyInput.value = String(askedQty)
 const requestedCycles = Math.max(0, Math.min(askedQty, maxSingleFusions))
 if (!setId || !fromRarity || !sourceRow || requestedCycles <= 0) {
  showActionResult("fusionResultBox", "<p>Impossible de lancer la fusion avec les paramètres actuels.</p>", true)
  return
 }

 const runBtn = document.getElementById("fusionRunBtn")
 const baseLabel = String(runBtn?.textContent || "Valider")
 let refreshed = false

 try {
  if (runBtn) {
   runBtn.disabled = true
   runBtn.textContent = "Forge en cours..."
  }
  showActionResult("fusionResultBox", "<p>Canalisation des fragments...</p>")

  const logs = []
  let interruption = ""
  for (let cycle = 0; cycle < requestedCycles; cycle++) {
   const res = await postJson("/api/game/fuse", { setId, rarity: fromRarity })
   if (!res.ok) {
    if (!logs.length) {
     showActionResult("fusionResultBox", `<p>${escapeHtml(res.data?.error || "Fusion impossible.")}</p>`, true)
     return
    }
    interruption = String(res.data?.error || "Fusion interrompue.")
    break
   }

   const data = res.data || {}
   logs.push({
    setId,
    setName: getSetName(setId),
    from: String(data.fromRarity || fromRarity),
    to: String(data.toRarity || getNextRarityFromMeta(fromRarity) || ""),
    rewardName: String(data?.reward?.cardName || "Carte"),
    rewardRarity: String(data?.reward?.rarity || data.toRarity || ""),
    rewardImage: data?.reward?.imageUrl || null,
    reward: data?.reward || null,
    timestamp: Date.now()
   })
  }

  if (!logs.length) {
   showActionResult("fusionResultBox", "<p>Aucune fusion effectuée.</p>", true)
   return
  }

  if (stage) stage.setAttribute("data-skip", "0")
  const multiRun = logs.length > 1
  setFusionSkipButton(multiRun)
  let playedAnimations = 0
  let skippedAnimations = false
  for (let index = 0; index < logs.length; index++) {
   if (String(stage?.getAttribute("data-skip") || "0") === "1") {
    skippedAnimations = true
    break
   }
   const entry = logs[index]
   if (multiRun) {
    showActionResult("fusionResultBox", `<p>Animation de fusion ${fmt(index + 1)}/${fmt(logs.length)}...</p>`)
   }
   const animResult = await playFusionForgeAnimation({
    fromRarity: entry.from,
    toRarity: entry.to,
    reward: {
     cardName: entry.rewardName,
     rarity: entry.rewardRarity,
     imageUrl: entry.rewardImage
    },
    fragments: getFusionAnimationFragments(setId, entry.from, 5)
   })
   playedAnimations = index + 1
   if (animResult?.skipped || String(stage?.getAttribute("data-skip") || "0") === "1") {
    skippedAnimations = true
    break
   }
  }
  setFusionSkipButton(false)
  if (stage) {
   stage.setAttribute("data-skip", "0")
   stage._fusionAbort = null
  }

  state.fusionHistory = logs.slice().reverse().map((entry) => ({
   from: entry.from,
   to: entry.to,
   rewardName: `${entry.rewardRarity} ${entry.rewardName}`.trim(),
   setName: entry.setName,
   timestamp: entry.timestamp
  })).concat(state.fusionHistory || []).slice(0, 24)

  const last = logs[logs.length - 1]
  const animationNote = skippedAnimations
   ? `<p class="mode-muted">Animation passée après ${fmt(playedAnimations)}/${fmt(logs.length)} fusion(s).</p>`
   : ""
  const summary = `
   <p><strong>Forge terminée:</strong> ${fmt(logs.length)} fusion(s) validée(s) sur ${fmt(requestedCycles)} demandée(s)</p>
   <p>Dernier résultat: ${escapeHtml((last.rewardRarity ? `${last.rewardRarity} ` : "") + (last.rewardName || "Carte"))}</p>
   ${animationNote}
   ${interruption ? `<p class="mode-muted">Arrêt partiel: ${escapeHtml(interruption)}</p>` : ""}
  `
  await reloadGameplayDataAndRender()
  refreshed = true
  showActionResult("fusionResultBox", summary)
 } finally {
  if (!refreshed && runBtn) {
   runBtn.disabled = false
   runBtn.textContent = baseLabel
  }
  setFusionSkipButton(false)
  if (stage) {
   stage.setAttribute("data-skip", "0")
   stage._fusionAbort = null
  }
 }
}

async function handleCraftAction() {
 const stage = document.getElementById("craftForgeStage")
 if (String(stage?.getAttribute("data-busy") || "0") === "1") return

 const cardId = String(state.craftUi.cardId || document.getElementById("craftCardInput")?.value || "").trim()
 if (!cardId) {
  showActionResult("craftResultBox", "<p>Sélectionne une carte avant de lancer le craft.</p>", true)
  return
 }

 const selected = getCraftCandidates().find((item) => String(item.cardId) === cardId) || null
 const progress = getFragmentProgressForCard(cardId)
 if (!selected || progress.unique < 5) {
  showActionResult("craftResultBox", "<p>Fragments insuffisants: il faut 5 fragments uniques (1 à 5).</p>", true)
  return
 }

 const runBtn = document.getElementById("craftBtn")
 const baseLabel = String(runBtn?.textContent || "Crafter SSR")
 let refreshed = false

 try {
  if (runBtn) {
   runBtn.disabled = true
   runBtn.textContent = "Forge en cours..."
  }
  showActionResult("craftResultBox", "<p>Assemblage des fragments...</p>")

  const res = await postJson("/api/game/craft", { cardId })
  if (!res.ok) {
   showActionResult("craftResultBox", `<p>${escapeHtml(res.data?.error || "Craft impossible.")}</p>`, true)
   return
  }

  const crafted = res.data?.card || {}
  await playCraftForgeAnimation({
   reward: {
    cardName: String(crafted.cardName || selected.cardName || "Carte"),
    rarity: String(crafted.rarity || "SSR"),
    imageUrl: crafted.imageUrl || selected.imageUrl || null
   },
   fragments: getCraftAnimationFragments(cardId, 5)
  })

  state.craftHistory = [{
   cardName: String(crafted.cardName || selected.cardName || "Carte"),
   setName: getSetName(crafted.set || selected.set),
   rarity: String(crafted.rarity || "SSR"),
   timestamp: Date.now()
  }].concat(state.craftHistory || []).slice(0, 24)

  const titleLine = res.data?.titleUnlocked
   ? `<p class="mode-muted">Titre débloqué: ${escapeHtml(res.data.titleUnlocked)}</p>`
   : ""
  const summary = `
   <p><strong>Craft SSR validé:</strong> ${escapeHtml(crafted.cardName || selected.cardName || "Carte")}</p>
   <p>Set: ${escapeHtml(getSetName(crafted.set || selected.set))}</p>
   ${titleLine}
  `

  await reloadGameplayDataAndRender()
  refreshed = true
  showActionResult("craftResultBox", summary)
 } finally {
  if (!refreshed && runBtn) {
   runBtn.disabled = false
   runBtn.textContent = baseLabel
  }
 }
}

 function syncPanelVisibility() {
  const controls = document.getElementById("playControls")
  const subtabs = document.getElementById("inventorySubtabs")
  const rarityFilter = document.getElementById("rarityFilter")
  const grid = document.getElementById("playGrid")
  const packsPanel = document.getElementById("playPacks")
  const fusionPanel = document.getElementById("playFusion")
  const craftPanel = document.getElementById("playCraft")
  const questsPanel = document.getElementById("playQuests")
  const title = document.getElementById("playTitle")
  const subtitle = document.getElementById("playSubtitle")
  const inventoryActionBox = document.getElementById("inventoryActionBox")

  controls.style.display = "grid"
  subtabs.style.display = state.mode === "inventory" ? "flex" : "none"
  rarityFilter.style.display = (state.mode === "inventory" && state.inventoryView === "fragments") ? "none" : ""
  if (subtitle) subtitle.style.display = (state.mode === "inventory" || state.mode === "quests") ? "block" : "none"
  if (inventoryActionBox) {
   if (state.mode !== "inventory") {
    inventoryActionBox.style.display = "none"
   } else if (!String(inventoryActionBox.innerHTML || "").trim()) {
    inventoryActionBox.style.display = "none"
   }
  }
  grid.style.display = "grid"
  packsPanel.style.display = "none"
  fusionPanel.style.display = "none"
  craftPanel.style.display = "none"
  questsPanel.style.display = "none"

  if (state.mode === "packs") {
   title.textContent = "PACKS"
   controls.style.display = "none"
   grid.style.display = "none"
   packsPanel.style.display = "block"
  } else if (state.mode === "fusion") {
   title.textContent = "FUSION"
   controls.style.display = "none"
   grid.style.display = "none"
   fusionPanel.style.display = "block"
  } else if (state.mode === "craft") {
   title.textContent = "CRAFT"
   controls.style.display = "none"
   grid.style.display = "none"
   craftPanel.style.display = "block"
  } else if (state.mode === "quests") {
   title.textContent = "Quêtes"
   if (subtitle) subtitle.textContent = "Progression quotidienne, hebdomadaire et objectifs de guilde."
   controls.style.display = "none"
   grid.style.display = "none"
   questsPanel.style.display = "block"
  } else {
   title.textContent = state.inventoryView === "fragments" ? "Fragments" : "Inventaire"
   if (subtitle) {
    subtitle.textContent = state.inventoryView === "fragments"
     ? "Consulte tes fragments et prépare tes crafts SSR."
     : "Consulte ton inventaire et fait le tri dans ton inventaire."
   }
  }
 }

 function renderCurrentMode() {
  syncPanelVisibility()
  if (state.mode === "packs") return renderPacks()
  if (state.mode === "fusion") return renderFusion()
  if (state.mode === "craft") return renderCraft()
  if (state.mode === "quests") return renderQuests().catch(() => {})
  renderInventoryGrid()
 }

 function bindEvents() {
  document.getElementById("navToggle").addEventListener("click", () => {
   document.getElementById("navLinks").classList.toggle("open")
  })

  document.addEventListener("click", (event) => {
   const link = event.target.closest("[data-play-mode]")
   if (!link) return
   event.preventDefault()
   setMode(link.dataset.playMode)
  })

  document.querySelectorAll(".play-subtab").forEach((btn) => {
   btn.addEventListener("click", () => setInventoryView(btn.dataset.view))
  })

  document.getElementById("searchInput").addEventListener("input", renderCurrentMode)
  document.getElementById("setFilter").addEventListener("change", renderCurrentMode)
  document.getElementById("rarityFilter").addEventListener("change", renderCurrentMode)

  document.getElementById("sortBtn").addEventListener("click", () => {
   state.sortDesc = !state.sortDesc
   document.getElementById("sortBtn").textContent = state.sortDesc ? "Tri Qté v" : "Tri Qté ^"
   renderCurrentMode()
  })

  document.getElementById("playPacks").addEventListener("click", (event) => {
   if (event.target && event.target.id === "buyPacksBtn") return handleBuyPacksAction().catch(() => {})
   if (event.target && event.target.id === "openPacksBtn") return handleOpenPacksAction().catch(() => {})
  })

 document.getElementById("playFusion").addEventListener("click", (event) => {
  const btn = event.target.closest("#fusionRunBtn")
  if (btn) return handleFusionAction().catch(() => {})
 })

 document.getElementById("playCraft").addEventListener("click", (event) => {
   const btn = event.target.closest("#craftBtn")
   if (btn) return handleCraftAction().catch(() => {})
  })

 document.getElementById("playQuests").addEventListener("click", (event) => {
  const claimOne = event.target.closest("[data-quest-claim-one]")
  if (claimOne) {
   return handleQuestClaim({
    scope: String(claimOne.dataset.scope || "player"),
    type: String(claimOne.dataset.type || "daily"),
    questId: String(claimOne.dataset.questId || "")
   }).catch(() => {})
  }

  const claimAll = event.target.closest("[data-quest-claim-all]")
  if (claimAll) {
   return handleQuestClaim({
    scope: String(claimAll.dataset.scope || "player"),
    type: String(claimAll.dataset.type || "daily")
   }).catch(() => {})
  }
 })
}

 async function bootstrap() {
  bindEvents()
  const initialMode = parseModeFromPath()
  setMode(initialMode, false)
  if (initialMode === "quests") {
   try {
    await loadData()
   } catch (_) {}
   renderCurrentMode()
   return
  }
  try {
   await loadData()
   renderCurrentMode()
  } catch (_) {
   window.location.href = "/"
  }
 }

 bootstrap()
 </script>
</body>
