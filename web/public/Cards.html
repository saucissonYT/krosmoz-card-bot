<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Recherche Cartes — Krosmoz Card</title>
 <meta name="theme-color" content="#c9a84c">
 <link rel="stylesheet" href="/css/style.css">
</head>
<body>
 <nav class="navbar scrolled">
  <div class="navbar-inner">
   <a href="/" class="navbar-brand">KROSMOZ CARD</a>
   <ul class="navbar-links" id="navLinks">
    <li><a href="/">Accueil</a></li>
    <li><a href="/leaderboard">Classement</a></li>
    <li><a href="https://discord.gg/W7UmsfCW" target="_blank" rel="noopener">Discord</a></li>
    <li><a href="/cards" class="active">Cartes</a></li>
    <li><a href="/market">Marché</a></li>
    <li><a href="/guild">Guildes</a></li>
   </ul>
   <div class="navbar-right">
    <a class="discord-mini" href="https://discord.gg/W7UmsfCW" target="_blank" rel="noopener" aria-label="Discord">
     <svg viewBox="0 0 127.14 96.36" aria-hidden="true"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36a77.7,77.7,0,0,0,6.89-11.27,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2.05,20.4,9.45,42.54,9.45,62.69,0,.87,.71,1.76,1.39,2.67,2.05a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.26A105.25,105.25,0,0,0,126.94,80.2h0C129.67,52.84,122.27,29.11,107.7,8.07ZM42.45,65.69c-6.27,0-11.41-5.74-11.41-12.82S36.07,40.05,42.45,40.05,53.8,45.8,53.8,52.87,48.82,65.69,42.45,65.69Zm42.24,0c-6.27,0-11.4-5.74-11.4-12.82S78.32,40.05,84.69,40.05,96,45.8,96,52.87,91.07,65.69,84.69,65.69Z"/></svg>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
   </div>
  </div>
 </nav>

 <div class="page">
  <div class="container">
   <section style="padding-top:40px">
    <h1 class="section-title fade-in">📚 Recherche de cartes</h1>
    <p class="section-subtitle fade-in stagger-1">Catalogue complet avec filtres et pagination</p>

    <div class="toolbar fade-in stagger-2">
     <input id="searchInput" class="input" placeholder="Nom de carte..." />
     <select id="raritySelect" class="input input-select">
      <option value="">Rareté (toutes)</option>
      <option>C</option><option>U</option><option>R</option><option>SR</option>
      <option>HR</option><option>UR</option><option>S</option><option>SSR</option>
     </select>
     <select id="setSelect" class="input input-select">
      <option value="">Set (tous)</option>
     </select>
     <select id="sortSelect" class="input input-select">
      <option value="id">Tri: ID</option>
      <option value="name">Tri: Nom</option>
      <option value="rarity">Tri: Rareté</option>
     </select>
     <button id="searchBtn" class="btn btn-outline">Rechercher</button>
    </div>

    <div id="resultMeta" class="result-meta"></div>
    <div id="cardsGrid" class="catalog-grid"></div>
    <div id="pagination" class="pagination"></div>
   </section>

   <footer class="footer">
    <p>🎴 <a href="/">Krosmoz Card</a> — krosmozcard.fr</p>
   </footer>
  </div>
 </div>

 <script>
 document.getElementById("navToggle").addEventListener("click", () => {
  document.getElementById("navLinks").classList.toggle("open")
 })

 const state = { page: 1, limit: 24 }

 async function loadSets() {
  try {
   const res = await fetch("/api/sets")
   const sets = await res.json()
   const select = document.getElementById("setSelect")
   for (const set of sets || []) {
    const opt = document.createElement("option")
    opt.value = set.id
    opt.textContent = set.name
    select.appendChild(opt)
   }
  } catch (_) {}
 }

 function queryString() {
  const q = new URLSearchParams()
  q.set("page", String(state.page))
  q.set("limit", String(state.limit))
  const search = document.getElementById("searchInput").value.trim()
  const rarity = document.getElementById("raritySelect").value
  const set = document.getElementById("setSelect").value
  const sort = document.getElementById("sortSelect").value
  if (search) q.set("q", search)
  if (rarity) q.set("rarity", rarity)
  if (set) q.set("set", set)
  if (sort) q.set("sort", sort)
  return q.toString()
 }

function cardRow(card) {
  const image = card.imageUrl
   ? `<div class="card-thumb-wrap"><img class="card-thumb" loading="lazy" src="${card.imageUrl}" alt="${escapeHtml(card.name)}" onerror="this.parentElement.style.display='none'"></div>`
   : ""
  return `
   <article class="catalog-card">
    ${image}
    <div class="catalog-card-head">
     <span class="chip chip-rarity">${card.rarity}</span>
     <span class="chip">${card.setName}</span>
    </div>
    <h3>${escapeHtml(card.name)}</h3>
    <p>ID: ${escapeHtml(String(card.id))}</p>
   </article>
  `
 }

 function escapeHtml(str) {
  const div = document.createElement("div")
  div.textContent = str
  return div.innerHTML
 }

 function renderPagination(page, pages) {
  const root = document.getElementById("pagination")
  if (pages <= 1) { root.innerHTML = ""; return }

  root.innerHTML = `
   <button class="btn btn-outline" ${page <= 1 ? "disabled" : ""} data-page="${page - 1}">← Précédent</button>
   <span class="pagination-meta">Page ${page} / ${pages}</span>
   <button class="btn btn-outline" ${page >= pages ? "disabled" : ""} data-page="${page + 1}">Suivant →</button>
  `

  root.querySelectorAll("button[data-page]").forEach((btn) => {
   btn.addEventListener("click", () => {
    state.page = Number(btn.dataset.page)
    loadCards()
   })
  })
 }

 async function loadCards() {
  const grid = document.getElementById("cardsGrid")
  const meta = document.getElementById("resultMeta")
  grid.innerHTML = `<div class="loading"><div class="spinner"></div><p>Chargement des cartes...</p></div>`

  try {
    const res = await fetch(`/api/cards?${queryString()}`)
    const data = await res.json()
    state.page = data.page

    meta.textContent = `${(data.total || 0).toLocaleString("fr-FR")} cartes trouvées`
    const items = data.items || []
    if (!items.length) {
     grid.innerHTML = `<div class="loading"><p>Aucune carte pour ces filtres.</p></div>`
     renderPagination(1, 1)
     return
    }

    grid.innerHTML = items.map(cardRow).join("")
    renderPagination(data.page, data.pages)
  } catch (e) {
    grid.innerHTML = `<div class="loading"><p style="color:var(--rarity-HR)">Erreur de chargement.</p></div>`
  }
 }

 document.getElementById("searchBtn").addEventListener("click", () => {
  state.page = 1
  loadCards()
 })
 document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { state.page = 1; loadCards() }
 })
 document.getElementById("raritySelect").addEventListener("change", () => { state.page = 1; loadCards() })
 document.getElementById("setSelect").addEventListener("change", () => { state.page = 1; loadCards() })
 document.getElementById("sortSelect").addEventListener("change", () => { state.page = 1; loadCards() })

 loadSets().then(loadCards)
 </script>
</body>
</html>
