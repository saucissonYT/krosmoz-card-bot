<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>KrosmoShop | Krosmoz Card</title>
 <meta name="theme-color" content="#10182f">
 <link rel="icon" type="image/png" href="/assets/ui/logo-carte.png">
 <link
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600&family=Jost:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
 >
 <link rel="stylesheet" href="/assets/css/main.css">
 <script src="/js/web-auth.js?v=20260511-nav-dropdowns" defer></script>
 <style>
  *,
  *::before,
  *::after {
   box-sizing: border-box;
  }

  html,
  body {
   width: 100%;
   min-height: 100%;
  }

  body.krosmoshop-page {
   --kshop-ink: #f3efe4;
   --kshop-panel: rgba(8, 13, 27, 0.82);
   --kshop-panel-deep: rgba(12, 16, 30, 0.9);
   --kshop-line: rgba(201, 168, 76, 0.28);
   --kshop-line-strong: rgba(232, 201, 122, 0.7);
   --kshop-gold: #e8c97a;
   --kshop-gold-bright: #ffe479;
   --kshop-box-bg: linear-gradient(180deg, rgba(12, 16, 30, 0.88), rgba(7, 9, 18, 0.92));
   --kshop-box-bg-deep: linear-gradient(180deg, rgba(8, 13, 27, 0.88), rgba(5, 7, 13, 0.92));
   --kshop-box-bg-active: linear-gradient(180deg, rgba(31, 29, 20, 0.98), rgba(10, 10, 14, 0.98));
   --kshop-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 14px 30px rgba(0, 0, 0, 0.24);
   position: relative;
   margin: 0;
   min-height: 100vh;
   color: #f7fbff;
   font-family: "Jost", sans-serif;
   background: #050918;
  }

  body.krosmoshop-page::before {
   content: "";
   position: fixed;
   inset: 0;
   z-index: 0;
   pointer-events: none;
   background: url("/assets/ui/background%20shop.png") center / cover no-repeat;
   opacity: 0.3;
  }

  body.krosmoshop-page::after {
   content: "";
   position: fixed;
   inset: 0;
   z-index: 0;
   pointer-events: none;
   background:
    linear-gradient(180deg, rgba(5, 9, 24, 0.28), rgba(5, 9, 24, 0.58)),
    radial-gradient(circle at 50% 16%, rgba(232, 201, 122, 0.1), transparent 34%);
  }

  body.krosmoshop-page > * {
   position: relative;
   z-index: 1;
  }

  .kshop-shell {
   width: min(1152px, calc(100vw - 32px));
   margin: 0 auto;
   padding: clamp(18px, 3vw, 34px) 0 54px;
  }

  .kshop-title {
   margin: 0;
   font-family: "Cinzel", serif;
   font-size: clamp(2.1rem, 5vw, 4.8rem);
   line-height: 0.98;
   letter-spacing: 0.04em;
   text-transform: uppercase;
   text-align: center;
   color: #ffe479;
   text-shadow: 0 10px 28px rgba(0, 0, 0, 0.48);
  }

  .kshop-subtitle {
   margin: 8px 0 16px;
   color: #f7fbff;
   font-size: clamp(0.95rem, 1.4vw, 1.12rem);
   font-weight: 800;
   text-align: center;
  }

  .kshop-summary {
   display: grid;
   grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(210px, 268px);
   gap: 18px;
   align-items: stretch;
   margin-bottom: 16px;
   padding: 24px;
   border: 1px solid var(--kshop-line);
   border-radius: 8px;
   background: var(--kshop-box-bg);
   box-shadow: var(--kshop-box-shadow);
   backdrop-filter: blur(4px);
  }

  .kshop-stat {
   min-width: 0;
  }

  .kshop-stat strong {
   display: block;
   color: #f8f1df;
   font-size: 1.08rem;
   font-weight: 900;
  }

  .kshop-stat span {
   display: block;
   margin-top: 5px;
   color: rgba(243, 239, 228, 0.72);
   font-size: 0.92rem;
   font-weight: 600;
  }

  .kshop-bulk-btn {
   width: 100%;
   min-height: 48px;
   align-self: center;
   border: 1px solid rgba(201, 168, 76, 0.36);
   border-radius: 8px;
   background: var(--kshop-box-bg-deep);
   color: var(--kshop-ink);
   font: inherit;
   font-weight: 900;
   cursor: pointer;
   transition: border-color 0.14s ease, background 0.14s ease, transform 0.14s ease;
  }

  .kshop-bulk-btn:hover:not(:disabled),
  .kshop-bulk-btn:focus-visible:not(:disabled) {
   outline: none;
   transform: translateY(-1px);
   border-color: var(--kshop-line-strong);
   background: var(--kshop-box-bg-active);
   color: #f6df92;
  }

  .kshop-bulk-btn:disabled {
   opacity: 0.54;
   cursor: not-allowed;
  }

  .kshop-grid {
   display: grid;
   grid-template-columns: repeat(5, minmax(0, 1fr));
   gap: 12px;
  }

  .kshop-card {
   position: relative;
   min-height: 252px;
   display: grid;
   grid-template-rows: auto auto auto 1fr auto;
   gap: 10px;
   padding: 10px;
   border: 1px solid rgba(201, 168, 76, 0.28);
   border-radius: 8px;
   background: var(--kshop-box-bg);
   box-shadow: var(--kshop-box-shadow);
   overflow: hidden;
   backdrop-filter: blur(2px);
  }

  .kshop-card::before {
   content: "";
   position: absolute;
   inset: 0;
   background: linear-gradient(160deg, rgba(255, 255, 255, 0.06), transparent 36%, rgba(201, 168, 76, 0.06));
   pointer-events: none;
  }

  .kshop-card > * {
   position: relative;
   z-index: 1;
  }

  .kshop-card:hover {
   border-color: rgba(232, 201, 122, 0.54);
   background: linear-gradient(180deg, rgba(15, 19, 34, 0.9), rgba(8, 10, 18, 0.92));
  }

  .kshop-card:hover .kshop-media {
   filter: brightness(1.08);
  }

  .kshop-card-head {
   display: flex;
   justify-content: space-between;
   gap: 8px;
   align-items: center;
  }

  .kshop-pill {
   min-height: 28px;
   display: inline-flex;
   align-items: center;
   border: 1px solid rgba(201, 168, 76, 0.36);
   border-radius: 999px;
   background: var(--kshop-box-bg-deep);
   color: var(--kshop-gold);
   padding: 0 9px;
   font-size: 0.76rem;
   font-weight: 800;
   box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .kshop-set {
   max-width: 118px;
   color: rgba(243, 239, 228, 0.7);
   border-color: rgba(201, 168, 76, 0.2);
   overflow: hidden;
   text-overflow: ellipsis;
   white-space: nowrap;
  }

  .kshop-card h2 {
   min-height: 34px;
   margin: 0;
   color: #f8f1df;
   font-family: "Cinzel", serif;
   font-size: 0.86rem;
   line-height: 1.22;
   text-transform: uppercase;
  }

  .kshop-id {
   margin: 0;
   color: rgba(243, 239, 228, 0.62);
   font-size: 0.82rem;
   font-weight: 600;
  }

  .kshop-media {
   min-height: 86px;
   display: grid;
   place-items: center;
  }

  .kshop-media img {
   width: min(92px, 55%);
   height: 92px;
   object-fit: contain;
   filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.45));
  }

  .kshop-price {
   margin: 0;
   color: rgba(217, 231, 255, 0.72);
   font-size: 0.82rem;
   font-weight: 700;
  }

  .kshop-price strong {
   display: block;
   margin-bottom: 3px;
   color: var(--kshop-gold);
   font-size: 0.92rem;
   font-weight: 900;
  }

  .kshop-buy-btn,
  .kshop-login-btn {
   width: 100%;
   min-height: 34px;
   display: inline-flex;
   align-items: center;
   justify-content: flex-start;
   padding: 0 10px;
   border: 1px solid rgba(201, 168, 76, 0.22);
   border-radius: 8px;
   background: var(--kshop-box-bg-deep);
   color: rgba(243, 239, 228, 0.62);
   font: inherit;
   font-size: 0.82rem;
   font-weight: 900;
   text-decoration: none;
   cursor: pointer;
   transition: border-color 0.14s ease, background 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease;
  }

  .kshop-buy-btn:not(:disabled) {
   justify-content: center;
   border-color: rgba(232, 201, 122, 0.78);
   background: var(--kshop-box-bg-active);
   color: #f6df92;
  }

  .kshop-buy-btn:hover:not(:disabled),
  .kshop-buy-btn:focus-visible:not(:disabled),
  .kshop-login-btn:hover,
  .kshop-login-btn:focus-visible {
   outline: none;
   transform: translateY(-1px);
   border-color: rgba(232, 201, 122, 0.86);
   box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);
  }

  .kshop-empty {
   min-height: 220px;
   grid-column: 1 / -1;
   display: grid;
   place-items: center;
   padding: 24px;
   border: 1px dashed rgba(201, 168, 76, 0.36);
   border-radius: 8px;
   background: var(--kshop-box-bg-deep);
   color: #f8f1df;
   text-align: center;
   font-weight: 800;
   box-shadow: var(--kshop-box-shadow);
  }

  .kshop-toast {
   position: fixed;
   left: 50%;
   bottom: 22px;
   z-index: 30;
   transform: translate(-50%, 12px);
   opacity: 0;
   min-width: min(420px, calc(100vw - 32px));
   border: 1px solid rgba(201, 168, 76, 0.42);
   border-radius: 8px;
   background: var(--kshop-box-bg);
   color: #f8f1df;
   padding: 12px 16px;
   font-weight: 800;
   box-shadow: 0 18px 42px rgba(0, 0, 0, 0.4);
   transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .kshop-toast.show {
   opacity: 1;
   transform: translate(-50%, 0);
  }

  @media (max-width: 1120px) {
   .kshop-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
   }

   .kshop-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
   }
  }

  @media (max-width: 720px) {
   .kshop-summary,
   .kshop-grid {
    grid-template-columns: 1fr;
   }

   .kshop-shell {
    width: min(100% - 24px, 1152px);
   }
  }
 </style>
</head>
<body class="krosmoshop-page">
 <header class="site-header">
  <div class="site-topbar">
   <a class="brand" href="/" aria-label="Krosmoz Card">
    <img src="/assets/ui/logo-carte.png" alt="">
    <span>Krosmoz Card</span>
   </a>

   <nav class="top-nav" aria-label="Navigation principale">
    <a class="nav-link" href="/">Accueil</a>
    <a class="nav-link" href="/pages/classement.html">Classement</a>
    <a class="nav-link" href="/pages/tutoriel.html">Tutoriel</a>
    <a class="nav-link" href="/sets">Sets</a>
   </nav>

   <div class="header-actions" aria-label="Liens rapides">
    <a class="header-action header-action-login" href="/auth/discord?returnTo=%2Fshop">Connexion</a>
   </div>
  </div>
 </header>

 <main class="kshop-shell">
  <h1 class="kshop-title">KrosmoShop</h1>
  <p class="kshop-subtitle">Boutique quotidienne de cartes premium.</p>

  <section class="kshop-summary" aria-label="Resume du KrosmoShop">
   <div class="kshop-stat">
    <strong id="kshopDay">Jour: --</strong>
    <span id="kshopReset">Reset dans --</span>
   </div>
   <div class="kshop-stat">
    <strong id="kshopKamas">Kamas: --</strong>
    <span id="kshopDiscount">Reduction shop: --</span>
   </div>
   <div class="kshop-stat">
    <strong id="kshopProgress">Achat(s): --</strong>
    <span id="kshopSpent">Total achetees: -- · Kamas depenses: --</span>
   </div>
   <button id="kshopBuyAllBtn" class="kshop-bulk-btn" type="button">Acheter tout le reste</button>
  </section>

  <section id="kshopGrid" class="kshop-grid" aria-live="polite">
   <div class="kshop-empty">Chargement du KrosmoShop...</div>
  </section>
 </main>

 <script>
  const state = {
   connected: false,
   loading: false,
   payload: null,
   items: []
  }

  const RARITY_ORDER = ["SSR", "S", "UR", "HR", "SR", "R", "U", "C"]

  function esc(value) {
   const div = document.createElement("div")
   div.textContent = String(value || "")
   return div.innerHTML
  }

  function fmt(value) {
   return Number(value || 0).toLocaleString("fr-FR")
  }

  function formatCountdown(ms) {
   const safe = Math.max(0, Number(ms || 0))
   const total = Math.floor(safe / 1000)
   const h = Math.floor(total / 3600)
   const m = Math.floor((total % 3600) / 60)
   return `${h}h${String(m).padStart(2, "0")}`
  }

  function getLoginUrl() {
   return `/auth/discord?returnTo=${encodeURIComponent(`${window.location.pathname || "/shop"}${window.location.search || ""}`)}`
  }

  async function api(path, options = {}) {
   try {
    const res = await fetch(path, { credentials: "same-origin", ...options })
    let data = null
    try { data = await res.json() } catch (_) {}
    return { ok: res.ok, status: res.status, data }
   } catch (_) {
    return { ok: false, status: 0, data: null }
   }
  }

  function toast(message, isError = false) {
   const existing = document.querySelector(".kshop-toast")
   if (existing) existing.remove()
   const el = document.createElement("div")
   el.className = "kshop-toast"
   el.textContent = message
   if (isError) el.style.borderColor = "rgba(255, 110, 110, 0.48)"
   document.body.appendChild(el)
   requestAnimationFrame(() => el.classList.add("show"))
   window.setTimeout(() => {
    el.classList.remove("show")
    window.setTimeout(() => el.remove(), 220)
   }, 2600)
  }

  function sortedItems(items = []) {
   return [...items].sort((a, b) => {
    const ar = RARITY_ORDER.indexOf(String(a?.rarity || "").toUpperCase())
    const br = RARITY_ORDER.indexOf(String(b?.rarity || "").toUpperCase())
    if (ar !== br) return ar - br
    return Number(b?.basePrice || b?.finalPrice || 0) - Number(a?.basePrice || a?.finalPrice || 0)
   })
  }

  function renderSummary(payload = {}) {
   const items = Array.isArray(payload.items) ? payload.items : []
   const wallet = payload.wallet || {}
   const progress = payload.progress || {}
   const stats = payload.stats || {}
   const boughtCount = Number(progress.boughtCount || items.filter((item) => item.purchased).length)
   const totalCount = Number(progress.totalCount || items.length)
   document.getElementById("kshopDay").textContent = `Jour: ${String(payload.shopDay || "--")}`
   document.getElementById("kshopReset").textContent = `Reset dans ${formatCountdown(payload.cooldownMs || 0)}`
   document.getElementById("kshopKamas").textContent = `Kamas: ${fmt(wallet.kamas || 0)}`
   document.getElementById("kshopDiscount").textContent = `Reduction shop: ${fmt(payload.discounts?.totalPercent || 0)}%`
   document.getElementById("kshopProgress").textContent = `Achat(s): ${fmt(boughtCount)}/${fmt(totalCount)}`
   document.getElementById("kshopSpent").textContent = `Total achetees: ${fmt(stats.cardsBought || boughtCount)} · Kamas depenses: ${fmt(stats.kamasSpent || 0)}`
   document.getElementById("kshopBuyAllBtn").disabled = state.loading || !state.connected || !items.some((item) => item.canBuy && !item.purchased)
  }

  function actionFor(item) {
   if (!state.connected) {
    return `<a class="kshop-login-btn" href="${esc(getLoginUrl())}">Connexion requise</a>`
   }
   if (item.purchased) {
    return `<button class="kshop-buy-btn" type="button" disabled>déjà achetée</button>`
   }
   if (!item.canBuy) {
    return `<button class="kshop-buy-btn" type="button" disabled>Manque ${fmt(item.missingKamas || item.finalPrice || 0)}</button>`
   }
   return `<button class="kshop-buy-btn" type="button" data-buy-card="${esc(item.cardId)}">Acheter</button>`
  }

  function cardTemplate(item) {
   const image = String(item.imageUrl || "/assets/ui/logo-carte.png")
   return `
    <article class="kshop-card">
     <div class="kshop-card-head">
      <span class="kshop-pill">${esc(item.rarity || "C")}</span>
      <span class="kshop-pill kshop-set">${esc(item.setName || item.set || "Set")}</span>
     </div>
     <h2>${esc(item.name || item.cardName || "Carte inconnue")}</h2>
     <p class="kshop-id">ID #${esc(item.cardId || item.id || "--")}</p>
     <div class="kshop-media">
      <img loading="lazy" src="${esc(image)}" alt="" onerror="this.src='/assets/ui/logo-carte.png';this.onerror=null;">
     </div>
     <p class="kshop-price">
      <strong>${fmt(item.finalPrice || item.basePrice || 0)} kamas</strong>
      Possedees: ${fmt(item.owned || 0)}
     </p>
     ${actionFor(item)}
    </article>
   `
  }

  function bindBuyButtons() {
   document.querySelectorAll("[data-buy-card]").forEach((button) => {
    button.addEventListener("click", async () => {
     const cardId = String(button.dataset.buyCard || "")
     if (!cardId) return
     const res = await api("/api/krosmoshop/buy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cardId })
     })
     if (!res.ok) {
      toast(res.data?.error || "Achat impossible.", true)
      return
     }
     toast("Achat confirme.")
     await refreshShop()
    })
   })
  }

  function renderGrid(payload = {}) {
   const grid = document.getElementById("kshopGrid")
   const items = sortedItems(payload.items || [])
   state.items = items
   if (state.loading) {
    grid.innerHTML = '<div class="kshop-empty">Chargement du KrosmoShop...</div>'
    return
   }
   if (!items.length) {
    grid.innerHTML = '<div class="kshop-empty">Aucune carte disponible pour le moment.</div>'
    return
   }
   grid.innerHTML = items.map(cardTemplate).join("")
   bindBuyButtons()
  }

  async function refreshShop() {
   state.loading = true
   renderGrid(state.payload || {})
   const res = await api("/api/krosmoshop/state")
   state.loading = false
   if (!res.ok) {
    state.connected = false
    state.payload = { items: [] }
    renderSummary(state.payload)
    renderGrid(state.payload)
    toast("Impossible de charger le KrosmoShop.", true)
    return
   }
   state.payload = res.data || {}
   state.connected = Boolean(state.payload.connected)
   renderSummary(state.payload)
   renderGrid(state.payload)
  }

  async function buyAll() {
   const purchasable = (state.items || []).filter((item) => item.canBuy && !item.purchased)
   if (!purchasable.length) return
   let bought = 0
   for (const item of purchasable) {
    const res = await api("/api/krosmoshop/buy", {
     method: "POST",
     headers: { "Content-Type": "application/json" },
     body: JSON.stringify({ cardId: item.cardId })
    })
    if (res.ok) bought += 1
   }
   toast(`${fmt(bought)}/${fmt(purchasable.length)} achat(s) effectue(s).`)
   await refreshShop()
  }

  document.getElementById("kshopBuyAllBtn").addEventListener("click", () => {
   buyAll().catch(() => toast("Achat impossible.", true))
  })

  refreshShop()
 </script>
</body>
</html>
