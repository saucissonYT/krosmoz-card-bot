<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Marché Live — Krosmoz Card</title>
 <meta name="theme-color" content="#c9a84c">
 <link rel="stylesheet" href="/css/style.css">
</head>
<body>
 <nav class="navbar scrolled">
  <div class="navbar-inner">
   <a href="/" class="navbar-brand"><span>🎴</span> KROSMOZ CARD</a>
   <ul class="navbar-links" id="navLinks">
    <li><a href="/">Accueil</a></li>
    <li><a href="/leaderboard">Classement</a></li>
    <li><a href="/cards">Cartes</a></li>
    <li><a href="/market" class="active">Marché</a></li>
    <li><a href="/guild">Guildes</a></li>
   </ul>
   <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  </div>
 </nav>

 <div class="page">
  <div class="container">
   <section style="padding-top:40px">
    <h1 class="section-title fade-in">🛒 Marché en temps réel</h1>
    <p class="section-subtitle fade-in stagger-1">Cartes et fragments listés par les joueurs</p>

    <div class="toolbar fade-in stagger-2">
     <input id="searchInput" class="input" placeholder="Nom de carte..." />
     <select id="typeSelect" class="input input-select">
      <option value="all">Type: Tous</option>
      <option value="card">Cartes</option>
      <option value="fragment">Fragments</option>
     </select>
     <select id="raritySelect" class="input input-select">
      <option value="">Rareté (toutes)</option>
      <option>C</option><option>U</option><option>R</option><option>SR</option>
      <option>HR</option><option>UR</option><option>S</option><option>SSR</option>
     </select>
     <select id="sortSelect" class="input input-select">
      <option value="recent">Tri: Récent</option>
      <option value="price_asc">Prix croissant</option>
      <option value="price_desc">Prix décroissant</option>
     </select>
     <button id="refreshBtn" class="btn btn-outline">Actualiser</button>
    </div>

    <div id="resultMeta" class="result-meta"></div>
    <div id="marketGrid" class="catalog-grid"></div>
    <div id="pagination" class="pagination"></div>
   </section>

   <footer class="footer">
    <p>🎴 <a href="/">Krosmoz Card</a> — krosmozcard.fr</p>
   </footer>
  </div>
 </div>

 <script>
 document.getElementById("navToggle").addEventListener("click", () => {
  document.getElementById("navLinks").classList.toggle("open")
 })

 const state = { page: 1, limit: 20 }

 function qs() {
  const p = new URLSearchParams()
  p.set("page", String(state.page))
  p.set("limit", String(state.limit))
  const q = document.getElementById("searchInput").value.trim()
  const type = document.getElementById("typeSelect").value
  const rarity = document.getElementById("raritySelect").value
  const sort = document.getElementById("sortSelect").value
  if (q) p.set("q", q)
  if (type) p.set("type", type)
  if (rarity) p.set("rarity", rarity)
  if (sort) p.set("sort", sort)
  return p.toString()
 }

 function escapeHtml(str) {
  const div = document.createElement("div")
  div.textContent = str
  return div.innerHTML
 }

 function listingCard(item) {
  const seller = item.sellerProfile?.displayName || item.seller
  const fragment = item.type === "fragment"
   ? `<p>Fragment: slot ${item.fragmentNumber}/5</p><p>Prix min: ${item.minimumPrice?.toLocaleString("fr-FR")} kamas</p>`
   : `<p>Type: carte complète</p>`
  return `
   <article class="catalog-card">
    <div class="catalog-card-head">
     <span class="chip chip-rarity">${item.rarity}</span>
     <span class="chip">${item.type === "fragment" ? "Fragment" : "Carte"}</span>
    </div>
    <h3>${escapeHtml(item.cardName)}</h3>
    <p>Set: ${escapeHtml(item.setName)}</p>
    ${fragment}
    <p>Vendeur: ${escapeHtml(seller)}</p>
    <p class="price-line">${Number(item.price || 0).toLocaleString("fr-FR")} kamas</p>
   </article>
  `
 }

 function renderPagination(page, pages) {
  const root = document.getElementById("pagination")
  if (pages <= 1) { root.innerHTML = ""; return }
  root.innerHTML = `
   <button class="btn btn-outline" ${page <= 1 ? "disabled" : ""} data-page="${page - 1}">← Précédent</button>
   <span class="pagination-meta">Page ${page} / ${pages}</span>
   <button class="btn btn-outline" ${page >= pages ? "disabled" : ""} data-page="${page + 1}">Suivant →</button>
  `
  root.querySelectorAll("button[data-page]").forEach((btn) => {
   btn.addEventListener("click", () => {
    state.page = Number(btn.dataset.page)
    loadMarket()
   })
  })
 }

 async function loadMarket() {
  const grid = document.getElementById("marketGrid")
  const meta = document.getElementById("resultMeta")
  grid.innerHTML = `<div class="loading"><div class="spinner"></div><p>Chargement du marché...</p></div>`

  try {
   const res = await fetch(`/api/market?${qs()}`)
   const data = await res.json()
   state.page = data.page
   meta.textContent = `${(data.total || 0).toLocaleString("fr-FR")} annonces actives`

   const items = data.items || []
   if (!items.length) {
    grid.innerHTML = `<div class="loading"><p>Aucune annonce trouvée.</p></div>`
    renderPagination(1, 1)
    return
   }

   grid.innerHTML = items.map(listingCard).join("")
   renderPagination(data.page, data.pages)
  } catch (_) {
   grid.innerHTML = `<div class="loading"><p style="color:var(--rarity-HR)">Erreur de chargement.</p></div>`
  }
 }

 document.getElementById("refreshBtn").addEventListener("click", () => {
  state.page = 1
  loadMarket()
 })
 document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { state.page = 1; loadMarket() }
 })
 document.getElementById("typeSelect").addEventListener("change", () => { state.page = 1; loadMarket() })
 document.getElementById("raritySelect").addEventListener("change", () => { state.page = 1; loadMarket() })
 document.getElementById("sortSelect").addEventListener("change", () => { state.page = 1; loadMarket() })

 loadMarket()
 </script>
</body>
</html>
