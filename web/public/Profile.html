<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Profil ? Krosmoz Card</title>
 <meta name="theme-color" content="#c9a84c">
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
 <link rel="stylesheet" href="/css/style.css">
</head>
<body class="profile-page">

 <header class="site-header">
  <div class="site-topbar">
   <a class="brand" href="/" aria-label="Krosmoz Card">
    <img src="/assets/ui/logo-carte.png" alt="">
    <span>Krosmoz Card</span>
   </a>

   <nav class="top-nav" aria-label="Navigation principale">
    <a class="nav-link" href="/">Accueil</a>
    <a class="nav-link" href="/pages/classement.html">Classement</a>
    <a class="nav-link" href="/pages/tutoriel.html">Tutoriel</a>
    <a class="nav-link" href="/sets">Sets</a>
   </nav>

   <div class="header-actions" aria-label="Liens rapides">
    <a class="header-action header-action-login" href="/auth/discord?returnTo=%2Fprofile">Connexion</a>
    <a
     class="header-social header-social-discord"
     href="https://discord.com/invite/ekEkqhZwbZ"
     target="_blank"
     rel="noopener"
     aria-label="Discord">
     <svg viewBox="0 0 127.14 96.36" aria-hidden="true">
      <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36a77.7,77.7,0,0,0,6.89-11.27,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2.05,20.4,9.45,42.54,9.45,62.69,0,.87,.71,1.76,1.39,2.67,2.05a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.26A105.25,105.25,0,0,0,126.94,80.2C129.67,52.84,122.27,29.11,107.7,8.07ZM42.45,65.69c-6.27,0-11.41-5.74-11.41-12.82S36.07,40.05,42.45,40.05,53.8,45.8,53.8,52.87,48.82,65.69,42.45,65.69Zm42.24,0c-6.27,0-11.4-5.74-11.4-12.82S78.32,40.05,84.69,40.05,96,45.8,96,52.87,91.07,65.69,84.69,65.69Z"></path>
     </svg>
    </a>
    <a
     class="header-social header-social-github"
     href="https://github.com/saucissonYT/krosmoz-card-bot"
     target="_blank"
     rel="noopener"
     aria-label="GitHub">
     <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38l-.01-1.34c-2.22.48-2.69-1.07-2.69-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.81.06 1.23.83 1.23.83.72 1.23 1.9.88 2.36.67.07-.52.28-.88.51-1.08-1.77-.2-3.64-.89-3.64-3.95 0-.87.31-1.58.82-2.14-.08-.2-.36-1.01.08-2.1 0 0 .67-.22 2.2.82A7.64,7.64,0,0,1,8,4.77c.68,0,1.37,.09,2.01,.27,1.53-1.04,2.2-.82,2.2-.82,.44,1.09,.16,1.9,.08,2.1,.51,.56,.82,1.27,.82,2.14,0,3.07-1.87,3.75-3.65,3.95,.29,.25,.54,.74,.54,1.49l-.01,2.2c0,.21,.14,.46,.55.38A8,8,0,0,0,16,8C16,3.58,12.42,0,8,0Z"></path>
     </svg>
    </a>
   </div>
  </div>
 </header>

 <div class="page">
  <div class="container">
   <div id="profileContent">
    <div class="loading">
     <div class="spinner"></div>
     <p>Chargement du profil⬦</p>
    </div>
   </div>

   <footer class="footer">
    <p>🎴 <a href="/">Krosmoz Card</a> · krosmozcard.fr</p>
    <p style="margin-top:8px"><a href="/about">? propos · Contact · Mentions légales</a></p>
   </footer>
  </div>
 </div>

 <script src="/js/web-auth.js?v=20260512-nav-unified"></script>
 <script>
 /* -------- Helpers -------- */
 function escapeHTML(str) {
  const div = document.createElement("div")
  div.textContent = str
  return div.innerHTML
 }

 function escapeAttr(str) {
  return escapeHTML(String(str || "")).replace(/"/g, "&quot;")
 }

 function formatNumber(n) {
  return (n || 0).toLocaleString("fr-FR")
 }

 function timeSince(ts) {
  if (!ts) return "?"
  const days = Math.floor((Date.now() - new Date(ts).getTime()) / 86400000)
  if (days < 1) return "Aujourd'hui"
  if (days === 1) return "Hier"
  if (days < 30) return `${days} jours`
  if (days < 365) return `${Math.floor(days / 30)} mois`
  return `${Math.floor(days / 365)} an(s)`
 }

 const RARITY_COLORS = {
  C: "#95a5a6", U: "#2ecc71", R: "#3498db", SR: "#9b59b6",
  HR: "#e74c3c", UR: "#f1c40f", S: "#ecf0f1", SSR: "#ffcc00"
 }

 const RARITY_EMOJI = {
  C: "🟤", U: "🟢", R: "🔵", SR: "🟣",
  HR: "🔴", UR: "🟡", S: "⚪", SSR: "🌈"
 }

 /* -------- Get user ID from URL -------- */
 const pathParts = window.location.pathname.split("/")
 const maybeId = pathParts[pathParts.length - 1]
 const userId = /^\d{16,22}$/.test(maybeId) ? maybeId : null

 /* -------- Load profile -------- */
 async function loadProfile() {
  const container = document.getElementById("profileContent")

  if (!userId) {
   try {
    const meRes = await fetch("/api/me", { credentials: "same-origin" })
    if (meRes.ok) {
     const me = await meRes.json()
     if (me?.id) {
      window.location.replace(`/profile/${me.id}`)
      return
     }
    }
   } catch (_) {}

   container.innerHTML = `
    <div class="loading">
     <p style="color: var(--rarity-HR)">⚠️ Connexion Discord requise pour voir ton profil.</p>
     <p style="margin-top:12px"><a href="/auth/discord?returnTo=%2Fprofile">Se connecter</a></p>
     <p style="margin-top:12px"><a href="/leaderboard">? Retour au classement</a></p>
    </div>`
   return
  }

  try {
  const res = await fetch(`/api/profile/${userId}?track=1`)

   if (!res.ok) {
    container.innerHTML = `
     <div class="loading">
      <p style="color: var(--rarity-HR)">⚠️ Joueur introuvable</p>
      <p style="margin-top:12px"><a href="/leaderboard">? Retour au classement</a></p>
     </div>`
    return
   }

   const p = await res.json()
   let me = null
   try {
    const meRes = await fetch("/api/me", { credentials: "same-origin" })
    if (meRes.ok) me = await meRes.json()
   } catch (_) {}

   const isOwner = Boolean(me?.id && String(me.id) === String(userId))
   const name = escapeHTML(p.discord?.displayName || userId)
   const avatar = p.discord?.avatarURL || "https://cdn.discordapp.com/embed/avatars/0.png"

   document.title = `${p.discord?.displayName || "Profil"} ? Krosmoz Card`

   /* ---- Guild tag ---- */
   const guildTag = p.guild
    ? `<span class="profile-tag">${p.guild.emoji || "🛡️"} <span class="tag-gold">${escapeHTML(p.guild.name)}</span> Niv.${p.guild.level}</span>`
    : `<span class="profile-tag">Pas de guilde</span>`

   /* ---- Set progress bars ---- */
   const setsHTML = (p.setProgress || []).map(set => {
    const pctClass = set.pct >= 100 ? "pct-100" : set.pct >= 70 ? "pct-70" : set.pct >= 50 ? "pct-50" : "pct-0"
    return `
     <div class="set-item">
      <div class="set-header">
       <span class="set-name">${escapeHTML(set.name)}</span>
       <span class="set-count">${set.owned}/${set.total} ? ${set.pct}%</span>
      </div>
      <div class="set-bar">
       <div class="set-bar-fill ${pctClass}" style="width: ${set.pct}%"></div>
      </div>
     </div>`
   }).join("")

   /* ---- Rarity breakdown ---- */
   const rarities = ["C", "U", "R", "SR", "HR", "UR", "S", "SSR"]
   const rarityHTML = rarities.map(r => `
    <div class="rarity-item">
     <div class="rarity-label" style="color: ${RARITY_COLORS[r]}">${RARITY_EMOJI[r]} ${r}</div>
     <div class="rarity-count" style="color: ${RARITY_COLORS[r]}">${formatNumber(p.rarityBreakdown?.[r] || 0)}</div>
    </div>
   `).join("")

   const titles = Array.isArray(p.titles) ? p.titles.map((t) => String(t)) : ["Nouveau"]
   if (!titles.includes(String(p.title || ""))) titles.push(String(p.title || "Nouveau"))

   const badges = Array.isArray(p.badges) ? p.badges : []
   const badgesHTML = badges.length
    ? badges.map((b) => `
      <span class="profile-badge-chip" title="${escapeAttr(b?.name || "Badge")}">
       <span class="badge-icon">${escapeHTML(String(b?.badge || "🏅"))}</span>
       <span class="badge-label">${escapeHTML(String(b?.label || b?.name || "Badge"))}</span>
      </span>
     `).join("")
    : `<span class="profile-badge-empty">Aucun badge débloqué.</span>`

   const titleEditorHTML = isOwner ? `
    <div class="profile-title-editor">
     <label for="profileTitleSelect">Titre actif</label>
     <div class="profile-title-editor-row">
      <select id="profileTitleSelect" class="input input-select">
       ${titles.map((t) => `<option value="${escapeAttr(t)}" ${t === p.title ? "selected" : ""}>${escapeHTML(t)}</option>`).join("")}
      </select>
      <button id="saveProfileTitleBtn" type="button" class="btn btn-outline">Enregistrer</button>
     </div>
     <p id="profileTitleStatus" class="profile-title-status"></p>
    </div>
   ` : ""

   /* ---- Pity bars ---- */
   const pityHTML = (p.pity || []).map(pity => {
    const ssrPct = Math.round((pity.SSR / 50) * 100)
    const sPct = Math.round((pity.S / 30) * 100)
    const urPct = Math.round((pity.UR / 10) * 100)
    const ssrClass = ssrPct >= 90 ? "pct-100" : ssrPct >= 60 ? "pct-70" : ssrPct >= 30 ? "pct-50" : "pct-0"
    const sClass = sPct >= 90 ? "pct-100" : sPct >= 60 ? "pct-70" : sPct >= 30 ? "pct-50" : "pct-0"
    const urClass = urPct >= 90 ? "pct-100" : urPct >= 60 ? "pct-70" : urPct >= 30 ? "pct-50" : "pct-0"
    return `
     <div style="min-width:0">
      <div style="font-weight:500;font-size:0.95rem;margin-bottom:8px">${escapeHTML(pity.setName)}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
       <span style="min-width:55px;font-size:0.8rem;color:var(--text-muted)">🌈 SSR</span>
       <div class="set-bar" style="flex:1"><div class="set-bar-fill ${ssrClass}" style="width:${ssrPct}%"></div></div>
       <span style="font-size:0.8rem;font-family:'JetBrains Mono',monospace;min-width:40px;text-align:right">${pity.SSR}/50</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
       <span style="min-width:55px;font-size:0.8rem;color:var(--text-muted)">? S</span>
       <div class="set-bar" style="flex:1"><div class="set-bar-fill ${sClass}" style="width:${sPct}%"></div></div>
       <span style="font-size:0.8rem;font-family:'JetBrains Mono',monospace;min-width:40px;text-align:right">${pity.S}/30</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
       <span style="min-width:55px;font-size:0.8rem;color:var(--text-muted)">🟡 UR</span>
       <div class="set-bar" style="flex:1"><div class="set-bar-fill ${urClass}" style="width:${urPct}%"></div></div>
       <span style="font-size:0.8rem;font-family:'JetBrains Mono',monospace;min-width:40px;text-align:right">${pity.UR}/10</span>
      </div>
     </div>`
   }).join("")

   /* ---- Render ---- */
   container.innerHTML = `
    <div style="margin-bottom:20px">
     <a href="/leaderboard" style="font-size:0.9rem; color:var(--text-muted)">? Retour au classement</a>
    </div>

    <!-- HEADER -->
    <div class="profile-header fade-in">
     <img src="${avatar}" alt="" class="profile-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
     <div class="profile-info">
      <h1>${name}</h1>
      <div class="profile-meta">
       <span class="profile-tag">⭐ Niveau <span class="tag-gold">${p.level}</span></span>
       <span class="profile-tag">🏅 ${escapeHTML(p.title)}</span>
       ${guildTag}
      </div>
      <div class="xp-bar-wrapper">
       <div class="xp-bar-label">
        <span>XP</span>
        <span>${p.level >= 200 ? "MAX" : `${formatNumber(p.xp)} / ${formatNumber(p.xpRequired)}`}</span>
       </div>
       <div class="xp-bar">
        <div class="xp-bar-fill" style="width: ${p.xpPercent}%"></div>
       </div>
      </div>
      <div class="profile-badges-block">
       <div class="profile-badges-title">Badges</div>
       <div class="profile-badges-list">
        ${badgesHTML}
       </div>
      </div>
      ${titleEditorHTML}
     </div>
    </div>

    <!-- STATS GRID -->
    <div class="profile-grid">

     <!-- Stats principales -->
     <div class="profile-card fade-in stagger-1">
      <h2>📊 Statistiques</h2>
      <div class="stat-row">
       <span class="stat-row-label">🎴 Cartes possédées</span>
       <span class="stat-row-value">${formatNumber(p.totalCards)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">📚 Cartes uniques</span>
       <span class="stat-row-value">${formatNumber(p.uniqueCards)} / ${formatNumber(p.maxCards)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">💰 Kamas</span>
       <span class="stat-row-value">${formatNumber(p.kamas)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">🏆 Succès</span>
       <span class="stat-row-value">${formatNumber(p.achievements)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">📦 Packs ouverts</span>
       <span class="stat-row-value">${formatNumber(p.stats.packsOpened)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">⚗️ Fusions</span>
       <span class="stat-row-value">${formatNumber(p.stats.fusions)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">🌈 SSR tirées</span>
       <span class="stat-row-value">${formatNumber(p.stats.ssrPulled)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">? Shiny SSR</span>
       <span class="stat-row-value">${formatNumber(p.stats.shinySSR)}</span>
      </div>
     </div>

     <!-- Activité -->
     <div class="profile-card fade-in stagger-2">
      <h2>📈 Activité</h2>
      <div class="stat-row">
       <span class="stat-row-label">🔥 Fusion critiques</span>
       <span class="stat-row-value">${formatNumber(p.stats.fusionCrit)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">🎟️ Event packs</span>
       <span class="stat-row-value">${formatNumber(p.stats.eventPacksOpened)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">📅 Streak daily</span>
       <span class="stat-row-value">${formatNumber(p.stats.dailyStreak)} jours</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">⚡ Streak activité</span>
       <span class="stat-row-value">${formatNumber(p.stats.activityStreak)} jours</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">💸 Cartes vendues</span>
       <span class="stat-row-value">${formatNumber(p.stats.cardsSold)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">🛒 Cartes achetées</span>
       <span class="stat-row-value">${formatNumber(p.stats.cardsBought)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">🕒 Inscrit depuis</span>
       <span class="stat-row-value">${timeSince(p.stats.createdAt)}</span>
      </div>
      <div class="stat-row">
       <span class="stat-row-label">⭐ XP totale</span>
       <span class="stat-row-value">${formatNumber(p.totalXp)}</span>
      </div>
     </div>

    </div>

    <!-- Collection & Raretés -->
    <div class="profile-grid">

     <!-- Collection par set -->
     <div class="profile-card fade-in stagger-3">
      <h2>📚 Collection par set</h2>
      ${setsHTML || '<p style="color:var(--text-muted)">Aucun set disponible</p>'}
     </div>

     <!-- Répartition raretés -->
     <div class="profile-card fade-in stagger-4">
      <h2>🌈 Répartition par rareté</h2>
      <div class="rarity-grid">
       ${rarityHTML}
      </div>

      <div style="margin-top:24px">
       <h2 style="font-family:'Cinzel',serif; font-size:1.1rem; color:var(--gold-light); margin-bottom:12px">🏅 Titres débloqués</h2>
       <div style="display:flex; flex-wrap:wrap; gap:6px">
        ${titles.map(t => `
         <span style="
          padding: 4px 12px;
          background: ${t === p.title ? 'var(--gold-subtle)' : 'var(--bg-elevated)'};
          border: 1px solid ${t === p.title ? 'var(--gold)' : 'rgba(255,255,255,0.04)'};
          border-radius: 100px;
          font-size: 0.85rem;
          color: ${t === p.title ? 'var(--gold)' : 'var(--text-muted)'};
         ">${escapeHTML(t)}</span>
        `).join("")}
       </div>
      </div>
     </div>

    </div>

    <!-- Pity par set -->
    <div class="profile-grid">
     <div class="profile-card fade-in stagger-4" style="grid-column: 1 / -1">
      <h2>🎯 Pity par set</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">
       ${pityHTML || '<p style="color:var(--text-muted)">Aucune donnée pity</p>'}
      </div>
     </div>
    </div>`

   /* Animate bars after render */
   requestAnimationFrame(() => {
    document.querySelectorAll(".set-bar-fill").forEach(el => {
     const w = el.style.width
     el.style.width = "0%"
     requestAnimationFrame(() => { el.style.width = w })
    })
    const xpFill = document.querySelector(".xp-bar-fill")
    if (xpFill) {
     const w = xpFill.style.width
     xpFill.style.width = "0%"
     requestAnimationFrame(() => { xpFill.style.width = w })
    }
   })

   const saveTitleBtn = document.getElementById("saveProfileTitleBtn")
   const titleSelect = document.getElementById("profileTitleSelect")
   const titleStatus = document.getElementById("profileTitleStatus")
   if (saveTitleBtn && titleSelect) {
    const initialTitle = String(p.title || "")
    const syncTitleButtonState = () => {
      saveTitleBtn.disabled = String(titleSelect.value || "") === initialTitle
    }
    syncTitleButtonState()
    titleSelect.addEventListener("change", syncTitleButtonState)

    saveTitleBtn.addEventListener("click", async () => {
     const nextTitle = String(titleSelect.value || "").trim()
     if (!nextTitle || nextTitle === initialTitle) return

     saveTitleBtn.disabled = true
     if (titleStatus) titleStatus.textContent = "Mise à jour du titre..."

     try {
      const updateRes = await fetch("/api/me/title", {
       method: "POST",
       credentials: "same-origin",
       headers: { "Content-Type": "application/json" },
       body: JSON.stringify({ title: nextTitle })
      })
      const updateData = await updateRes.json().catch(() => ({}))
      if (!updateRes.ok) throw new Error(updateData?.error || "Impossible de changer le titre.")
      if (titleStatus) titleStatus.textContent = "Titre mis à jour."
      await loadProfile()
     } catch (e) {
      if (titleStatus) titleStatus.textContent = e?.message || "Erreur serveur."
      syncTitleButtonState()
     }
    })
   }

  } catch (err) {
   console.error("Profile error:", err)
   container.innerHTML = `
    <div class="loading">
     <p style="color: var(--rarity-HR)">Erreur de chargement</p>
     <p style="margin-top:12px"><a href="/leaderboard">? Retour au classement</a></p>
    </div>`
  }
 }

 loadProfile()
 </script>

</body>
</html>
